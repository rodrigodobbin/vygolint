id: D13
categoria: interacao
diretriz: "O jogo permite o desenvolvimento de tarefas e missões em grupo"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D13.1
    nivel: AAA
    enunciado: "Existe ao menos uma missão ou tarefa que só se conclui quando cada um de dois ou mais jogadores diferentes realiza ao menos uma ação prevista para ela; jogador é uma pessoa que joga, e personagem não jogável não conta; missão ou tarefa é uma unidade do jogo com objetivo e condição de conclusão próprios"
    nivel_justificativa:
      essencialidade: media
      viabilidade: baixa
      texto: "Em Vigotski, a interação social é a origem das funções psicológicas superiores, e uma missão que só se conclui com a ação de mais de um jogador cria a situação em que a ZDP entre pares pode se formar. A essencialidade é média porque a interação também ocorre por comunicação entre jogadores (D06, D07) e fora do jogo. Exige multijogador, estado compartilhado entre jogadores e uma condição de conclusão que dependa de mais de uma pessoa, além de grupos reunidos no mesmo momento; viabilidade baixa."
    evidencia:
      codigo:
        procedimento: "Localizar a condição de conclusão das missões e tarefas e verificar se ela lê ações ou contribuições de mais de um identificador de jogador. Jogador é uma pessoa que joga, e personagem não jogável não conta; missão ou tarefa é uma unidade do jogo com objetivo e condição de conclusão próprios; a missão exige mais de um jogador quando a conclusão só é registrada depois da ação prevista de cada um de ao menos dois jogadores diferentes"
        indicadores:
          - "existe missão ou tarefa cuja condição de conclusão verifica ações de dois ou mais identificadores de jogador diferentes"
          - "se a missão aceita dois ou mais jogadores mas a condição de conclusão verifica a ação de apenas um deles, anotar (indica o estado parcial)"
          - "a conclusão não é registrada se a ação prevista de algum desses jogadores não ocorreu"
          - "existe sessão ou sala que aceita dois ou mais jogadores na mesma missão ou tarefa"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente as missões e tarefas em grupo. Jogador é uma pessoa que joga, e personagem não jogável não conta; missão ou tarefa é uma unidade do jogo com objetivo e condição de conclusão próprios; a missão exige mais de um jogador quando a conclusão só é registrada depois da ação prevista de cada um de ao menos dois jogadores diferentes"
        indicadores:
          - "o GDD descreve missão ou tarefa com ações previstas para dois ou mais jogadores"
          - "o GDD descreve que a missão ou tarefa só se conclui depois da ação prevista de cada um desses jogadores"
          - "se o GDD descreve missão realizada em conjunto cuja conclusão depende da ação de apenas um dos jogadores, anotar (indica o estado parcial)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou documentação: ele não mostra que a conclusão exige mais de um jogador. Registrar sessão com dois ou mais jogadores na mesma missão ou tarefa, as ações de cada um e o momento da conclusão. Jogador é uma pessoa que joga, e personagem não jogável não conta; a missão exige mais de um jogador quando a conclusão só é registrada depois da ação prevista de cada um de ao menos dois jogadores diferentes"
        indicadores:
          - "dois ou mais jogadores atuam na mesma missão ou tarefa na mesma sessão"
          - "a conclusão da missão ou tarefa é registrada depois da ação de cada um desses jogadores"
          - "se a conclusão é registrada com a ação de apenas um dos jogadores presentes, anotar (indica o estado parcial)"
    escala:
      atendido: "Existe ao menos uma missão ou tarefa que só se conclui depois da ação prevista de cada um de dois ou mais jogadores diferentes"
      parcial: "Existe missão ou tarefa que dois ou mais jogadores realizam juntos, mas o jogo registra a conclusão com a ação de apenas um deles"
      nao_atendido: "Todas as missões e tarefas são realizadas por um único jogador"
    depende_de:
      - [D06.1, D07.1]
