id: D20
categoria: mediacao
diretriz: "O jogo pode fornecer pista para o jogador resolver problemas"
fonte: "Carvalho (2020), Quadro 3"
modalidade: pode
aplicabilidade: null
criterios:
  - id: D20.1
    nivel: AA
    enunciado: "Em ao menos um desafio existe um mecanismo de ajuda que fornece pista, isto é, informação sobre como resolver o desafio que não entrega a solução completa; Definições: desafio é cada missão ou minijogo; mecanismo de ajuda é uma ação explícita do jogador dedicada a obter ajuda (botão ou comando de dica, interação com personagem ou objeto que só oferece ajuda) ou um disparo automático do jogo por critério acumulado (número de tentativas ou tempo sem progresso no desafio) que exibe ao jogador, durante um desafio em curso, informação sobre como resolvê-lo; mensagem exibida em reação a uma única ação incorreta é feedback (D17) e ajuda de outro jogador é tratada em D16, e nenhuma das duas é mecanismo de ajuda; solução completa é a resposta final do desafio ou a sequência inteira de ações que o conclui; a informação de um mecanismo entrega a solução completa quando, depois de exibida, concluir o desafio só exige reproduzi-la, sem nenhuma decisão do jogador (inclui reduzir as opções a uma só e inclui o jogo executar a solução); pista é a informação de um mecanismo de ajuda que não entrega a solução completa"
    nivel_justificativa:
      essencialidade: media
      viabilidade: alta
      texto: "Na zona de desenvolvimento proximal o jogador resolve com ajuda o que ainda não resolve sozinho, e a ajuda cumpre esse papel quando indica um caminho sem realizar a tarefa por ele; uma pista que entrega a resposta substitui a atividade do jogador. A diretriz é opcional na redação de Carvalho (pode), por isso o nível nunca é A, e a essencialidade é média porque outras formas de mediação (D16, D17, D18, D21 e D22) também aproximam o jogador da solução. Botão de dica com um texto por desafio é recurso de baixo custo; viabilidade alta."
    evidencia:
      codigo:
        procedimento: "Localizar, em cada desafio, botões ou comandos de dica, personagens ou objetos de ajuda e disparos automáticos por contagem de tentativas ou por tempo (contadores de tentativas, temporizadores de inatividade). Para cada mecanismo, ler o conteúdo da informação exibida (texto, imagem, destaque, execução de ações) e verificar se, depois dela, concluir o desafio exige decisão do jogador ou se a informação é a resposta final ou executa a solução (por exemplo, exibe o valor guardado como gabarito, destaca a única opção restante ou aciona as ações finais). Definições: desafio é cada missão ou minijogo; mecanismo de ajuda é uma ação explícita do jogador dedicada a obter ajuda (botão ou comando de dica, interação com personagem ou objeto que só oferece ajuda) ou um disparo automático do jogo por critério acumulado (número de tentativas ou tempo sem progresso no desafio) que exibe ao jogador, durante um desafio em curso, informação sobre como resolvê-lo; mensagem exibida em reação a uma única ação incorreta é feedback (D17) e ajuda de outro jogador é tratada em D16, e nenhuma das duas é mecanismo de ajuda; solução completa é a resposta final do desafio ou a sequência inteira de ações que o conclui; a informação de um mecanismo entrega a solução completa quando, depois de exibida, concluir o desafio só exige reproduzi-la, sem nenhuma decisão do jogador (inclui reduzir as opções a uma só e inclui o jogo executar a solução); pista é a informação de um mecanismo de ajuda que não entrega a solução completa. Regra de desempate: se o código e o vídeo divergirem sobre um mecanismo, vale o código; o vídeo comprova um mecanismo observado, mas a ausência de mecanismo no vídeo não prova que o jogo não o oferece"
        indicadores:
          - "todos os mecanismos de ajuda foram listados, cada um com o desafio em que ocorre, a forma de acionamento (jogador ou disparo automático) e o critério do disparo, se houver (mínimo 0 mecanismos)"
          - "a informação exibida por cada mecanismo foi registrada e classificada como pista (concluir o desafio ainda exige decisão do jogador) ou como entrega da solução completa"
          - "ao menos um mecanismo listado é pista, nos termos da definição (indica o estado atendido); se todos os mecanismos listados entregam a solução completa, indica o estado parcial"
      documentacao: null
      video:
        procedimento: "O vídeo só confirma a evidência de código. Observar, em cada desafio gravado, os momentos em que o jogador aciona um mecanismo de ajuda ou o jogo o dispara e o que ocorre depois: se o desafio segue em curso e o jogador ainda precisa decidir, ou se o jogo exibe a resposta final ou executa a solução. Definições: desafio é cada missão ou minijogo; mecanismo de ajuda é uma ação explícita do jogador dedicada a obter ajuda (botão ou comando de dica, interação com personagem ou objeto que só oferece ajuda) ou um disparo automático do jogo por critério acumulado (número de tentativas ou tempo sem progresso no desafio) que exibe ao jogador, durante um desafio em curso, informação sobre como resolvê-lo; mensagem exibida em reação a uma única ação incorreta é feedback (D17) e ajuda de outro jogador é tratada em D16, e nenhuma das duas é mecanismo de ajuda; solução completa é a resposta final do desafio ou a sequência inteira de ações que o conclui; a informação de um mecanismo entrega a solução completa quando, depois de exibida, concluir o desafio só exige reproduzi-la, sem nenhuma decisão do jogador (inclui reduzir as opções a uma só e inclui o jogo executar a solução); pista é a informação de um mecanismo de ajuda que não entrega a solução completa. Regra de desempate: se o código e o vídeo divergirem sobre um mecanismo, vale o código; o vídeo comprova um mecanismo observado, mas a ausência de mecanismo no vídeo não prova que o jogo não o oferece"
        indicadores:
          - "cada mecanismo de ajuda observado foi registrado com timestamp, forma de acionamento e informação exibida (mínimo 0 mecanismos)"
          - "para cada mecanismo registrado, foi anotado se o desafio segue em curso e o jogador ainda precisa decidir (pista) ou se o jogo exibe a resposta final ou executa a solução (entrega da solução completa)"
    escala:
      atendido: "Em ao menos um desafio existe um mecanismo de ajuda cuja informação é pista, nos termos do enunciado"
      parcial: "Existe ao menos um mecanismo de ajuda, mas todos os mecanismos de ajuda existentes entregam a solução completa, nos termos do enunciado"
      nao_atendido: "Não existe mecanismo de ajuda, nos termos do enunciado, em nenhum desafio"
    depende_de: []
