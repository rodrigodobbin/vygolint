id: D10
categoria: interacao
diretriz: "O jogo deve viabilizar o comportamento ativo do jogador"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D10.1
    nivel: A
    enunciado: "Nenhum trecho passivo das partes avaliadas do jogo tem comprimento integral maior que 120 segundos"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: alta
      texto: "Para Vigotski, o conhecimento se constrói na atividade do sujeito, e não na recepção de informação pronta. Longos trechos em que o jogador só assiste ou lê o tornam espectador e interrompem a atividade que sustenta a aprendizagem. A teoria justifica a existência de um limite, não o seu valor: os 120 segundos são uma convenção operacional do vygolint, fixa e igual para qualquer jogo. O limite é absoluto, e não uma fração da gravação, porque uma fração dependeria da duração da sessão gravada e faria o mesmo jogo receber graus diferentes conforme o tempo jogado. O comprimento é medido pelo conteúdo do jogo e não pelo ritmo do jogador gravado, para que gravações diferentes do mesmo jogo cheguem ao mesmo grau. Encurtar cenas e textos corridos ou intercalar ações do jogador é decisão de projeto, sem custo técnico especial; viabilidade alta."
    evidencia:
      codigo:
        procedimento: "Localizar cenas, animações, vídeos e sequências de texto ou diálogo, nos dados de cena e de diálogo, nas durações de linhas do tempo (timeline), clipes e animações, e nos marcadores de pular cena (skip flags). Para cada uma, verificar nos manipuladores de entrada ativos durante ela se o jogador tem alguma ação que altere o estado do jogo; se não tem, é trecho passivo. Calcular o comprimento integral: duração total da cena, ou soma das esperas mínimas antes de cada avanço de texto, ignorando o marcador de pular. Regra de desempate: se as fontes divergirem sobre o comprimento integral de um mesmo trecho, vale o valor do código; sem código, o do GDD; sem ambos, a medida do vídeo; código que existe mas não traz dado sobre o trecho conta como sem código para esse trecho, e GDD que não descreve o trecho conta como sem GDD para esse trecho"
        indicadores:
          - "todas as cenas, animações, vídeos e sequências de texto sem ação do jogador que altere o estado do jogo foram listadas, cada uma com a duração de sua linha do tempo, clipe ou animação ou com a soma das esperas mínimas antes de cada avanço (mínimo 0 trechos)"
          - "o marcador de pular cena de cada trecho foi anotado, e o comprimento integral foi calculado ignorando o marcador"
          - "o comprimento integral de cada trecho listado é de no máximo 120 segundos"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente a descrição das cenas, animações, vídeos e sequências de texto sem ação do jogador, a duração declarada de cada uma e se podem ser puladas. A duração declarada é o comprimento integral, mesmo para cena que pode ser pulada. Regra de desempate: se as fontes divergirem sobre o comprimento integral de um mesmo trecho, vale o valor do código; sem código, o do GDD; sem ambos, a medida do vídeo; código que existe mas não traz dado sobre o trecho conta como sem código para esse trecho, e GDD que não descreve o trecho conta como sem GDD para esse trecho"
        indicadores:
          - "o GDD descreve cada cena, animação, vídeo ou sequência de texto em que o jogador não tem ação que altere o estado do jogo e declara o comprimento integral de cada uma (mínimo 0 trechos)"
          - "o comprimento integral declarado de cada trecho descrito é de no máximo 120 segundos"
      video:
        procedimento: "Assistir a toda a gravação e registrar os intervalos em que a interface não oferece ao jogador nenhuma ação que altere o estado do jogo, restando apenas assistir, ler, avançar texto ou pular cena. A classificação depende do que a interface oferece, não de o jogador agir ou não: um intervalo em que há ações disponíveis e o jogador não as usa não é trecho passivo. Medir o comprimento integral de cada trecho: em cena ou animação exibida até o fim, pelos marcadores de tempo do vídeo; em sequência de texto, para cada avanço da sequência, o tempo desde o instante em que o texto (ou o segmento de cena) aparece até o instante em que o jogo aceita o avanço pela primeira vez (aparece o indicador de continuar ou a entrada passa a ser aceita), sem contar o tempo que o jogador gravado leva depois disso; o comprimento da sequência é a soma dessas esperas, e as pausas do jogador gravado entre um avanço e o seguinte não entram na soma; em trecho pulado, pelo comprimento integral determinável (o comprimento integral de trecho pulado é determinável quando está visível na gravação (barra de progresso, contador, ou a mesma cena exibida inteira em outro ponto) ou declarado no GDD ou no código; se não for determinável por nenhuma fonte fornecida, o trecho fica registrado como não determinado e não é contado como maior que 120 segundos). Limitação conhecida: o trecho pulado cujo comprimento integral não pode ser determinado é registrado como \"não determinado\"; por isso duas gravações do mesmo jogo podem diferir quando uma assiste a uma cena longa até o fim e a outra a pula; evidência de código ou do GDD resolve essa diferença. Regra de desempate: se as fontes divergirem sobre o comprimento integral de um mesmo trecho, vale o valor do código; sem código, o do GDD; sem ambos, a medida do vídeo; código que existe mas não traz dado sobre o trecho conta como sem código para esse trecho, e GDD que não descreve o trecho conta como sem GDD para esse trecho. Intervalo ocioso: em intervalo no qual o jogador não age e nenhum controle ou indicação de ação é visível, o intervalo é trecho passivo, salvo se código ou GDD mostrarem ação disponível nele"
        indicadores:
          - "todos os trechos passivos registrados no vídeo foram anotados com início, fim e comprimento integral (para sequência de texto, a soma das esperas de cada avanço, do aparecimento do texto até o jogo aceitar o avanço; mínimo 0)"
          - "o comprimento integral de cada trecho passivo registrado é de no máximo 120 segundos"
          - "cada trecho pulado teve o comprimento integral determinado ou foi registrado como não determinado"
    escala:
      atendido: "Nenhum trecho passivo das partes avaliadas tem comprimento integral maior que 120 segundos, nos termos do enunciado e das definições"
      parcial: "Um único trecho passivo das partes avaliadas tem comprimento integral maior que 120 segundos, nos termos do enunciado e das definições"
      nao_atendido: "Dois ou mais trechos passivos das partes avaliadas têm, cada um, comprimento integral maior que 120 segundos, nos termos do enunciado e das definições"
    recomendacao:
      documentacao: "Descrever no GDD ou documento equivalente cada cena, animação, vídeo ou sequência de texto em que o jogador não tem ação que altere o estado do jogo. Declarar o comprimento integral de cada um desses trechos, inclusive dos que podem ser pulados"
      design: "Encurtar para no máximo 120 segundos cada trecho passivo com comprimento integral maior que esse limite, ou dividi-lo com ações do jogador que alterem o estado do jogo, de modo que nenhum trecho passivo resultante tenha comprimento integral maior que 120 segundos"
      codigo: "Reduzir a duração da linha do tempo, clipe ou animação, ou a soma das esperas mínimas antes de cada avanço de texto, de cada trecho passivo com comprimento integral maior que 120 segundos. Acrescentar, nos trechos que não forem reduzidos, manipuladores de entrada que ofereçam ao jogador ação que altere o estado do jogo, de modo que nenhum trecho passivo resultante tenha comprimento integral maior que 120 segundos"
    depende_de: []
    definicoes:
      glossario: [documentacao_equivalente]
      locais:
        "trecho passivo": "um intervalo contínuo do jogo em que a interface não oferece ao jogador nenhuma ação que altere o estado do jogo (mover-se, selecionar, manipular objeto, responder, construir), restando apenas assistir, ler, avançar texto ou pular cena"
        "avançar texto e pular cena": "ações que não alteram o estado do jogo e não tornam o trecho ativo"
        "comprimento integral": "o tempo que o próprio jogo leva para exibir o trecho inteiro: para cena ou animação, a duração de sua reprodução completa, mesmo quando o jogo permite pulá-la; para sequência de texto em que a única ação oferecida é avançar, a soma das esperas que o jogo impõe antes de aceitar cada avanço (inclui o efeito de digitação do texto), isto é, o tempo medido quando o jogador avança na primeira oportunidade que o jogo oferece; o trecho que o jogador pula termina no pulo, mas conta pelo seu comprimento integral e não pelo tempo até o pulo"
        "partes avaliadas": "as cobertas pelas fontes de evidência fornecidas: no vídeo, só o que foi gravado; no código e na documentação, o jogo descrito; partes não gravadas nem descritas não são avaliadas"
        "sequência de diálogo sem espera": "sequência de diálogo em que o jogo não impõe nenhuma espera antes do avanço tem comprimento integral próximo de 0 e passa neste critério por construção, pois a validade dessa sequência é tratada por outras diretrizes (por exemplo, D03 e D04)"
