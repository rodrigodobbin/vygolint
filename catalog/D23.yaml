id: D23
categoria: mediacao
diretriz: "A narrativa do jogo deve viabilizar reflexões críticas ao trabalhar os conteúdos"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D23.1
    nivel: A
    enunciado: "A narrativa apresenta ao menos um dilema, isto é, uma situação sobre o conteúdo em que o jogador toma uma posição entre ao menos duas e o jogo exibe a consequência narrativa da posição tomada"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: media
      texto: "Para Vigotski, os conceitos científicos se formam quando o sujeito os opera de modo consciente e deliberado, e não quando os recebe prontos. Uma narrativa que só informa o conteúdo mantém o jogador como receptor, enquanto um dilema o obriga a tomar posição sobre o conteúdo e a ver o resultado dessa posição, o que torna o conteúdo objeto de reflexão. Basta um dilema porque a diretriz exige que a narrativa viabilize a reflexão, e não que toda cena a produza; exigir todas as cenas dependeria de delimitar o que é uma cena. Viabilidade média: exige escrever ramos de história com consequências diferentes e ligá-los aos objetivos de aprendizagem."
    evidencia:
      codigo:
        procedimento: "Localizar os pontos da narrativa em que o jogador escolhe ou digita uma opção (menus de diálogo, escolhas de história, respostas abertas) e, em cada um, verificar quais objetivos de aprendizagem a situação cita, se a escolha altera pontuação, progresso ou conclusão do desafio, e se há ramo, variável ou evento diferente para cada opção que decide a consequência exibida. Regra de desempate: se as fontes divergirem sobre uma situação, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre a situação conta como sem código para essa situação, e GDD que não a descreve conta como sem GDD para essa situação"
        indicadores:
          - "todos os pontos da narrativa com escolha ou resposta do jogador foram listados, cada um com o objetivo de aprendizagem a que se refere (mínimo 0 pontos)"
          - "em ao menos um ponto listado, o jogo não avalia as opções como certas ou erradas, isto é, a escolha não concede, retira nem condiciona pontuação, progresso ou conclusão do desafio"
          - "no mesmo ponto, a escolha do jogador é guardada ou lida pelo jogo e decide um ramo, variável ou evento diferente para cada posição, que exibe a consequência narrativa"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente a descrição da narrativa e identificar as situações em que o jogador toma posição: o objetivo de aprendizagem tratado, as posições possíveis, se alguma é avaliada como certa ou errada e a consequência narrativa prevista para cada posição. Regra de desempate: se as fontes divergirem sobre uma situação, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre a situação conta como sem código para essa situação, e GDD que não a descreve conta como sem GDD para essa situação"
        indicadores:
          - "o GDD lista as situações da narrativa em que o jogador toma posição, cada uma com o objetivo de aprendizagem tratado (mínimo 0 situações)"
          - "em ao menos uma situação listada, o GDD descreve ao menos duas posições que o jogo não avalia como certas ou erradas"
          - "na mesma situação, o GDD descreve uma consequência narrativa diferente para cada posição"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD: mostra a opção escolhida e sua consequência, mas não mostra se as outras opções levariam a consequências diferentes, e a ausência de dilema no vídeo não prova que o jogo não o oferece. Registrar as situações da narrativa em que o jogador escolhe ou digita uma opção, as opções visíveis, o que o jogo exibe depois da escolha e se a situação cita objetivo de aprendizagem. Regra de desempate: se as fontes divergirem sobre uma situação, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre a situação conta como sem código para essa situação, e GDD que não a descreve conta como sem GDD para essa situação"
        indicadores:
          - "todas as situações da narrativa gravadas em que o jogador escolhe ou digita uma opção foram registradas com timestamp, opções visíveis e objetivo de aprendizagem a que se referem (mínimo 0 situações)"
          - "em ao menos uma situação registrada, as opções são ao menos duas, e depois da escolha o jogo não exibe sinal de certo ou errado nem muda pontuação, progresso ou conclusão do desafio"
          - "na mesma situação, o conteúdo exibido depois da escolha cita ou responde à posição escolhida"
    escala:
      atendido: "A narrativa apresenta ao menos um dilema, nos termos do enunciado e das definições"
      parcial: "A narrativa apresenta ao menos uma situação sobre objetivo de aprendizagem em que o jogador escolhe entre ao menos duas opções, mas nenhuma situação é dilema, nos termos do enunciado e das definições (as opções são avaliadas como certas ou erradas, ou a consequência exibida não depende da opção escolhida)"
      nao_atendido: "A narrativa não apresenta nenhuma situação sobre objetivo de aprendizagem em que o jogador escolha entre ao menos duas opções, nos termos do enunciado e das definições (inclui narrativa sem escolha do jogador e narrativa que não trata do conteúdo)"
    recomendacao:
      documentacao: "Registrar no GDD ou documento equivalente as situações da narrativa em que o jogador toma posição, cada uma com o objetivo de aprendizagem tratado. Registrar, em ao menos uma dessas situações, ao menos duas posições que o jogo não avalia como certas ou erradas e uma consequência narrativa diferente para cada posição"
      design: "Definir ao menos uma situação da narrativa que cite ou descreva um objetivo de aprendizagem e ofereça ao jogador ao menos duas opções. Definir que nenhuma dessas opções seja avaliada como certa ou errada, isto é, que a escolha não conceda, retire nem condicione pontuação, progresso ou conclusão do desafio. Definir, para cada opção, uma consequência narrativa diferente (evento, fala de personagem ou mudança na história) que retome a opção escolhida"
      codigo: "Acrescentar, em ao menos um ponto da narrativa que cite um objetivo de aprendizagem, um menu de diálogo, escolha de história ou resposta aberta com ao menos duas opções. Remover dessa escolha qualquer efeito que conceda, retire ou condicione pontuação, progresso ou conclusão do desafio conforme a opção. Guardar em uma variável a opção escolhida pelo jogador. Acrescentar, para cada opção, um ramo ou evento que leia essa variável e exiba uma consequência narrativa diferente"
    depende_de: []
    definicoes:
      glossario: [missao, minijogo, desafio, documentacao_equivalente, objetivo_de_aprendizagem]
      locais:
        "narrativa": "a sequência de eventos, cenas, personagens e diálogos que o jogo apresenta ao jogador"
        "conteúdo de aprendizagem": "o listado no documento de design (GDD) ou documento equivalente"
        "situação trata de um objetivo de aprendizagem": "quando o texto, a fala ou a cena da situação cita ou descreve conceito, fato ou procedimento listado entre os objetivos de aprendizagem"
        "posição": "uma opção ou resposta (escolhida ou digitada) do jogador, numa situação, que o jogo não avalia como certa ou errada, isto é, que não concede, retira nem condiciona pontuação, progresso ou conclusão do desafio conforme a opção ou resposta; alternativa que o jogo avalia como certa ou errada é múltipla escolha e não é posição"
        "consequência narrativa": "o evento, a fala de personagem ou a mudança no cenário ou na história, exibido depois da posição, que retoma ou depende da posição escolhida (no código ou no GDD, um ramo diferente para cada posição; no vídeo, conteúdo exibido que cita ou responde à posição escolhida)"
        "dilema": "uma situação da narrativa que trata de um objetivo de aprendizagem, em que o jogador toma uma posição entre ao menos duas e o jogo usa a posição tomada para exibir a consequência narrativa dela"
      termos_comuns:
        "cenário": "em «mudança no cenário ou na história» (local consequência narrativa), cenário está no sentido corrente de ambientação da história, e não no de cenário jogável (D29)"
