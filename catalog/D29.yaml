id: D29
categoria: ludico
diretriz: "O jogo deve fornecer desafios motivadores, que estimulem o jogador a explorar"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D29.1
    nivel: A
    enunciado: "Existe ao menos um cenário jogável e todos os cenários jogáveis têm ao menos um incentivo de exploração; Definições: cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o jogo sem divisão em missões conta como uma única missão; cenário em que nenhuma missão está em curso (hub, sandbox) não tem caminho obrigatório e não é cenário jogável; caminho obrigatório, o mesmo que caminho da missão em D05, é a sequência de objetivos exigidos para completar a missão em curso no cenário, e fora do caminho obrigatório é tudo o que nenhum desses objetivos exige; incentivo de exploração é uma recompensa (item, pontos, desbloqueio ou conquista concedido pelo jogo), uma descoberta (cena, personagem, objeto interativo ou evento do cenário que não existe no caminho obrigatório; a área fora do caminho, por si só, não é descoberta) ou uma informação (texto, fala ou dado do jogo que não é apenas a descrição do objeto ou da área visitados e que cita ou descreve conceito, fato ou procedimento listado entre os objetivos de aprendizagem do GDD ou documento equivalente, ou trata de objetivo, evento ou personagem de uma missão do jogo) que o jogador obtém por ação própria fora do caminho obrigatório e não obtém seguindo apenas o caminho obrigatório; poder acessar áreas fora do caminho é tratado em D05, e o acesso a uma área sem recompensa, descoberta ou informação obtida não é incentivo de exploração"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: alta
      texto: "Em Vigotski a motivação é função da atividade e o conhecimento se constrói na atividade do sujeito sobre o meio; um cenário que permite explorar (D05), mas nada oferece fora do caminho obrigatório, dá ao jogador razão apenas para seguir a missão. D29 trata do incentivo (recompensa, descoberta ou informação obtida só fora do caminho obrigatório), e não da permissão de acesso (D05) nem da motivação do jogador, que varia e não é medida. Para que o critério não se reduza a D05, a descoberta é conteúdo do cenário que não existe no caminho obrigatório, e não a área em si, e a informação exclui a mera descrição do objeto ou da área visitados e exige relação com objetivo de aprendizagem ou com a missão. Cenário sem missão em curso (hub, sandbox) não tem caminho obrigatório contra o qual medir o incentivo e fica fora do critério. A essencialidade é alta porque a exploração é a atividade pela qual o jogador opera sobre o mundo do jogo. Posicionar ao menos um incentivo em cada cenário é decisão de projeto de baixo custo; viabilidade alta."
    evidencia:
      codigo:
        procedimento: "Identificar os cenários em que há missão em curso (hub e sandbox sem missão em curso ficam excluídos) e localizar em cada um as recompensas (itens colecionáveis, desbloqueios, conquistas), as descobertas (cenas, personagens, objetos interativos, eventos) e as informações (textos, falas, dados) que ficam fora do caminho obrigatório; verificar, para cada uma, se nenhum objetivo ou condição de conclusão da missão exige obtê-la e se o jogador que segue apenas o caminho obrigatório não a recebe, e verificar ainda se a descoberta não existe no caminho obrigatório e se a informação não é apenas a descrição do objeto ou da área visitados e se relaciona a objetivo de aprendizagem do GDD ou a missão do jogo. Definições: cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o jogo sem divisão em missões conta como uma única missão; cenário em que nenhuma missão está em curso (hub, sandbox) não tem caminho obrigatório e não é cenário jogável; caminho obrigatório, o mesmo que caminho da missão em D05, é a sequência de objetivos exigidos para completar a missão em curso no cenário, e fora do caminho obrigatório é tudo o que nenhum desses objetivos exige; incentivo de exploração é uma recompensa (item, pontos, desbloqueio ou conquista concedido pelo jogo), uma descoberta (cena, personagem, objeto interativo ou evento do cenário que não existe no caminho obrigatório; a área fora do caminho, por si só, não é descoberta) ou uma informação (texto, fala ou dado do jogo que não é apenas a descrição do objeto ou da área visitados e que cita ou descreve conceito, fato ou procedimento listado entre os objetivos de aprendizagem do GDD ou documento equivalente, ou trata de objetivo, evento ou personagem de uma missão do jogo) que o jogador obtém por ação própria fora do caminho obrigatório e não obtém seguindo apenas o caminho obrigatório; poder acessar áreas fora do caminho é tratado em D05, e o acesso a uma área sem recompensa, descoberta ou informação obtida não é incentivo de exploração. Regra de desempate: se as fontes divergirem sobre um cenário, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um cenário conta como sem código para esse cenário, e GDD que não descreve um cenário conta como sem GDD para esse cenário"
        indicadores:
          - "todos os cenários jogáveis (com missão em curso) foram listados, cada um com os incentivos de exploração que contém, e os cenários sem missão em curso foram anotados como excluídos (mínimo 0 incentivos por cenário)"
          - "em cada cenário listado, ao menos um incentivo de exploração, isto é, recompensa, descoberta (conteúdo que não existe no caminho obrigatório, e não a área em si) ou informação (que não é apenas a descrição do objeto ou da área visitados e se relaciona a objetivo de aprendizagem do GDD ou a missão do jogo) que nenhum objetivo nem condição de conclusão da missão exige obter"
          - "esse incentivo não é concedido ao jogador que segue apenas o caminho obrigatório"
          - "se ao menos um cenário tem incentivo de exploração e ao menos outro cenário não tem, anotar (indica o estado parcial)"
      documentacao:
        procedimento: "Verificar no GDD ou nos mapas de nível quais cenários têm missão em curso (os demais, como hub e sandbox, ficam excluídos) e, para cada cenário jogável, os objetivos que compõem o caminho obrigatório e as recompensas, descobertas e informações descritas como obtidas fora dele, com a descoberta e a informação classificadas nos termos das definições. Definições: cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o jogo sem divisão em missões conta como uma única missão; cenário em que nenhuma missão está em curso (hub, sandbox) não tem caminho obrigatório e não é cenário jogável; caminho obrigatório, o mesmo que caminho da missão em D05, é a sequência de objetivos exigidos para completar a missão em curso no cenário, e fora do caminho obrigatório é tudo o que nenhum desses objetivos exige; incentivo de exploração é uma recompensa (item, pontos, desbloqueio ou conquista concedido pelo jogo), uma descoberta (cena, personagem, objeto interativo ou evento do cenário que não existe no caminho obrigatório; a área fora do caminho, por si só, não é descoberta) ou uma informação (texto, fala ou dado do jogo que não é apenas a descrição do objeto ou da área visitados e que cita ou descreve conceito, fato ou procedimento listado entre os objetivos de aprendizagem do GDD ou documento equivalente, ou trata de objetivo, evento ou personagem de uma missão do jogo) que o jogador obtém por ação própria fora do caminho obrigatório e não obtém seguindo apenas o caminho obrigatório; poder acessar áreas fora do caminho é tratado em D05, e o acesso a uma área sem recompensa, descoberta ou informação obtida não é incentivo de exploração. Regra de desempate: se as fontes divergirem sobre um cenário, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um cenário conta como sem código para esse cenário, e GDD que não descreve um cenário conta como sem GDD para esse cenário"
        indicadores:
          - "o GDD ou mapa lista os cenários jogáveis (com missão em curso) e, para cada um, os incentivos de exploração, e anota como excluídos os cenários sem missão em curso (mínimo 0 incentivos por cenário)"
          - "em cada cenário listado, o GDD descreve ao menos um incentivo de exploração, isto é, recompensa, descoberta (conteúdo que não existe no caminho obrigatório, e não a área em si) ou informação (que não é apenas a descrição do objeto ou da área visitados e se relaciona a objetivo de aprendizagem do GDD ou a missão do jogo) que nenhum objetivo da missão exige"
          - "o GDD descreve que esse incentivo só é obtido fora do caminho obrigatório"
          - "se o GDD descreve incentivo em ao menos um cenário e em ao menos outro não descreve, anotar (indica o estado parcial)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD: mostra os incentivos que o jogador gravado obtém, e a ausência de incentivo no vídeo não prova que o jogo não o oferece. Registrar os momentos em que o jogador obtém recompensa, descoberta ou informação, o cenário e se há missão em curso nele, o que foi obtido, a classificação da obtenção como recompensa, descoberta ou informação nos termos das definições e se o objetivo da missão em curso exigia o que foi obtido (objetivo listado no GDD ou, sem GDD, o anunciado pelo jogo). Definições: cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o jogo sem divisão em missões conta como uma única missão; cenário em que nenhuma missão está em curso (hub, sandbox) não tem caminho obrigatório e não é cenário jogável; caminho obrigatório, o mesmo que caminho da missão em D05, é a sequência de objetivos exigidos para completar a missão em curso no cenário, e fora do caminho obrigatório é tudo o que nenhum desses objetivos exige; incentivo de exploração é uma recompensa (item, pontos, desbloqueio ou conquista concedido pelo jogo), uma descoberta (cena, personagem, objeto interativo ou evento do cenário que não existe no caminho obrigatório; a área fora do caminho, por si só, não é descoberta) ou uma informação (texto, fala ou dado do jogo que não é apenas a descrição do objeto ou da área visitados e que cita ou descreve conceito, fato ou procedimento listado entre os objetivos de aprendizagem do GDD ou documento equivalente, ou trata de objetivo, evento ou personagem de uma missão do jogo) que o jogador obtém por ação própria fora do caminho obrigatório e não obtém seguindo apenas o caminho obrigatório; poder acessar áreas fora do caminho é tratado em D05, e o acesso a uma área sem recompensa, descoberta ou informação obtida não é incentivo de exploração. Regra de desempate: se as fontes divergirem sobre um cenário, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um cenário conta como sem código para esse cenário, e GDD que não descreve um cenário conta como sem GDD para esse cenário"
        indicadores:
          - "cada obtenção de recompensa, descoberta ou informação foi registrada com timestamp, cenário e o que foi obtido (mínimo 0 obtenções)"
          - "cada obtenção registrada foi classificada como incentivo de exploração, quando nenhum objetivo da missão em curso exigia o que foi obtido e o jogador estava fora do caminho obrigatório, ou como obtenção exigida pelo caminho obrigatório; a descoberta só é classificada como incentivo quando o conteúdo não existe no caminho obrigatório, e a informação só quando não é apenas a descrição do objeto ou da área visitados e se relaciona a objetivo de aprendizagem do GDD ou a missão do jogo; só as classificadas como incentivo confirmam o estado atendido para o cenário em que ocorrem, desde que haja missão em curso nele"
    escala:
      atendido: "Existe ao menos um cenário jogável e todos os cenários jogáveis têm ao menos um incentivo de exploração, nos termos do enunciado"
      parcial: "Ao menos um cenário jogável tem incentivo de exploração, nos termos do enunciado, e ao menos outro cenário jogável não tem. Definição: cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o jogo sem divisão em missões conta como uma única missão; cenário em que nenhuma missão está em curso (hub, sandbox) não tem caminho obrigatório e não é cenário jogável"
      nao_atendido: "Nenhum cenário jogável tem incentivo de exploração, nos termos do enunciado (inclui cenário em que o acesso fora do caminho obrigatório não rende recompensa, descoberta nem informação, e jogo sem nenhum cenário em que haja missão em curso). Definições: caminho obrigatório, o mesmo que caminho da missão em D05, é a sequência de objetivos exigidos para completar a missão em curso no cenário, e fora do caminho obrigatório é tudo o que nenhum desses objetivos exige; incentivo de exploração é uma recompensa (item, pontos, desbloqueio ou conquista concedido pelo jogo), uma descoberta (cena, personagem, objeto interativo ou evento do cenário que não existe no caminho obrigatório; a área fora do caminho, por si só, não é descoberta) ou uma informação (texto, fala ou dado do jogo que não é apenas a descrição do objeto ou da área visitados e que cita ou descreve conceito, fato ou procedimento listado entre os objetivos de aprendizagem do GDD ou documento equivalente, ou trata de objetivo, evento ou personagem de uma missão do jogo) que o jogador obtém por ação própria fora do caminho obrigatório e não obtém seguindo apenas o caminho obrigatório; poder acessar áreas fora do caminho é tratado em D05, e o acesso a uma área sem recompensa, descoberta ou informação obtida não é incentivo de exploração"
