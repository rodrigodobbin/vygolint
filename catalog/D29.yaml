id: D29
categoria: ludico
diretriz: "O jogo deve fornecer desafios motivadores, que estimulem o jogador a explorar"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D29.1
    nivel: A
    enunciado: "Todos os cenários jogáveis têm ao menos um incentivo de exploração; Definições: cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações; caminho obrigatório, o mesmo que caminho da missão em D05, é a sequência de objetivos exigidos para completar a missão em curso no cenário, e fora do caminho obrigatório é tudo o que nenhum desses objetivos exige; incentivo de exploração é uma recompensa (item, pontos, desbloqueio ou conquista concedido pelo jogo), uma descoberta (área, cena, personagem ou objeto que só existe ou só é acessível fora do caminho obrigatório) ou uma informação (texto, fala ou dado do jogo) que o jogador obtém por ação própria fora do caminho obrigatório e não obtém seguindo apenas o caminho obrigatório; poder acessar áreas fora do caminho é tratado em D05, e o acesso sem recompensa, descoberta ou informação obtida não é incentivo de exploração"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: alta
      texto: "Em Vigotski a motivação é função da atividade e o conhecimento se constrói na atividade do sujeito sobre o meio; um cenário que permite explorar (D05), mas nada oferece fora do caminho obrigatório, dá ao jogador razão apenas para seguir a missão. D29 trata do incentivo (recompensa, descoberta ou informação obtida só fora do caminho obrigatório), e não da permissão de acesso (D05) nem da motivação do jogador, que varia e não é medida. A essencialidade é alta porque a exploração é a atividade pela qual o jogador opera sobre o mundo do jogo. Posicionar ao menos um incentivo em cada cenário é decisão de projeto de baixo custo; viabilidade alta."
    evidencia:
      codigo:
        procedimento: "Localizar em cada cenário jogável os itens colecionáveis, recompensas, desbloqueios, conquistas, áreas, cenas, personagens, objetos e informações que ficam fora do caminho obrigatório e verificar, para cada um, se nenhum objetivo ou condição de conclusão da missão exige obtê-lo e se o jogador que segue apenas o caminho obrigatório não o recebe. Definições: cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações; caminho obrigatório, o mesmo que caminho da missão em D05, é a sequência de objetivos exigidos para completar a missão em curso no cenário, e fora do caminho obrigatório é tudo o que nenhum desses objetivos exige; incentivo de exploração é uma recompensa (item, pontos, desbloqueio ou conquista concedido pelo jogo), uma descoberta (área, cena, personagem ou objeto que só existe ou só é acessível fora do caminho obrigatório) ou uma informação (texto, fala ou dado do jogo) que o jogador obtém por ação própria fora do caminho obrigatório e não obtém seguindo apenas o caminho obrigatório; poder acessar áreas fora do caminho é tratado em D05, e o acesso sem recompensa, descoberta ou informação obtida não é incentivo de exploração. Regra de desempate: se as fontes divergirem sobre um cenário, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um cenário conta como sem código para esse cenário, e GDD que não descreve um cenário conta como sem GDD para esse cenário"
        indicadores:
          - "todos os cenários jogáveis foram listados, cada um com os incentivos de exploração que contém (mínimo 0 incentivos por cenário)"
          - "em cada cenário listado, ao menos um incentivo de exploração: nenhum objetivo nem condição de conclusão da missão exige obtê-lo"
          - "esse incentivo não é concedido ao jogador que segue apenas o caminho obrigatório"
          - "se ao menos um cenário tem incentivo de exploração e ao menos outro cenário não tem, anotar (indica o estado parcial)"
      documentacao:
        procedimento: "Verificar no GDD ou nos mapas de nível, para cada cenário jogável, os objetivos que compõem o caminho obrigatório e as recompensas, descobertas e informações descritas como obtidas fora dele. Definições: cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações; caminho obrigatório, o mesmo que caminho da missão em D05, é a sequência de objetivos exigidos para completar a missão em curso no cenário, e fora do caminho obrigatório é tudo o que nenhum desses objetivos exige; incentivo de exploração é uma recompensa (item, pontos, desbloqueio ou conquista concedido pelo jogo), uma descoberta (área, cena, personagem ou objeto que só existe ou só é acessível fora do caminho obrigatório) ou uma informação (texto, fala ou dado do jogo) que o jogador obtém por ação própria fora do caminho obrigatório e não obtém seguindo apenas o caminho obrigatório; poder acessar áreas fora do caminho é tratado em D05, e o acesso sem recompensa, descoberta ou informação obtida não é incentivo de exploração. Regra de desempate: se as fontes divergirem sobre um cenário, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um cenário conta como sem código para esse cenário, e GDD que não descreve um cenário conta como sem GDD para esse cenário"
        indicadores:
          - "o GDD ou mapa lista os cenários jogáveis e, para cada um, os incentivos de exploração (mínimo 0 incentivos por cenário)"
          - "em cada cenário listado, o GDD descreve ao menos um incentivo de exploração que nenhum objetivo da missão exige"
          - "o GDD descreve que esse incentivo só é obtido fora do caminho obrigatório"
          - "se o GDD descreve incentivo em ao menos um cenário e em ao menos outro não descreve, anotar (indica o estado parcial)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD: mostra os incentivos que o jogador gravado obtém, e a ausência de incentivo no vídeo não prova que o jogo não o oferece. Registrar os momentos em que o jogador obtém recompensa, descoberta ou informação, o cenário, o que foi obtido e se o objetivo da missão em curso exigia o que foi obtido (objetivo listado no GDD ou, sem GDD, o anunciado pelo jogo). Definições: cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações; caminho obrigatório, o mesmo que caminho da missão em D05, é a sequência de objetivos exigidos para completar a missão em curso no cenário, e fora do caminho obrigatório é tudo o que nenhum desses objetivos exige; incentivo de exploração é uma recompensa (item, pontos, desbloqueio ou conquista concedido pelo jogo), uma descoberta (área, cena, personagem ou objeto que só existe ou só é acessível fora do caminho obrigatório) ou uma informação (texto, fala ou dado do jogo) que o jogador obtém por ação própria fora do caminho obrigatório e não obtém seguindo apenas o caminho obrigatório; poder acessar áreas fora do caminho é tratado em D05, e o acesso sem recompensa, descoberta ou informação obtida não é incentivo de exploração. Regra de desempate: se as fontes divergirem sobre um cenário, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um cenário conta como sem código para esse cenário, e GDD que não descreve um cenário conta como sem GDD para esse cenário"
        indicadores:
          - "cada obtenção de recompensa, descoberta ou informação foi registrada com timestamp, cenário e o que foi obtido (mínimo 0 obtenções)"
          - "cada obtenção registrada foi classificada como incentivo de exploração, quando nenhum objetivo da missão em curso exigia o que foi obtido e o jogador estava fora do caminho obrigatório, ou como obtenção exigida pelo caminho obrigatório; só as classificadas como incentivo confirmam o estado atendido para o cenário em que ocorrem"
    escala:
      atendido: "Todos os cenários jogáveis têm ao menos um incentivo de exploração, nos termos do enunciado"
      parcial: "Ao menos um cenário jogável tem incentivo de exploração, nos termos do enunciado, e ao menos outro cenário jogável não tem. Definição: cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações"
      nao_atendido: "Nenhum cenário jogável tem incentivo de exploração, nos termos do enunciado (inclui cenário em que o acesso fora do caminho obrigatório não rende recompensa, descoberta nem informação). Definição: incentivo de exploração é uma recompensa, uma descoberta ou uma informação que o jogador obtém por ação própria fora do caminho obrigatório e não obtém seguindo apenas o caminho obrigatório"
    depende_de: []
