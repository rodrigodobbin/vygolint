id: D35
categoria: personalizacao
diretriz: "O jogo deve permitir que o jogador crie desafios para outros jogadores"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D35.1
    nivel: AAA
    enunciado: "Existe uma mecânica em que o jogador cria um desafio e o jogo o disponibiliza a outro jogador para que o jogue"
    nivel_justificativa:
      essencialidade: baixa
      viabilidade: baixa
      texto: "Em Vigotski a interação social entre pares cria a zona de desenvolvimento proximal, e quem cria um desafio para outro assume o papel de organizar a tarefa do par e antecipar o que ele consegue fazer, o que é uma forma de mediação entre jogadores. O critério exige que o artefato criado seja um desafio com condição de conclusão e que chegue a outro jogador, o que o distingue de D12 (construir objetos persistentes, sem exigir que outro os jogue). Um elemento de conteúdo definido pelo jogador é o mínimo que distingue o desafio criado de um desafio pronto, e a diretriz não fixa quantidade maior. A dependência de D07.1 existe porque disponibilizar o desafio a outro jogador exige persistir o que um jogador criou e exibi-lo a outros jogadores em sessões posteriores, o mecanismo que D07.1 mede; sem esse mecanismo, o desafio criado não chega a outro jogador. A essencialidade é baixa porque a interação entre jogadores também ocorre por comunicação (D06, D07) e por tarefas em grupo (D13); a viabilidade é baixa porque exige editor, serialização do desafio, armazenamento compartilhado e verificação de que o desafio criado pode ser concluído."
    evidencia:
      codigo:
        procedimento: "Localizar o editor ou a lógica de criação de desafio, a serialização do desafio criado (arquivo, registro ou código de compartilhamento), o armazenamento compartilhado entre jogadores e o carregador que abre no jogo o desafio criado por outro jogador. Regra de desempate: se as fontes divergirem sobre uma mecânica de criação, vale o código; sem código, o GDD; sem ambos, o vídeo, que só confirma o estado atendido; sem código, GDD nem confirmação no vídeo, o resultado é registrado como não confirmado; código que existe mas não traz dado sobre a mecânica conta como sem código para essa mecânica, e GDD que não a descreve conta como sem GDD para essa mecânica"
        indicadores:
          - "existe lógica em que o jogador define ao menos um elemento de conteúdo e a condição de conclusão de um desafio e o jogo guarda o resultado como desafio jogável"
          - "o desafio criado é gravado em armazenamento compartilhado entre jogadores (servidor, arquivo ou código de compartilhamento)"
          - "existe lógica que lista, importa ou abre, para um jogador diferente do autor, o desafio criado e o executa como desafio jogável"
          - "se o desafio criado só pode ser aberto pelo autor, anotar (indica o estado parcial)"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente a mecânica de criação de desafio: o que o jogador define, como o desafio é compartilhado e como outro jogador o abre e o joga. Regra de desempate: se as fontes divergirem sobre uma mecânica de criação, vale o código; sem código, o GDD; sem ambos, o vídeo, que só confirma o estado atendido; sem código, GDD nem confirmação no vídeo, o resultado é registrado como não confirmado; código que existe mas não traz dado sobre a mecânica conta como sem código para essa mecânica, e GDD que não a descreve conta como sem GDD para essa mecânica"
        indicadores:
          - "o GDD descreve o que o jogador define ao criar o desafio (elemento de conteúdo e condição de conclusão)"
          - "o GDD descreve como o desafio criado chega a outro jogador (armazenamento compartilhado e ação de abri-lo) e que o outro jogador o joga"
          - "se o GDD descreve a criação do desafio mas só o autor o joga, anotar (indica o estado parcial)"
      video:
        procedimento: "O vídeo só confirma o estado atendido, e os estados parcial e não atendido são decididos por código e GDD: a ausência da criação no vídeo não prova que o jogo não a oferece, e uma única gravação pode mostrar só um lado. Registrar o momento em que o jogador cria um desafio e o momento em que outro jogador abre e joga um desafio criado, na mesma gravação ou em gravações distintas. Regra de desempate: se as fontes divergirem sobre uma mecânica de criação, vale o código; sem código, o GDD; sem ambos, o vídeo, que só confirma o estado atendido; sem código, GDD nem confirmação no vídeo, o resultado é registrado como não confirmado; código que existe mas não traz dado sobre a mecânica conta como sem código para essa mecânica, e GDD que não a descreve conta como sem GDD para essa mecânica"
        indicadores:
          - "ao menos um momento em que o jogador define elemento de conteúdo e condição de conclusão de um desafio e o jogo o guarda foi registrado, com timestamp"
          - "ao menos um momento em que um jogador abre e joga, dentro do jogo, desafio criado por outro jogador foi registrado, com timestamp; o desafio aberto confirma a disponibilização quando é o mesmo desafio criado em momento registrado por jogador diferente do que o abre, ou quando o jogo exibe como autor um jogador diferente do que o abre"
    escala:
      atendido: "Existe uma mecânica em que o jogador cria um desafio e o jogo o disponibiliza a outro jogador para que o jogue, nos termos do enunciado e das definições"
      parcial: "O jogador cria um desafio, nos termos do enunciado e das definições, mas o jogo não o disponibiliza a outro jogador (só o autor o joga, ou outra pessoa o joga na mesma instalação e sob a mesma identidade de jogador do autor, sem que o desafio fique guardado sob outra identidade de jogador)"
      nao_atendido: "O jogador não cria desafio, nos termos do enunciado e das definições (inclui construção de objetos sem condição de conclusão e escolha ou configuração de desafios prontos). Por falta de evidência (sem código, GDD nem confirmação no vídeo), o grau padrão é não atendido"
    depende_de:
      - [D07.1]
    definicoes:
      glossario: [missao, minijogo, desafio, documentacao_equivalente]
      locais:
        "desafio criado pelo jogador": "um desafio que o jogador monta com ao menos um elemento de conteúdo que o jogo não fornece pronto (pergunta ou resposta digitadas, elementos do desafio posicionados ou combinados pelo jogador, ou regra montada por ele) e com a condição de conclusão definida por ele (resposta correta, ponto de chegada ou meta); não contam escolher um desafio pronto, alterar só a dificuldade, a aparência ou a ordem de desafios prontos, e construir objeto ou estrutura sem condição de conclusão (tratado em D12)"
        "outro jogador": "uma pessoa diferente do autor do desafio que joga e que o jogo identifica por uma identidade de jogador diferente da do autor (perfil, conta ou nome de usuário, local ou remota); o compartilhamento no mesmo dispositivo conta só se o desafio fica guardado sob uma identidade de jogador diferente da do autor, e passar o dispositivo a outra pessoa sem guardar o desafio sob outra identidade não conta; outra instalação ou outro dispositivo que abre o desafio por código, arquivo ou servidor de compartilhamento conta como identidade de jogador distinta da do autor, e a restrição de mesmo dispositivo vale só para a mesma instalação sob a mesma identidade; o próprio autor e o personagem não jogável não contam"
        "disponibilização a outro jogador": "o jogo disponibiliza o desafio criado a outro jogador quando o guarda em armazenamento compartilhado entre jogadores (servidor, arquivo ou código de compartilhamento) e oferece ao outro jogador uma ação do jogo para abri-lo (lista, convite, importação ou código) e jogá-lo; desafio que só o autor pode abrir não é disponibilizado"
