id: D31
categoria: realismo
diretriz: "O jogo contextualiza o conteúdo com situações reais"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D31.1
    nivel: A
    enunciado: "Existe ao menos um objetivo de aprendizagem listado no GDD ou documento equivalente e todo objetivo de aprendizagem listado é apresentado em ao menos uma situação real do jogo"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: alta
      texto: "Em Vigotski os conceitos científicos se formam na relação com os conceitos cotidianos da experiência do sujeito e na prática social em que são usados, e um conceito apresentado só como definição, ou dentro de uma situação inventada sem ligação com essa prática, fica separado dessa experiência; dentro de uma situação que o GDD liga a uma prática ou fenômeno real, o jogador encontra o conceito em uso, mediado por uma situação com personagem, objeto e propósito. Este critério mede a apresentação situada com referente real por objetivo (cada objetivo listado em ao menos uma situação real do jogo), e D30 mede só a premissa do jogo e seu referente; um jogo pode ter premissa com referente real e objetivos apresentados em situações fictícias, e o inverso. Basta uma situação real por objetivo porque a diretriz trata da presença da contextualização, e não de quantas vezes ela se repete. A essencialidade é alta porque o conteúdo a aprender é a razão de ser do jogo educacional e a situação real é o meio pelo qual ele chega ao jogador. Associar cada objetivo a uma situação do jogo e descrever no GDD a prática ou o fenômeno real a que ela corresponde é decisão de roteiro e de documentação, sem custo técnico especial; viabilidade alta. O nível ordena a essencialidade teórica e não a dificuldade, e apresentar o conteúdo em situações reais é o núcleo do contexto sócio-histórico, e por isso o nível é A, enquanto a premissa de D30, isolada, é média. A dependência do GDD para classificar a situação como real é custo de documentação e não custo técnico, e por isso a viabilidade continua alta."
    evidencia:
      codigo:
        procedimento: "Com a lista de objetivos de aprendizagem do GDD e a classificação das situações como reais feita pelo GDD, localizar em diálogos, scripts de missão, eventos e bancos de perguntas as ocorrências de cada conceito, fato ou procedimento e, para cada ocorrência, a missão, o evento ou o diálogo em que está, o elemento da situação (personagem, objeto, ação ou problema) a que se liga e se o GDD descreve essa situação como real. Regra de desempate: a lista de objetivos de aprendizagem e a classificação de uma situação como real vêm só do GDD ou documento equivalente, e sem lista não há objetivo avaliado; para decidir onde um objetivo aparece no jogo, se as fontes divergirem vale o código; sem código, o GDD; sem ambos, o vídeo, aplicado objetivo a objetivo: o objetivo sem dado de código nem de GDD pode ser confirmado pelo vídeo para esse objetivo, e a regra de que o vídeo só confirma o estado atendido quando observa todo objetivo listado em situação real do jogo vale só quando nenhum objetivo tem dado de código ou de GDD; código que existe mas não traz dado sobre um objetivo conta como sem código para esse objetivo, e GDD que não descreve onde um objetivo aparece conta como sem GDD para esse objetivo"
        indicadores:
          - "todos os objetivos de aprendizagem do GDD foram listados, cada um com as ocorrências encontradas no código ou nos dados do jogo (mínimo 0 ocorrências por objetivo)"
          - "para cada objetivo listado, ao menos uma ocorrência está em situação real do jogo, isto é, é mencionada, demonstrada ou exigida dentro de missão, evento ou diálogo, ligada a elemento da própria situação, e o GDD descreve essa situação como correspondente a situação, prática ou fenômeno real fora do jogo ou como reprodução do referente da premissa"
          - "as ocorrências em verbete de glossário ou de enciclopédia, menu de ajuda, tela de texto sem situação, pergunta de quiz que só pede nome ou definição e em situação que o GDD não descreve como real foram anotadas e não contadas"
          - "se ao menos um objetivo tem ocorrência em situação real do jogo e ao menos outro objetivo não tem, anotar (indica o estado parcial)"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente a lista de objetivos de aprendizagem e, para cada um, a missão, o evento ou o diálogo em que o GDD descreve que ele é apresentado, o elemento da situação a que se liga e a situação, prática ou fenômeno real fora do jogo (ou o referente da premissa) a que o GDD diz que a situação corresponde. Regra de desempate: a lista de objetivos de aprendizagem e a classificação de uma situação como real vêm só do GDD ou documento equivalente, e sem lista não há objetivo avaliado; para decidir onde um objetivo aparece no jogo, se as fontes divergirem vale o código; sem código, o GDD; sem ambos, o vídeo, aplicado objetivo a objetivo: o objetivo sem dado de código nem de GDD pode ser confirmado pelo vídeo para esse objetivo, e a regra de que o vídeo só confirma o estado atendido quando observa todo objetivo listado em situação real do jogo vale só quando nenhum objetivo tem dado de código ou de GDD; código que existe mas não traz dado sobre um objetivo conta como sem código para esse objetivo, e GDD que não descreve onde um objetivo aparece conta como sem GDD para esse objetivo"
        indicadores:
          - "o GDD lista os objetivos de aprendizagem (mínimo 0 objetivos)"
          - "para cada objetivo listado, o GDD descreve ao menos uma situação do jogo em que ele é apresentado, ligado a elemento da própria situação, e descreve essa situação como correspondente a situação, prática ou fenômeno real fora do jogo, identificado por nome ou descrição específica, ou como reprodução do referente da premissa"
          - "os objetivos que o GDD descreve só como glossário, menu de ajuda, tela de texto sem situação, pergunta de quiz que só pede nome ou definição, material fora do jogo ou situação fictícia foram anotados e não contados"
          - "se o GDD descreve situação real para ao menos um objetivo e para ao menos outro não descreve, anotar (indica o estado parcial)"
      video:
        procedimento: "O vídeo só confirma o código ou o GDD e só avalia os objetivos que mostra: o objetivo que a gravação não mostra não é avaliado pelo vídeo, e a ausência dele no vídeo não prova que o jogo não o apresenta; o vídeo sozinho confirma o estado atendido só quando todo objetivo listado no GDD é observado em situação real do jogo, e, sem código nem GDD que descrevam onde os objetivos aparecem, qualquer outro resultado do vídeo é registrado como não confirmado e o grau é não atendido, por falta de evidência. Registrar, com timestamp, cada momento em que o jogo apresenta conceito, fato ou procedimento da lista do GDD, o objetivo correspondente, a situação em que ocorre e se o GDD descreve essa situação como real. Regra de desempate: a lista de objetivos de aprendizagem e a classificação de uma situação como real vêm só do GDD ou documento equivalente, e sem lista não há objetivo avaliado; para decidir onde um objetivo aparece no jogo, se as fontes divergirem vale o código; sem código, o GDD; sem ambos, o vídeo, aplicado objetivo a objetivo: o objetivo sem dado de código nem de GDD pode ser confirmado pelo vídeo para esse objetivo, e a regra de que o vídeo só confirma o estado atendido quando observa todo objetivo listado em situação real do jogo vale só quando nenhum objetivo tem dado de código ou de GDD; código que existe mas não traz dado sobre um objetivo conta como sem código para esse objetivo, e GDD que não descreve onde um objetivo aparece conta como sem GDD para esse objetivo"
        indicadores:
          - "cada apresentação de conceito, fato ou procedimento observada foi registrada com timestamp, objetivo de aprendizagem correspondente da lista do GDD e missão, evento ou diálogo em que ocorre (mínimo 0 registros)"
          - "cada registro foi classificado como apresentado em situação real do jogo, quando é mencionado, demonstrado ou exigido dentro de missão, evento ou diálogo, ligado a elemento da própria situação, e o GDD descreve essa situação como real, ou como apresentação isolada ou em situação não descrita como real; só os classificados como em situação real confirmam o objetivo"
          - "os objetivos da lista do GDD que a gravação não mostra foram anotados como não avaliados pelo vídeo, e os observados só em apresentação isolada ou em situação não descrita como real foram anotados; o vídeo sozinho só indica atendido quando todos os objetivos listados estão confirmados em situação real, e sem código nem GDD o resultado diferente disso é não confirmado; havendo código ou GDD para algum objetivo, o vídeo confirma o objetivo que não tem esse dado, objetivo a objetivo"
    escala:
      atendido: "Existe ao menos um objetivo de aprendizagem listado e todo objetivo de aprendizagem listado é apresentado em ao menos uma situação real do jogo, nos termos do enunciado e das definições"
      parcial: "Ao menos um objetivo de aprendizagem listado é apresentado em ao menos uma situação real do jogo, nos termos do enunciado e das definições, e ao menos outro objetivo listado não é"
      nao_atendido: "Nenhum objetivo de aprendizagem é apresentado em situação real do jogo, nos termos do enunciado e das definições (inclui conteúdo só em glossário, menu de ajuda, tela de texto, pergunta de quiz que só pede nome ou definição ou situação fictícia, e GDD ou documento equivalente sem lista de objetivos de aprendizagem). Sem código nem GDD que descrevam onde os objetivos aparecem, e sem confirmação de todo objetivo listado pelo vídeo, o resultado é não confirmado e, por falta de evidência, o grau padrão é não atendido"
    recomendacao:
      documentacao: "Registrar no GDD ou documento equivalente a lista de objetivos de aprendizagem, com ao menos um objetivo. Registrar, para cada objetivo de aprendizagem listado, ao menos uma missão, evento ou diálogo em que o objetivo é apresentado e o elemento dessa situação (personagem, objeto, ação ou problema) a que se liga. Registrar, para cada uma dessas situações, a situação, prática ou fenômeno real fora do jogo a que corresponde, identificado por nome ou descrição específica, ou que ela reproduz o referente real da premissa do jogo"
      design: "Definir ao menos um objetivo de aprendizagem para o jogo. Incluir cada objetivo de aprendizagem listado no GDD ou documento equivalente em ao menos uma missão, evento ou diálogo que corresponda a uma situação, prática ou fenômeno real fora do jogo ou que reproduza o referente real da premissa do jogo. Ligar, em cada uma dessas situações, o objetivo de aprendizagem a um personagem, objeto, ação ou problema da própria situação, nos termos das definições"
      codigo: "Acrescentar ou usar, em diálogos, scripts de missão, eventos ou bancos de perguntas, para cada objetivo de aprendizagem listado no GDD ou documento equivalente, ao menos uma ocorrência dentro de uma missão, evento ou diálogo que o GDD ou documento equivalente descreve como situação real. Ligar cada uma dessas ocorrências a um personagem, objeto, ação ou problema da própria situação, e não a verbete de glossário ou de enciclopédia, menu de ajuda, tela de texto sem situação ou pergunta de quiz que só pede nome ou definição"
    depende_de: []
    definicoes:
      glossario: [missao, documentacao_equivalente, objetivo_de_aprendizagem]
      locais:
        "referente real": "uma situação, prática, profissão, fenômeno ou projeto que existe ou ocorre fora do jogo e que o GDD ou documento equivalente identifica por nome ou descrição específica"
        "situação do jogo": "uma missão, um evento do cenário ou um diálogo com personagem em que há um propósito dentro do jogo (objetivo de missão, problema a resolver ou pedido de personagem); não contam como situação do jogo o verbete de glossário ou de enciclopédia, o menu de ajuda, a tela de texto de conteúdo sem personagem, evento nem problema de missão, a pergunta de quiz que só pede o nome ou a definição do conceito sem citar personagem, objeto ou problema da situação, e o material fora do jogo (livro, aula, folha de atividade)"
        "situação real do jogo": "a situação do jogo que o GDD ou documento equivalente descreve como correspondente a uma situação, prática ou fenômeno real que existe ou ocorre fora do jogo (identificado por nome ou descrição específica), ou como reprodução do referente real nomeado para a premissa do jogo (D30); a situação fictícia que carrega o objetivo de aprendizagem não é situação real do jogo, e a classificação de uma situação do jogo como real vem só do GDD ou documento equivalente; o objetivo de aprendizagem é apresentado em uma situação real do jogo quando o conceito, fato ou procedimento é mencionado, demonstrado ou exigido dentro dela e ligado a um elemento da própria situação (personagem, objeto, ação ou problema da missão), de modo que o jogador o encontra no curso do propósito da situação"
        "objetivo avaliado": "o objetivo de aprendizagem listado sobre o qual há evidência determinada: no código e no GDD, todo objetivo listado; no vídeo, só o objetivo cuja apresentação aparece na gravação, de modo que o vídeo não avalia o objetivo que não mostra, e a ausência de um objetivo no vídeo não prova que o jogo não o apresenta"
        "confirmação pelo vídeo": "o vídeo sozinho confirma o estado atendido só quando todo objetivo listado é observado em situação real do jogo; sem código nem GDD que descrevam onde os objetivos aparecem, e sem essa confirmação pelo vídeo, o resultado é registrado como não confirmado e o grau é não atendido, por falta de evidência; o desempate entre fontes vale objetivo a objetivo, e o objetivo sem dado de código nem de GDD pode ser confirmado pelo vídeo para esse objetivo, de modo que a regra de que o vídeo só confirma atendido quando observa todo objetivo vale só quando nenhum objetivo tem dado de código ou de GDD"
        "escopo": "esta diretriz avalia a apresentação situada de cada objetivo em situação real do jogo, com referente real por objetivo: D30 avalia só a premissa do jogo e seu referente, e os objetos do cotidiano são tratados em D32"
      termos_comuns:
        "cenário": "em «evento do cenário» (local situação do jogo), cenário está no sentido corrente de ambiente do jogo, e não no de cenário jogável (D29), que restringiria a situação do jogo aos espaços com missão em curso"
