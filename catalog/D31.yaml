id: D31
categoria: realismo
diretriz: O jogo contextualiza o conteúdo com situações reais
fonte: Carvalho (2020), Quadro 3
modalidade: deve
aplicabilidade: null
criterios:
- id: D31.1
  nivel: A
  enunciado: 'Existe ao menos um objetivo de aprendizagem listado no GDD ou documento equivalente e todo objetivo de aprendizagem listado é apresentado em ao menos uma situação do jogo; Definições: objetivo de aprendizagem é cada conceito, fato ou procedimento listado como conteúdo a ser aprendido no GDD ou documento equivalente, e só essa lista define os objetivos avaliados; situação do jogo é uma missão, um evento do cenário ou um diálogo com personagem em que há um propósito dentro do jogo (objetivo de missão, problema a resolver ou pedido de personagem); missão é uma atividade com objetivo e condição de conclusão próprios, e o jogo sem divisão em missões conta como uma única missão; o objetivo de aprendizagem é apresentado em uma situação do jogo quando o conceito, fato ou procedimento é mencionado, demonstrado ou exigido dentro dela e ligado a um elemento da própria situação (personagem, objeto, ação ou problema da missão), de modo que o jogador o encontra no curso do propósito da situação; não contam como situação do jogo o verbete de glossário ou de enciclopédia, o menu de ajuda, a tela de texto de conteúdo sem personagem, evento nem problema de missão, a pergunta de quiz que só pede o nome ou a definição do conceito sem citar personagem, objeto ou problema da situação, e o material fora do jogo (livro, aula, folha de atividade); esta diretriz avalia só onde o objetivo aparece no jogo: a existência de referente real para a premissa é tratada em D30 e os objetos do cotidiano são tratados em D32'
  nivel_justificativa:
    essencialidade: alta
    viabilidade: alta
    texto: Em Vigotski os conceitos científicos se formam na relação com os conceitos cotidianos da experiência do sujeito, e um conceito apresentado só como definição fica separado dessa experiência; dentro de uma situação com personagem, objeto e propósito, o jogador encontra o conceito em uso, mediado pela situação. O critério mede onde o conteúdo aparece (em situação ou isolado), e a existência de referente real para a premissa é medida em D30; basta uma situação por objetivo porque a diretriz trata da presença da contextualização, e não de quantas vezes ela se repete. A essencialidade é alta porque o conteúdo a aprender é a razão de ser do jogo educacional e a situação é o meio pelo qual ele chega ao jogador. Inserir cada objetivo em uma missão, evento ou diálogo é decisão de roteiro, sem custo técnico especial; viabilidade alta.
  evidencia:
    codigo:
      procedimento: 'Com a lista de objetivos de aprendizagem do GDD, localizar em diálogos, scripts de missão, eventos e bancos de perguntas as ocorrências de cada conceito, fato ou procedimento e, para cada ocorrência, a missão, o evento ou o diálogo em que está e o elemento da situação (personagem, objeto, ação ou problema) a que se liga. Definições: objetivo de aprendizagem é cada conceito, fato ou procedimento listado como conteúdo a ser aprendido no GDD ou documento equivalente, e só essa lista define os objetivos avaliados; situação do jogo é uma missão, um evento do cenário ou um diálogo com personagem em que há um propósito dentro do jogo (objetivo de missão, problema a resolver ou pedido de personagem); missão é uma atividade com objetivo e condição de conclusão próprios, e o jogo sem divisão em missões conta como uma única missão; o objetivo de aprendizagem é apresentado em uma situação do jogo quando o conceito, fato ou procedimento é mencionado, demonstrado ou exigido dentro dela e ligado a um elemento da própria situação (personagem, objeto, ação ou problema da missão), de modo que o jogador o encontra no curso do propósito da situação; não contam como situação do jogo o verbete de glossário ou de enciclopédia, o menu de ajuda, a tela de texto de conteúdo sem personagem, evento nem problema de missão, a pergunta de quiz que só pede o nome ou a definição do conceito sem citar personagem, objeto ou problema da situação, e o material fora do jogo (livro, aula, folha de atividade); esta diretriz avalia só onde o objetivo aparece no jogo: a existência de referente real para a premissa é tratada em D30 e os objetos do cotidiano são tratados em D32. Regra de desempate: a lista de objetivos de aprendizagem vem só do GDD ou documento equivalente, e sem lista não há objetivo avaliado; se as fontes divergirem sobre um objetivo, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um objetivo conta como sem código para esse objetivo, e GDD que não descreve onde um objetivo aparece conta como sem GDD para esse objetivo'
      indicadores:
      - todos os objetivos de aprendizagem do GDD foram listados, cada um com as ocorrências encontradas no código ou nos dados do jogo (mínimo 0 ocorrências por objetivo)
      - para cada objetivo listado, ao menos uma ocorrência está em situação do jogo, isto é, é mencionada, demonstrada ou exigida dentro de missão, evento ou diálogo e ligada a elemento da própria situação
      - as ocorrências em verbete de glossário ou de enciclopédia, menu de ajuda, tela de texto sem situação ou pergunta de quiz que só pede nome ou definição foram anotadas e não contadas
      - se ao menos um objetivo tem ocorrência em situação do jogo e ao menos outro objetivo não tem, anotar (indica o estado parcial)
    documentacao:
      procedimento: 'Verificar no GDD ou documento equivalente a lista de objetivos de aprendizagem e, para cada um, a missão, o evento ou o diálogo em que o GDD descreve que ele é apresentado e o elemento da situação a que se liga. Definições: objetivo de aprendizagem é cada conceito, fato ou procedimento listado como conteúdo a ser aprendido no GDD ou documento equivalente, e só essa lista define os objetivos avaliados; situação do jogo é uma missão, um evento do cenário ou um diálogo com personagem em que há um propósito dentro do jogo (objetivo de missão, problema a resolver ou pedido de personagem); missão é uma atividade com objetivo e condição de conclusão próprios, e o jogo sem divisão em missões conta como uma única missão; o objetivo de aprendizagem é apresentado em uma situação do jogo quando o conceito, fato ou procedimento é mencionado, demonstrado ou exigido dentro dela e ligado a um elemento da própria situação (personagem, objeto, ação ou problema da missão), de modo que o jogador o encontra no curso do propósito da situação; não contam como situação do jogo o verbete de glossário ou de enciclopédia, o menu de ajuda, a tela de texto de conteúdo sem personagem, evento nem problema de missão, a pergunta de quiz que só pede o nome ou a definição do conceito sem citar personagem, objeto ou problema da situação, e o material fora do jogo (livro, aula, folha de atividade); esta diretriz avalia só onde o objetivo aparece no jogo: a existência de referente real para a premissa é tratada em D30 e os objetos do cotidiano são tratados em D32. Regra de desempate: a lista de objetivos de aprendizagem vem só do GDD ou documento equivalente, e sem lista não há objetivo avaliado; se as fontes divergirem sobre um objetivo, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um objetivo conta como sem código para esse objetivo, e GDD que não descreve onde um objetivo aparece conta como sem GDD para esse objetivo'
      indicadores:
      - o GDD lista os objetivos de aprendizagem (mínimo 0 objetivos)
      - para cada objetivo listado, o GDD descreve ao menos uma situação do jogo em que ele é apresentado, ligado a elemento da própria situação
      - os objetivos que o GDD descreve só como glossário, menu de ajuda, tela de texto sem situação, pergunta de quiz que só pede nome ou definição ou material fora do jogo foram anotados e não contados
      - se o GDD descreve situação para ao menos um objetivo e para ao menos outro não descreve, anotar (indica o estado parcial)
    video:
      procedimento: 'O vídeo só confirma o código ou o GDD: mostra os objetivos que aparecem na gravação, e a ausência de um objetivo no vídeo não prova que o jogo não o apresenta. Registrar, com timestamp, cada momento em que o jogo apresenta conceito, fato ou procedimento da lista do GDD, o objetivo correspondente e a situação em que ocorre. Definições: objetivo de aprendizagem é cada conceito, fato ou procedimento listado como conteúdo a ser aprendido no GDD ou documento equivalente, e só essa lista define os objetivos avaliados; situação do jogo é uma missão, um evento do cenário ou um diálogo com personagem em que há um propósito dentro do jogo (objetivo de missão, problema a resolver ou pedido de personagem); missão é uma atividade com objetivo e condição de conclusão próprios, e o jogo sem divisão em missões conta como uma única missão; o objetivo de aprendizagem é apresentado em uma situação do jogo quando o conceito, fato ou procedimento é mencionado, demonstrado ou exigido dentro dela e ligado a um elemento da própria situação (personagem, objeto, ação ou problema da missão), de modo que o jogador o encontra no curso do propósito da situação; não contam como situação do jogo o verbete de glossário ou de enciclopédia, o menu de ajuda, a tela de texto de conteúdo sem personagem, evento nem problema de missão, a pergunta de quiz que só pede o nome ou a definição do conceito sem citar personagem, objeto ou problema da situação, e o material fora do jogo (livro, aula, folha de atividade); esta diretriz avalia só onde o objetivo aparece no jogo: a existência de referente real para a premissa é tratada em D30 e os objetos do cotidiano são tratados em D32. Regra de desempate: a lista de objetivos de aprendizagem vem só do GDD ou documento equivalente, e sem lista não há objetivo avaliado; se as fontes divergirem sobre um objetivo, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um objetivo conta como sem código para esse objetivo, e GDD que não descreve onde um objetivo aparece conta como sem GDD para esse objetivo'
      indicadores:
      - cada apresentação de conceito, fato ou procedimento observada foi registrada com timestamp, objetivo de aprendizagem correspondente da lista do GDD e missão, evento ou diálogo em que ocorre (mínimo 0 registros)
      - cada registro foi classificado como apresentado em situação do jogo, quando é mencionado, demonstrado ou exigido dentro de missão, evento ou diálogo e ligado a elemento da própria situação, ou como apresentação isolada; só os classificados como em situação confirmam o objetivo
      - os objetivos da lista do GDD observados só em apresentação isolada foram anotados (indica o estado parcial quando ao menos outro objetivo está confirmado em situação)
  escala:
    atendido: Existe ao menos um objetivo de aprendizagem listado e todos os objetivos de aprendizagem listados são apresentados em ao menos uma situação do jogo, nos termos do enunciado
    parcial: 'Ao menos um objetivo de aprendizagem listado é apresentado em ao menos uma situação do jogo, nos termos do enunciado, e ao menos outro objetivo listado não é. Definições: objetivo de aprendizagem é cada conceito, fato ou procedimento listado como conteúdo a ser aprendido no GDD ou documento equivalente, e só essa lista define os objetivos avaliados; situação do jogo é uma missão, um evento do cenário ou um diálogo com personagem em que há um propósito dentro do jogo (objetivo de missão, problema a resolver ou pedido de personagem); missão é uma atividade com objetivo e condição de conclusão próprios, e o jogo sem divisão em missões conta como uma única missão; o objetivo de aprendizagem é apresentado em uma situação do jogo quando o conceito, fato ou procedimento é mencionado, demonstrado ou exigido dentro dela e ligado a um elemento da própria situação (personagem, objeto, ação ou problema da missão), de modo que o jogador o encontra no curso do propósito da situação; não contam como situação do jogo o verbete de glossário ou de enciclopédia, o menu de ajuda, a tela de texto de conteúdo sem personagem, evento nem problema de missão, a pergunta de quiz que só pede o nome ou a definição do conceito sem citar personagem, objeto ou problema da situação, e o material fora do jogo (livro, aula, folha de atividade)'
    nao_atendido: 'Nenhum objetivo de aprendizagem é apresentado em situação do jogo, nos termos do enunciado (inclui conteúdo só em glossário, menu de ajuda, tela de texto ou pergunta de quiz que só pede nome ou definição, e GDD ou documento equivalente sem lista de objetivos de aprendizagem). Definições: objetivo de aprendizagem é cada conceito, fato ou procedimento listado como conteúdo a ser aprendido no GDD ou documento equivalente, e só essa lista define os objetivos avaliados; situação do jogo é uma missão, um evento do cenário ou um diálogo com personagem em que há um propósito dentro do jogo (objetivo de missão, problema a resolver ou pedido de personagem); missão é uma atividade com objetivo e condição de conclusão próprios, e o jogo sem divisão em missões conta como uma única missão; o objetivo de aprendizagem é apresentado em uma situação do jogo quando o conceito, fato ou procedimento é mencionado, demonstrado ou exigido dentro dela e ligado a um elemento da própria situação (personagem, objeto, ação ou problema da missão), de modo que o jogador o encontra no curso do propósito da situação; não contam como situação do jogo o verbete de glossário ou de enciclopédia, o menu de ajuda, a tela de texto de conteúdo sem personagem, evento nem problema de missão, a pergunta de quiz que só pede o nome ou a definição do conceito sem citar personagem, objeto ou problema da situação, e o material fora do jogo (livro, aula, folha de atividade)'
  depende_de: []
