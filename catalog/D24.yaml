id: D24
categoria: autonomia
diretriz: "O jogador decide quais recursos utilizar"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D24.1
    nivel: A
    enunciado: "Em ao menos um desafio o jogador escolhe qual usar entre dois ou mais recursos alternativos válidos disponíveis ao mesmo tempo"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: alta
      texto: "Para Vigotski a atividade humana é mediada por instrumentos, e o sujeito se apropria deles ao escolhê-los e usá-los para resolver a tarefa; quando o jogo prescreve um único recurso, a escolha do meio de ação permanece com o sistema. A diretriz trata de meios alternativos para o mesmo desafio, e por isso é distinta de D03.1 (escolha da ordem entre atividades) e de D25 (escolha de conteúdo opcional, dispensável para a missão). Basta um segundo recurso válido em um desafio, decisão de projeto de baixo custo; viabilidade alta."
    evidencia:
      codigo:
        procedimento: "Localizar, em cada desafio, os recursos que o jogador pode selecionar (inventário, menus de ferramentas, atalhos, objetos interativos, seleção de abordagem) e, para cada um, os manipuladores de evento (handlers) e as condições que levam à conclusão do desafio; verificar se a condição de conclusão pode ser satisfeita por mais de um recurso, cada um sozinho, e se a seleção do recurso depende de entrada do jogador. Regra de desempate: se as fontes divergirem sobre um desafio, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um desafio conta como sem código para esse desafio, e GDD que não descreve um desafio conta como sem GDD para esse desafio"
        indicadores:
          - "todos os desafios foram listados, cada um com os recursos que o jogador pode selecionar e a indicação de quais estão disponíveis ao mesmo tempo (mínimo 0 desafios)"
          - "em ao menos um desafio listado, dois ou mais recursos disponíveis ao mesmo tempo levam, cada um sozinho, à mesma condição de conclusão do desafio, sem exigir o uso dos demais (indica o estado atendido)"
          - "nesse desafio, a seleção do recurso é feita por ação explícita do jogador, e não definida automaticamente pelo jogo"
          - "se existe desafio com dois ou mais recursos disponíveis ao mesmo tempo e em nenhum desses desafios dois recursos diferentes levam, cada um sozinho, à conclusão, anotar (indica o estado parcial; inclui o caso em que apenas um recurso conclui o desafio e o caso em que nenhum conclui sozinho e a conclusão exige a combinação de recursos, como chave e alavanca)"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente, para cada desafio, os recursos oferecidos ao jogador, se estão disponíveis ao mesmo tempo, se cada um permite concluir o desafio sozinho e se é o jogador quem seleciona. Regra de desempate: se as fontes divergirem sobre um desafio, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um desafio conta como sem código para esse desafio, e GDD que não descreve um desafio conta como sem GDD para esse desafio"
        indicadores:
          - "o GDD lista os desafios com os recursos que o jogador pode selecionar em cada um (mínimo 0 desafios)"
          - "em ao menos um desafio, o GDD descreve dois ou mais recursos disponíveis ao mesmo tempo e descreve que cada um permite concluir o desafio sem os demais (indica o estado atendido)"
          - "no mesmo desafio, o GDD descreve que o jogador seleciona o recurso"
          - "se o GDD descreve desafio com dois ou mais recursos disponíveis ao mesmo tempo e em nenhum desses desafios descreve dois recursos diferentes que concluem o desafio, cada um sozinho, anotar (indica o estado parcial; inclui o caso em que apenas um recurso conclui o desafio e o caso em que nenhum conclui sozinho e a conclusão exige a combinação de recursos, como chave e alavanca)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD: mostra o que a interface oferece e o recurso que o jogador gravado seleciona, mas não mostra que um recurso não usado também conclui o desafio, e a ausência de escolha no vídeo não prova que o jogo não a oferece. Registrar, em cada desafio gravado, os recursos que a interface oferece ao mesmo tempo, o recurso que o jogador seleciona e como o desafio termina. Regra de desempate: se as fontes divergirem sobre um desafio, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um desafio conta como sem código para esse desafio, e GDD que não descreve um desafio conta como sem GDD para esse desafio"
        indicadores:
          - "cada desafio gravado foi registrado com timestamp e com os recursos que a interface oferece ao mesmo tempo (mínimo 0 desafios)"
          - "em ao menos um desafio registrado, a interface oferece dois ou mais recursos ao mesmo tempo e o jogador seleciona um deles"
          - "o vídeo confirma que dois recursos são alternativos válidos quando o mesmo desafio é concluído com recursos diferentes, na mesma gravação ou em gravações distintas; o desafio concluído com um só recurso confirma apenas que esse recurso é válido"
    escala:
      atendido: "Em ao menos um desafio o jogador escolhe qual usar entre dois ou mais recursos alternativos válidos disponíveis ao mesmo tempo, nos termos do enunciado"
      parcial: "Existe ao menos um desafio com dois ou mais recursos disponíveis ao mesmo tempo, mas em nenhum desses desafios dois recursos alternativos válidos levam à conclusão isoladamente, nos termos do enunciado (inclui o desafio em que apenas um dos recursos conclui o desafio e o desafio em que nenhum recurso o conclui sozinho e a conclusão exige a combinação de recursos)"
      nao_atendido: "Em nenhum desafio o jogador escolhe entre dois ou mais recursos disponíveis ao mesmo tempo, nos termos do enunciado (inclui desafio com recurso único e desafio em que o jogo impõe o recurso)"
    depende_de: []
    definicoes:
      glossario: [missao, minijogo, desafio, documentacao_equivalente]
      locais:
        "recurso": "um objeto, ferramenta, item, habilidade ou abordagem (conjunto de ações) que o jogador seleciona por uma ação explícita (menu, inventário, atalho ou interação) para agir no desafio e cuja seleção muda as ações que ele executa ou o efeito delas; escolha só de aparência (cor, avatar) não é recurso, e alternativa de resposta de pergunta (múltipla escolha ou resposta digitada) não é recurso, pois é a própria resposta e não um meio de chegar a ela"
        "recursos disponíveis ao mesmo tempo": "recursos que o jogador pode selecionar em um mesmo estado do desafio"
        "recursos alternativos válidos": "dois ou mais recursos tais que cada um, usado sem os demais, permite satisfazer a mesma condição de conclusão do desafio; escolher entre desafios diferentes é tratado em D03 e acessar conteúdo opcional, dispensável para concluir a missão, é tratado em D25, e nenhum dos dois é escolha de recurso"
