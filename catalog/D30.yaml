id: D30
categoria: realismo
diretriz: O jogo deve colocar o jogador em uma situação realística
fonte: Carvalho (2020), Quadro 3
modalidade: deve
aplicabilidade: null
criterios:
- id: D30.1
  nivel: AA
  enunciado: 'O GDD ou documento equivalente nomeia um referente real para a premissa do jogo, indica ao menos um elemento da premissa que corresponde a esse referente e cita a fonte do referente; Definições: premissa do jogo é a situação em que o jogador é colocado no início da primeira missão (papel do jogador, local, tarefa e problema a resolver), e missão é uma atividade com objetivo e condição de conclusão próprios, de modo que o jogo sem divisão em missões conta como uma única missão; referente real é uma situação, prática, profissão, fenômeno ou projeto que existe ou ocorre fora do jogo e que o GDD ou documento equivalente identifica por nome ou descrição específica (por exemplo, um projeto de pesquisa nomeado, uma profissão, um processo ambiental documentado); não contam cenário ou enredo fictício, lugar real usado só como pano de fundo sem que a tarefa do jogador corresponda a algo do referente, e descrição genérica como "o mundo real" ou "o dia a dia"; a premissa corresponde ao referente real quando o GDD indica ao menos um elemento da premissa (papel do jogador, local, tarefa ou problema a resolver) que descreve como o mesmo elemento do referente (mesmo papel, local, tarefa ou problema); um elemento é o mínimo que liga a premissa ao referente, e a diretriz não fixa quantidade maior; fonte do referente é documento externo ao jogo que o GDD cita para descrever o referente (referência bibliográfica, página do projeto ou da instituição, norma, relatório ou registro de entrevista com profissionais), identificado por autoria ou endereço; menção sem identificação, como "segundo especialistas", não é fonte; esta diretriz avalia só a premissa e o referente: a presença do conteúdo em situações do jogo é tratada em D31 e os objetos do cotidiano são tratados em D32'
  nivel_justificativa:
    essencialidade: media
    viabilidade: alta
    texto: Em Vigotski o desenvolvimento ocorre no contexto sócio-histórico, e os conceitos científicos ganham sentido quando se ligam à prática social em que são usados; uma premissa com referente nomeado e documentado permite ao jogador relacionar o que faz no jogo a uma prática que existe fora dele. O critério avalia a existência do referente, da correspondência e da fonte, e não se o jogo parece verossímil, por isso o grau não depende de impressão do avaliador. A essencialidade é média porque a ligação com a vida fora do jogo também se dá pelo conteúdo em situação (D31) e pelos objetos do cotidiano (D32), sem que a premissa tenha referente. Nomear o referente e citar a fonte no GDD é decisão de projeto de baixo custo; viabilidade alta.
  evidencia:
    codigo: null
    documentacao:
      procedimento: 'Verificar no GDD ou documento equivalente a descrição da premissa do jogo e localizar o referente real que ela nomeia, o elemento da premissa que o GDD descreve como o mesmo do referente e a fonte citada para o referente. Definições: premissa do jogo é a situação em que o jogador é colocado no início da primeira missão (papel do jogador, local, tarefa e problema a resolver), e missão é uma atividade com objetivo e condição de conclusão próprios, de modo que o jogo sem divisão em missões conta como uma única missão; referente real é uma situação, prática, profissão, fenômeno ou projeto que existe ou ocorre fora do jogo e que o GDD ou documento equivalente identifica por nome ou descrição específica (por exemplo, um projeto de pesquisa nomeado, uma profissão, um processo ambiental documentado); não contam cenário ou enredo fictício, lugar real usado só como pano de fundo sem que a tarefa do jogador corresponda a algo do referente, e descrição genérica como "o mundo real" ou "o dia a dia"; a premissa corresponde ao referente real quando o GDD indica ao menos um elemento da premissa (papel do jogador, local, tarefa ou problema a resolver) que descreve como o mesmo elemento do referente (mesmo papel, local, tarefa ou problema); um elemento é o mínimo que liga a premissa ao referente, e a diretriz não fixa quantidade maior; fonte do referente é documento externo ao jogo que o GDD cita para descrever o referente (referência bibliográfica, página do projeto ou da instituição, norma, relatório ou registro de entrevista com profissionais), identificado por autoria ou endereço; menção sem identificação, como "segundo especialistas", não é fonte; esta diretriz avalia só a premissa e o referente: a presença do conteúdo em situações do jogo é tratada em D31 e os objetos do cotidiano são tratados em D32. Regra de desempate: se as fontes divergirem, vale o GDD; sem GDD, vale o vídeo, caso em que a tela de abertura, a tela de créditos ou a tela Sobre do jogo gravado conta como documento equivalente; GDD que existe mas não descreve a premissa conta como sem GDD'
      indicadores:
      - o GDD descreve a premissa do jogo (papel do jogador, local, tarefa e problema a resolver) e nomeia um referente real, por nome ou descrição específica
      - o GDD indica ao menos um elemento da premissa que descreve como o mesmo elemento do referente
      - o GDD cita fonte do referente, identificada por autoria ou endereço
      - se o GDD nomeia o referente e indica a correspondência mas não cita fonte, anotar (indica o estado parcial)
    video:
      procedimento: 'O vídeo só confirma o GDD: mostra o que o jogo exibe na abertura, e a ausência da fonte no vídeo não prova que o GDD não a cita, de modo que o vídeo sozinho com fonte ausente confirma no máximo o estado parcial. Registrar, com timestamp, o início da primeira missão e o que o jogo exibe nele em texto, fala ou tela, além da tela de créditos ou Sobre quando alcançada. Definições: premissa do jogo é a situação em que o jogador é colocado no início da primeira missão (papel do jogador, local, tarefa e problema a resolver), e missão é uma atividade com objetivo e condição de conclusão próprios, de modo que o jogo sem divisão em missões conta como uma única missão; referente real é uma situação, prática, profissão, fenômeno ou projeto que existe ou ocorre fora do jogo e que o GDD ou documento equivalente identifica por nome ou descrição específica (por exemplo, um projeto de pesquisa nomeado, uma profissão, um processo ambiental documentado); não contam cenário ou enredo fictício, lugar real usado só como pano de fundo sem que a tarefa do jogador corresponda a algo do referente, e descrição genérica como "o mundo real" ou "o dia a dia"; a premissa corresponde ao referente real quando o GDD indica ao menos um elemento da premissa (papel do jogador, local, tarefa ou problema a resolver) que descreve como o mesmo elemento do referente (mesmo papel, local, tarefa ou problema); um elemento é o mínimo que liga a premissa ao referente, e a diretriz não fixa quantidade maior; fonte do referente é documento externo ao jogo que o GDD cita para descrever o referente (referência bibliográfica, página do projeto ou da instituição, norma, relatório ou registro de entrevista com profissionais), identificado por autoria ou endereço; menção sem identificação, como "segundo especialistas", não é fonte; esta diretriz avalia só a premissa e o referente: a presença do conteúdo em situações do jogo é tratada em D31 e os objetos do cotidiano são tratados em D32. Regra de desempate: se as fontes divergirem, vale o GDD; sem GDD, vale o vídeo, caso em que a tela de abertura, a tela de créditos ou a tela Sobre do jogo gravado conta como documento equivalente; GDD que existe mas não descreve a premissa conta como sem GDD'
      indicadores:
      - 'o início da primeira missão (ou do jogo, se não houver missões) foi registrado com o que o jogo exibe: nome ou descrição do referente, papel do jogador, local, tarefa ou problema (mínimo 1 registro)'
      - o nome ou a descrição do referente exibido é o do referente nomeado no GDD, e ao menos um elemento da premissa exibido é o que o GDD indica como correspondente
      - o jogo exibe a fonte do referente, identificada por autoria ou endereço, na abertura, nos créditos ou na tela Sobre; fonte exibida confirma o estado atendido, e fonte não exibida deixa o vídeo no estado parcial
  escala:
    atendido: O GDD ou documento equivalente nomeia um referente real para a premissa do jogo, indica ao menos um elemento da premissa que corresponde a esse referente e cita a fonte do referente, nos termos do enunciado
    parcial: 'O GDD nomeia um referente real para a premissa e indica ao menos um elemento da premissa que corresponde a esse referente, nos termos do enunciado, mas não cita a fonte do referente. Definições: referente real é uma situação, prática, profissão, fenômeno ou projeto que existe ou ocorre fora do jogo e que o GDD ou documento equivalente identifica por nome ou descrição específica (por exemplo, um projeto de pesquisa nomeado, uma profissão, um processo ambiental documentado); não contam cenário ou enredo fictício, lugar real usado só como pano de fundo sem que a tarefa do jogador corresponda a algo do referente, e descrição genérica como "o mundo real" ou "o dia a dia"; a premissa corresponde ao referente real quando o GDD indica ao menos um elemento da premissa (papel do jogador, local, tarefa ou problema a resolver) que descreve como o mesmo elemento do referente (mesmo papel, local, tarefa ou problema); um elemento é o mínimo que liga a premissa ao referente, e a diretriz não fixa quantidade maior; fonte do referente é documento externo ao jogo que o GDD cita para descrever o referente (referência bibliográfica, página do projeto ou da instituição, norma, relatório ou registro de entrevista com profissionais), identificado por autoria ou endereço; menção sem identificação, como "segundo especialistas", não é fonte'
    nao_atendido: 'O GDD não nomeia referente real para a premissa, ou nomeia mas não indica elemento da premissa que corresponda a ele, nos termos do enunciado (inclui premissa fictícia, lugar real só como pano de fundo, descrição genérica do referente e ausência de GDD ou documento equivalente). Definições: premissa do jogo é a situação em que o jogador é colocado no início da primeira missão (papel do jogador, local, tarefa e problema a resolver), e missão é uma atividade com objetivo e condição de conclusão próprios, de modo que o jogo sem divisão em missões conta como uma única missão; referente real é uma situação, prática, profissão, fenômeno ou projeto que existe ou ocorre fora do jogo e que o GDD ou documento equivalente identifica por nome ou descrição específica (por exemplo, um projeto de pesquisa nomeado, uma profissão, um processo ambiental documentado); não contam cenário ou enredo fictício, lugar real usado só como pano de fundo sem que a tarefa do jogador corresponda a algo do referente, e descrição genérica como "o mundo real" ou "o dia a dia"; a premissa corresponde ao referente real quando o GDD indica ao menos um elemento da premissa (papel do jogador, local, tarefa ou problema a resolver) que descreve como o mesmo elemento do referente (mesmo papel, local, tarefa ou problema); um elemento é o mínimo que liga a premissa ao referente, e a diretriz não fixa quantidade maior'
