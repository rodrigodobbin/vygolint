id: D33
categoria: personalizacao
diretriz: Os desafios devem ser personalizados de acordo com o desempenho do jogador
fonte: Carvalho (2020), Quadro 3
modalidade: deve
aplicabilidade: null
criterios:
- id: D33.1
  nivel: AAA
  enunciado: 'Em ao menos um desafio, ao menos um parâmetro do desafio posterior é definido por regra que lê uma métrica de desempenho registrada do jogador e produz valores diferentes conforme a métrica; Definições: desafio é cada missão ou minijogo; missão é uma atividade com objetivo e condição de conclusão próprios, e o jogo sem divisão em missões conta como uma única missão; métrica de desempenho é um valor que o jogo calcula e guarda durante a partida a partir do resultado do jogador nos desafios (pontuação, número de acertos ou de erros, taxa de acerto, tempo gasto ou número de tentativas); não contam escolha entre opções que o jogo não avalia como acerto ou erro (tratada em D34), nível de dificuldade escolhido pelo jogador, dado informado antes do jogo (idade, perfil) e valor que o jogo não guarda; parâmetro do desafio é um valor que define o que o jogador enfrenta no desafio: a dificuldade (nível, velocidade, tolerância a erro), a quantidade (de itens, de perguntas, de tentativas permitidas), o tempo disponível, a meta de conclusão ou o conteúdo (qual pergunta, objetivo ou situação é apresentado); não contam texto de feedback, dica ou orientação (tratados em D17 e D18), aparência (cor, avatar, tema visual) e pontuação ou recompensa concedida; desafio posterior é o desafio, a rodada ou a nova tentativa que começa depois do registro da métrica de desempenho do jogador, no mesmo desafio ou em outro; o desafio é personalizado por desempenho quando o valor de um parâmetro do desafio posterior é definido por regra que lê a métrica de desempenho registrada do jogador e produz ao menos dois valores diferentes do parâmetro para ao menos dois valores diferentes da métrica; aumento de parâmetro por ordem fixa dos desafios, igual para todo jogador, e escolha manual do parâmetro pelo jogador não são personalização por desempenho; se a regra lê acerto, erro, tempo, pontuação ou número de tentativas, a personalização é de desempenho (D33); se lê qual opção, item, caminho ou modo de agir foi usado, é de ação (D34); regra que lê os dois conta nas duas diretrizes; a mudança só do texto de feedback é tratada em D18'
  nivel_justificativa:
    essencialidade: baixa
    viabilidade: baixa
    texto: Na zona de desenvolvimento proximal de Vigotski, a tarefa deve ficar entre o que o aprendiz faz sozinho e o que faz com apoio, e quem media ajusta a tarefa ao que ele mostrou fazer; um desafio de parâmetros fixos fica igual para jogadores com desempenhos diferentes. O critério exige um parâmetro que muda por regra sobre métrica registrada, e distingue-se de D18 (só a mensagem muda) e de D34 (a regra lê a escolha ou a ação, e não o resultado); basta um desafio porque a personalização exige um modelo de desempenho, e exigir todos faria o grau depender do número de desafios do jogo. A essencialidade é baixa porque a mediação também se dá por feedback e orientação (D17, D18), e a viabilidade é baixa porque exige medir o desempenho, definir os limites de mudança e produzir variantes de conteúdo por faixa; AAA.
  evidencia:
    codigo:
      procedimento: 'Localizar as variáveis que guardam métricas de desempenho (pontuação, acertos, erros, tempo, tentativas) e as funções que definem parâmetros de desafio (velocidade, quantidade de perguntas, tempo, seleção de perguntas ou fases) e verificar se algum parâmetro é atribuído por regra que lê a métrica, com ao menos dois ramos ou valores. Definições: desafio é cada missão ou minijogo; missão é uma atividade com objetivo e condição de conclusão próprios, e o jogo sem divisão em missões conta como uma única missão; métrica de desempenho é um valor que o jogo calcula e guarda durante a partida a partir do resultado do jogador nos desafios (pontuação, número de acertos ou de erros, taxa de acerto, tempo gasto ou número de tentativas); não contam escolha entre opções que o jogo não avalia como acerto ou erro (tratada em D34), nível de dificuldade escolhido pelo jogador, dado informado antes do jogo (idade, perfil) e valor que o jogo não guarda; parâmetro do desafio é um valor que define o que o jogador enfrenta no desafio: a dificuldade (nível, velocidade, tolerância a erro), a quantidade (de itens, de perguntas, de tentativas permitidas), o tempo disponível, a meta de conclusão ou o conteúdo (qual pergunta, objetivo ou situação é apresentado); não contam texto de feedback, dica ou orientação (tratados em D17 e D18), aparência (cor, avatar, tema visual) e pontuação ou recompensa concedida; desafio posterior é o desafio, a rodada ou a nova tentativa que começa depois do registro da métrica de desempenho do jogador, no mesmo desafio ou em outro; o desafio é personalizado por desempenho quando o valor de um parâmetro do desafio posterior é definido por regra que lê a métrica de desempenho registrada do jogador e produz ao menos dois valores diferentes do parâmetro para ao menos dois valores diferentes da métrica; aumento de parâmetro por ordem fixa dos desafios, igual para todo jogador, e escolha manual do parâmetro pelo jogador não são personalização por desempenho; se a regra lê acerto, erro, tempo, pontuação ou número de tentativas, a personalização é de desempenho (D33); se lê qual opção, item, caminho ou modo de agir foi usado, é de ação (D34); regra que lê os dois conta nas duas diretrizes; a mudança só do texto de feedback é tratada em D18. Regra de desempate: se as fontes divergirem sobre um desafio, vale o código; sem código, o GDD; código que existe mas não traz dado sobre um desafio conta como sem código para esse desafio, e GDD que não descreve um desafio conta como sem GDD para esse desafio'
      indicadores:
      - todas as métricas de desempenho guardadas foram listadas, cada uma com o trecho de código que a calcula e guarda (mínimo 0 métricas)
      - existe, em ao menos um desafio, um parâmetro do desafio posterior atribuído por regra que lê uma métrica listada
      - a regra produz ao menos dois valores diferentes do parâmetro para ao menos dois valores diferentes da métrica
      - se existe métrica guardada e nenhuma regra de parâmetro a lê (uso só para exibir pontuação, relatório ou mensagem de feedback), anotar (indica o estado parcial)
    documentacao:
      procedimento: 'Verificar no GDD ou documento equivalente as métricas de desempenho que o jogo registra e as regras de adaptação, isto é, qual parâmetro do desafio muda, para qual valor da métrica e para qual valor do parâmetro. Definições: desafio é cada missão ou minijogo; missão é uma atividade com objetivo e condição de conclusão próprios, e o jogo sem divisão em missões conta como uma única missão; métrica de desempenho é um valor que o jogo calcula e guarda durante a partida a partir do resultado do jogador nos desafios (pontuação, número de acertos ou de erros, taxa de acerto, tempo gasto ou número de tentativas); não contam escolha entre opções que o jogo não avalia como acerto ou erro (tratada em D34), nível de dificuldade escolhido pelo jogador, dado informado antes do jogo (idade, perfil) e valor que o jogo não guarda; parâmetro do desafio é um valor que define o que o jogador enfrenta no desafio: a dificuldade (nível, velocidade, tolerância a erro), a quantidade (de itens, de perguntas, de tentativas permitidas), o tempo disponível, a meta de conclusão ou o conteúdo (qual pergunta, objetivo ou situação é apresentado); não contam texto de feedback, dica ou orientação (tratados em D17 e D18), aparência (cor, avatar, tema visual) e pontuação ou recompensa concedida; desafio posterior é o desafio, a rodada ou a nova tentativa que começa depois do registro da métrica de desempenho do jogador, no mesmo desafio ou em outro; o desafio é personalizado por desempenho quando o valor de um parâmetro do desafio posterior é definido por regra que lê a métrica de desempenho registrada do jogador e produz ao menos dois valores diferentes do parâmetro para ao menos dois valores diferentes da métrica; aumento de parâmetro por ordem fixa dos desafios, igual para todo jogador, e escolha manual do parâmetro pelo jogador não são personalização por desempenho; se a regra lê acerto, erro, tempo, pontuação ou número de tentativas, a personalização é de desempenho (D33); se lê qual opção, item, caminho ou modo de agir foi usado, é de ação (D34); regra que lê os dois conta nas duas diretrizes; a mudança só do texto de feedback é tratada em D18. Regra de desempate: se as fontes divergirem sobre um desafio, vale o código; sem código, o GDD; código que existe mas não traz dado sobre um desafio conta como sem código para esse desafio, e GDD que não descreve um desafio conta como sem GDD para esse desafio'
      indicadores:
      - o GDD lista as métricas de desempenho registradas (mínimo 0 métricas)
      - o GDD descreve, em ao menos um desafio, um parâmetro do desafio posterior e a regra que o define a partir de uma métrica, com ao menos dois valores do parâmetro para dois valores da métrica
      - se o GDD descreve métrica registrada e nenhuma regra de parâmetro que a use, anotar (indica o estado parcial)
    video: null
  escala:
    atendido: Em ao menos um desafio, ao menos um parâmetro do desafio posterior é definido por regra que lê uma métrica de desempenho registrada do jogador e produz valores diferentes conforme a métrica, nos termos do enunciado
    parcial: 'O jogo registra ao menos uma métrica de desempenho, nos termos do enunciado, mas nenhum parâmetro de desafio posterior é definido por regra que a leia (inclui métrica usada só para exibir pontuação, relatório ou mensagem de feedback). Definições: métrica de desempenho é um valor que o jogo calcula e guarda durante a partida a partir do resultado do jogador nos desafios (pontuação, número de acertos ou de erros, taxa de acerto, tempo gasto ou número de tentativas); não contam escolha entre opções que o jogo não avalia como acerto ou erro (tratada em D34), nível de dificuldade escolhido pelo jogador, dado informado antes do jogo (idade, perfil) e valor que o jogo não guarda; parâmetro do desafio é um valor que define o que o jogador enfrenta no desafio: a dificuldade (nível, velocidade, tolerância a erro), a quantidade (de itens, de perguntas, de tentativas permitidas), o tempo disponível, a meta de conclusão ou o conteúdo (qual pergunta, objetivo ou situação é apresentado); não contam texto de feedback, dica ou orientação (tratados em D17 e D18), aparência (cor, avatar, tema visual) e pontuação ou recompensa concedida; desafio posterior é o desafio, a rodada ou a nova tentativa que começa depois do registro da métrica de desempenho do jogador, no mesmo desafio ou em outro'
    nao_atendido: 'O jogo não registra métrica de desempenho, nos termos do enunciado (inclui jogo que não guarda pontuação, acertos, erros, tempo nem tentativas). Definições: métrica de desempenho é um valor que o jogo calcula e guarda durante a partida a partir do resultado do jogador nos desafios (pontuação, número de acertos ou de erros, taxa de acerto, tempo gasto ou número de tentativas); não contam escolha entre opções que o jogo não avalia como acerto ou erro (tratada em D34), nível de dificuldade escolhido pelo jogador, dado informado antes do jogo (idade, perfil) e valor que o jogo não guarda; o desafio é personalizado por desempenho quando o valor de um parâmetro do desafio posterior é definido por regra que lê a métrica de desempenho registrada do jogador e produz ao menos dois valores diferentes do parâmetro para ao menos dois valores diferentes da métrica; aumento de parâmetro por ordem fixa dos desafios, igual para todo jogador, e escolha manual do parâmetro pelo jogador não são personalização por desempenho'
