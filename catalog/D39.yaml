id: D39
categoria: atencao
diretriz: "O mundo do jogo deve exigir do jogador a percepção de detalhes"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D39.1
    nivel: AA
    enunciado: "Ao menos um desafio do jogo exige um detalhe do cenário jogável que não é sinalizado explicitamente; Definições: desafio é uma unidade do jogo com objetivo e condição de conclusão próprios (missão, minijogo ou etapa com condição de conclusão própria), e o jogo sem divisão em missões conta como uma única missão; cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o cenário em que nenhuma missão está em curso (hub, sandbox) não é cenário jogável; detalhe é um elemento visível de um cenário jogável (objeto, forma, cor, posição, quantidade, inscrição ou mudança de estado de um objeto) cujo valor ou cuja presença o jogador precisa para resolver o desafio, e não são detalhe o elemento da interface (menu, painel, inventário, barra de status) nem o texto do enunciado da questão ou da instrução do jogo; o desafio exige o detalhe quando a condição de conclusão do desafio depende do valor ou da presença do detalhe (uma resposta, um código ou uma ação sobre o elemento) e o jogo não fornece a mesma informação por outro meio, isto é, por texto, fala, dica ou item do jogo que a informe, e a tentativa e erro sem essa informação não é outro meio; o detalhe é sinalizado explicitamente quando o jogo dá ao elemento, antes de o jogador agir sobre ele, ao menos um destes sinais: marcador (ícone, seta, ponto em mapa ou bússola), destaque (brilho, contorno, mudança de cor, animação ou partícula no elemento, exibidos desde o início ou por proximidade) ou instrução, dica ou fala que cita o elemento e informa onde ele está ou qual valor deve ser lido dele; a instrução que só nomeia a categoria do que procurar (como \"procure pistas\") não sinaliza o elemento, e o realce exibido só depois de o jogador apontar o cursor para o elemento ou tocá-lo não é sinalização"
    nivel_justificativa:
      essencialidade: media
      viabilidade: alta
      texto: "A atenção voluntária é, em Vigotski, uma função psicológica superior que se forma pela mediação de signos: o sujeito aprende a dirigir a atenção ao que o meio e o outro lhe indicam. Um desafio que exige notar um detalhe não sinalizado dá ao jogador a tarefa de selecionar sozinho o que é relevante no cenário, o que exercita essa função, ao passo que seguir marcadores só a delega ao jogo. A essencialidade é média porque a aprendizagem também ocorre em desafios sinalizados; por isso basta que ao menos um desafio exija o detalhe, o mínimo que mostra que o mundo do jogo demanda essa percepção. Colocar um elemento sem marcador e fazer a conclusão depender dele é decisão de projeto de baixo custo; viabilidade alta."
    evidencia:
      codigo:
        procedimento: "Listar os desafios cuja condição de conclusão lê o valor, a presença ou a interação com um elemento do cenário (comparação com atributo de objeto, código digitado que consta em inscrição do cenário, objeto que precisa ser achado, mudança de estado a observar). Em cada elemento, verificar se existe marcador, destaque ou instrução, dica ou fala que o cite e informe onde está ou o valor a ler, e se o jogo fornece a mesma informação por outro meio (texto, fala, dica, item). Definições: desafio é uma unidade do jogo com objetivo e condição de conclusão próprios (missão, minijogo ou etapa com condição de conclusão própria), e o jogo sem divisão em missões conta como uma única missão; cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o cenário em que nenhuma missão está em curso (hub, sandbox) não é cenário jogável; detalhe é um elemento visível de um cenário jogável (objeto, forma, cor, posição, quantidade, inscrição ou mudança de estado de um objeto) cujo valor ou cuja presença o jogador precisa para resolver o desafio, e não são detalhe o elemento da interface (menu, painel, inventário, barra de status) nem o texto do enunciado da questão ou da instrução do jogo; o desafio exige o detalhe quando a condição de conclusão do desafio depende do valor ou da presença do detalhe (uma resposta, um código ou uma ação sobre o elemento) e o jogo não fornece a mesma informação por outro meio, isto é, por texto, fala, dica ou item do jogo que a informe, e a tentativa e erro sem essa informação não é outro meio; o detalhe é sinalizado explicitamente quando o jogo dá ao elemento, antes de o jogador agir sobre ele, ao menos um destes sinais: marcador (ícone, seta, ponto em mapa ou bússola), destaque (brilho, contorno, mudança de cor, animação ou partícula no elemento, exibidos desde o início ou por proximidade) ou instrução, dica ou fala que cita o elemento e informa onde ele está ou qual valor deve ser lido dele; a instrução que só nomeia a categoria do que procurar (como \"procure pistas\") não sinaliza o elemento, e o realce exibido só depois de o jogador apontar o cursor para o elemento ou tocá-lo não é sinalização. Regra de desempate: se as fontes divergirem sobre um desafio, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre o desafio conta como sem código para esse desafio, e GDD que não descreve o desafio conta como sem GDD para esse desafio. O vídeo mostra os sinais exibidos ao jogador gravado, mas a dica pedida pelo jogador não aparece se ele não a pediu; por isso o vídeo confirma a sinalização quando a mostra e não prova a ausência de sinalização. Sem código nem GDD, o vídeo decide só pelo que mostra: o grau é atendido quando o vídeo mostra um desafio resolvido pela ação sobre um detalhe ao qual nenhum sinal visto ou ouvido no vídeo se refere, anotando que dicas não pedidas pelo jogador gravado podem existir; parcial quando mostra desafio resolvido pela ação sobre um detalhe e mostra sinal que o aponta; nao_atendido nos demais casos, anotando que o grau decorre da falta de evidência"
        indicadores:
          - "os desafios cuja condição de conclusão depende do valor, da presença ou da ação sobre um elemento do cenário jogável foram listados, cada um com o elemento exigido (mínimo 0 desafios)"
          - "em ao menos um desafio listado, o elemento exigido não tem marcador nem destaque no código (sem componente, ícone, contorno, brilho, partícula ou animação que o assinale antes da ação do jogador) e nenhum texto, dica ou fala do jogo o cita informando onde está ou qual valor ler"
          - "em ao menos um desafio listado, o jogo não fornece por outro meio (texto, fala, dica ou item) a informação que o elemento contém"
          - "se existem desafios que exigem detalhe e todos os detalhes são sinalizados, anotar (indica o estado parcial)"
          - "se nenhuma condição de conclusão depende de elemento do cenário, anotar (indica o estado nao_atendido)"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente os desafios que dependem de um elemento do cenário, o detalhe exigido e o que o jogo apresenta ao jogador sobre esse detalhe. Definições: desafio é uma unidade do jogo com objetivo e condição de conclusão próprios (missão, minijogo ou etapa com condição de conclusão própria), e o jogo sem divisão em missões conta como uma única missão; cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o cenário em que nenhuma missão está em curso (hub, sandbox) não é cenário jogável; detalhe é um elemento visível de um cenário jogável (objeto, forma, cor, posição, quantidade, inscrição ou mudança de estado de um objeto) cujo valor ou cuja presença o jogador precisa para resolver o desafio, e não são detalhe o elemento da interface (menu, painel, inventário, barra de status) nem o texto do enunciado da questão ou da instrução do jogo; o desafio exige o detalhe quando a condição de conclusão do desafio depende do valor ou da presença do detalhe (uma resposta, um código ou uma ação sobre o elemento) e o jogo não fornece a mesma informação por outro meio, isto é, por texto, fala, dica ou item do jogo que a informe, e a tentativa e erro sem essa informação não é outro meio; o detalhe é sinalizado explicitamente quando o jogo dá ao elemento, antes de o jogador agir sobre ele, ao menos um destes sinais: marcador (ícone, seta, ponto em mapa ou bússola), destaque (brilho, contorno, mudança de cor, animação ou partícula no elemento, exibidos desde o início ou por proximidade) ou instrução, dica ou fala que cita o elemento e informa onde ele está ou qual valor deve ser lido dele; a instrução que só nomeia a categoria do que procurar (como \"procure pistas\") não sinaliza o elemento, e o realce exibido só depois de o jogador apontar o cursor para o elemento ou tocá-lo não é sinalização. Regra de desempate: se as fontes divergirem sobre um desafio, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre o desafio conta como sem código para esse desafio, e GDD que não descreve o desafio conta como sem GDD para esse desafio. O vídeo mostra os sinais exibidos ao jogador gravado, mas a dica pedida pelo jogador não aparece se ele não a pediu; por isso o vídeo confirma a sinalização quando a mostra e não prova a ausência de sinalização. Sem código nem GDD, o vídeo decide só pelo que mostra: o grau é atendido quando o vídeo mostra um desafio resolvido pela ação sobre um detalhe ao qual nenhum sinal visto ou ouvido no vídeo se refere, anotando que dicas não pedidas pelo jogador gravado podem existir; parcial quando mostra desafio resolvido pela ação sobre um detalhe e mostra sinal que o aponta; nao_atendido nos demais casos, anotando que o grau decorre da falta de evidência"
        indicadores:
          - "o GDD descreve ao menos um desafio cuja conclusão depende de um detalhe do cenário jogável e identifica o detalhe (mínimo 0 desafios)"
          - "o GDD descreve que o detalhe é deixado para o jogador perceber, sem marcador, destaque, instrução, dica ou fala que o aponte"
          - "o GDD descreve que a informação do detalhe não é fornecida por outro meio"
          - "se o GDD descreve desafio que depende de detalhe e descreve que todo detalhe tem marcador, destaque, instrução ou dica que o aponta, anotar (indica o estado parcial)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD, e a ausência de sinalização no vídeo não prova que o jogo não a tem. Registrar cada desafio resolvido no vídeo, o elemento do cenário sobre o qual o jogador agiu ou do qual leu um valor e, nos instantes anteriores à ação, os marcadores, destaques, textos ou falas exibidos que se refiram a esse elemento. Definições: desafio é uma unidade do jogo com objetivo e condição de conclusão próprios (missão, minijogo ou etapa com condição de conclusão própria), e o jogo sem divisão em missões conta como uma única missão; cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o cenário em que nenhuma missão está em curso (hub, sandbox) não é cenário jogável; detalhe é um elemento visível de um cenário jogável (objeto, forma, cor, posição, quantidade, inscrição ou mudança de estado de um objeto) cujo valor ou cuja presença o jogador precisa para resolver o desafio, e não são detalhe o elemento da interface (menu, painel, inventário, barra de status) nem o texto do enunciado da questão ou da instrução do jogo; o desafio exige o detalhe quando a condição de conclusão do desafio depende do valor ou da presença do detalhe (uma resposta, um código ou uma ação sobre o elemento) e o jogo não fornece a mesma informação por outro meio, isto é, por texto, fala, dica ou item do jogo que a informe, e a tentativa e erro sem essa informação não é outro meio; o detalhe é sinalizado explicitamente quando o jogo dá ao elemento, antes de o jogador agir sobre ele, ao menos um destes sinais: marcador (ícone, seta, ponto em mapa ou bússola), destaque (brilho, contorno, mudança de cor, animação ou partícula no elemento, exibidos desde o início ou por proximidade) ou instrução, dica ou fala que cita o elemento e informa onde ele está ou qual valor deve ser lido dele; a instrução que só nomeia a categoria do que procurar (como \"procure pistas\") não sinaliza o elemento, e o realce exibido só depois de o jogador apontar o cursor para o elemento ou tocá-lo não é sinalização. Regra de desempate: se as fontes divergirem sobre um desafio, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre o desafio conta como sem código para esse desafio, e GDD que não descreve o desafio conta como sem GDD para esse desafio. O vídeo mostra os sinais exibidos ao jogador gravado, mas a dica pedida pelo jogador não aparece se ele não a pediu; por isso o vídeo confirma a sinalização quando a mostra e não prova a ausência de sinalização. Sem código nem GDD, o vídeo decide só pelo que mostra: o grau é atendido quando o vídeo mostra um desafio resolvido pela ação sobre um detalhe ao qual nenhum sinal visto ou ouvido no vídeo se refere, anotando que dicas não pedidas pelo jogador gravado podem existir; parcial quando mostra desafio resolvido pela ação sobre um detalhe e mostra sinal que o aponta; nao_atendido nos demais casos, anotando que o grau decorre da falta de evidência"
        indicadores:
          - "os desafios resolvidos no vídeo por ação sobre um elemento do cenário ou leitura de valor nele foram registrados, cada um com o elemento e o instante (mínimo 0 desafios)"
          - "em ao menos um desafio registrado, nenhum marcador, destaque, texto ou fala visto ou ouvido no vídeo se refere ao elemento antes da ação do jogador"
          - "os desafios registrados em que o vídeo mostra sinal que aponta o elemento foram anotados (indica o estado parcial quando todo detalhe observado é sinalizado)"
    escala:
      atendido: "Existe ao menos um desafio que exige um detalhe do cenário jogável não sinalizado explicitamente, nos termos do enunciado. Definições: desafio é uma unidade do jogo com objetivo e condição de conclusão próprios (missão, minijogo ou etapa com condição de conclusão própria), e o jogo sem divisão em missões conta como uma única missão; cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o cenário em que nenhuma missão está em curso (hub, sandbox) não é cenário jogável; detalhe é um elemento visível de um cenário jogável (objeto, forma, cor, posição, quantidade, inscrição ou mudança de estado de um objeto) cujo valor ou cuja presença o jogador precisa para resolver o desafio, e não são detalhe o elemento da interface (menu, painel, inventário, barra de status) nem o texto do enunciado da questão ou da instrução do jogo; o desafio exige o detalhe quando a condição de conclusão do desafio depende do valor ou da presença do detalhe (uma resposta, um código ou uma ação sobre o elemento) e o jogo não fornece a mesma informação por outro meio, isto é, por texto, fala, dica ou item do jogo que a informe, e a tentativa e erro sem essa informação não é outro meio; o detalhe é sinalizado explicitamente quando o jogo dá ao elemento, antes de o jogador agir sobre ele, ao menos um destes sinais: marcador (ícone, seta, ponto em mapa ou bússola), destaque (brilho, contorno, mudança de cor, animação ou partícula no elemento, exibidos desde o início ou por proximidade) ou instrução, dica ou fala que cita o elemento e informa onde ele está ou qual valor deve ser lido dele; a instrução que só nomeia a categoria do que procurar (como \"procure pistas\") não sinaliza o elemento, e o realce exibido só depois de o jogador apontar o cursor para o elemento ou tocá-lo não é sinalização"
      parcial: "Existe ao menos um desafio que exige um detalhe do cenário jogável, nos termos do enunciado, mas todo detalhe exigido é sinalizado explicitamente. Definições: desafio é uma unidade do jogo com objetivo e condição de conclusão próprios (missão, minijogo ou etapa com condição de conclusão própria), e o jogo sem divisão em missões conta como uma única missão; cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o cenário em que nenhuma missão está em curso (hub, sandbox) não é cenário jogável; detalhe é um elemento visível de um cenário jogável (objeto, forma, cor, posição, quantidade, inscrição ou mudança de estado de um objeto) cujo valor ou cuja presença o jogador precisa para resolver o desafio, e não são detalhe o elemento da interface (menu, painel, inventário, barra de status) nem o texto do enunciado da questão ou da instrução do jogo; o desafio exige o detalhe quando a condição de conclusão do desafio depende do valor ou da presença do detalhe (uma resposta, um código ou uma ação sobre o elemento) e o jogo não fornece a mesma informação por outro meio, isto é, por texto, fala, dica ou item do jogo que a informe, e a tentativa e erro sem essa informação não é outro meio; o detalhe é sinalizado explicitamente quando o jogo dá ao elemento, antes de o jogador agir sobre ele, ao menos um destes sinais: marcador (ícone, seta, ponto em mapa ou bússola), destaque (brilho, contorno, mudança de cor, animação ou partícula no elemento, exibidos desde o início ou por proximidade) ou instrução, dica ou fala que cita o elemento e informa onde ele está ou qual valor deve ser lido dele; a instrução que só nomeia a categoria do que procurar (como \"procure pistas\") não sinaliza o elemento, e o realce exibido só depois de o jogador apontar o cursor para o elemento ou tocá-lo não é sinalização"
      nao_atendido: "Nenhum desafio exige um detalhe do cenário jogável, nos termos do enunciado (inclui desafio resolvido sem notar elemento do cenário e desafio cuja informação o jogo fornece também por texto, fala, dica ou item). Definições: desafio é uma unidade do jogo com objetivo e condição de conclusão próprios (missão, minijogo ou etapa com condição de conclusão própria), e o jogo sem divisão em missões conta como uma única missão; cenário jogável é cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o cenário em que nenhuma missão está em curso (hub, sandbox) não é cenário jogável; detalhe é um elemento visível de um cenário jogável (objeto, forma, cor, posição, quantidade, inscrição ou mudança de estado de um objeto) cujo valor ou cuja presença o jogador precisa para resolver o desafio, e não são detalhe o elemento da interface (menu, painel, inventário, barra de status) nem o texto do enunciado da questão ou da instrução do jogo; o desafio exige o detalhe quando a condição de conclusão do desafio depende do valor ou da presença do detalhe (uma resposta, um código ou uma ação sobre o elemento) e o jogo não fornece a mesma informação por outro meio, isto é, por texto, fala, dica ou item do jogo que a informe, e a tentativa e erro sem essa informação não é outro meio; o detalhe é sinalizado explicitamente quando o jogo dá ao elemento, antes de o jogador agir sobre ele, ao menos um destes sinais: marcador (ícone, seta, ponto em mapa ou bússola), destaque (brilho, contorno, mudança de cor, animação ou partícula no elemento, exibidos desde o início ou por proximidade) ou instrução, dica ou fala que cita o elemento e informa onde ele está ou qual valor deve ser lido dele; a instrução que só nomeia a categoria do que procurar (como \"procure pistas\") não sinaliza o elemento, e o realce exibido só depois de o jogador apontar o cursor para o elemento ou tocá-lo não é sinalização"
