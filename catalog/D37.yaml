id: D37
categoria: resolucao_de_problemas
diretriz: "O jogo, suas missões e mini jogos devem apresentar a situação-problema ao jogador de maneira explícita"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D37.1
    nivel: A
    enunciado: "A abertura de cada missão e de cada minijogo apresenta a situação-problema ao jogador, em texto ou fala, declarando o estado inicial e o objetivo antes de o jogador poder executar a primeira ação do objetivo"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: alta
      texto: "Para Vigotski a atividade humana é mediada por signos, e a palavra, escrita ou falada, organiza a atenção voluntária e a intenção do sujeito antes da ação. Uma unidade que começa sem declarar o estado inicial e o objetivo leva o jogador a agir por tentativa, sem saber que problema deve resolver; declará-los em texto ou fala é a mediação mínima que permite planejar a ação. O critério trata só da apresentação, e não de a unidade ser uma situação-problema (D01). Escrever ou gravar a abertura de cada unidade é decisão de projeto de baixo custo; viabilidade alta."
    evidencia:
      codigo:
        procedimento: "Listar as missões e minijogos e, em cada uma, localizar o texto, a legenda ou a fala exibidos antes de a primeira ação do objetivo poder ser executada (scripts de abertura, caixas de diálogo de início, painéis de missão). Verificar se esse trecho declara o estado inicial e o objetivo da unidade e se o objetivo só é declarado depois de uma ação do jogador. Regra de desempate: se as fontes divergirem sobre uma unidade, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre a abertura da unidade (inclui fala em arquivo de áudio sem transcrição) conta como sem código para essa unidade, e GDD que não descreve a abertura da unidade conta como sem GDD para essa unidade; o vídeo não depende de escolha do jogador gravado, porque a abertura é exibida antes da primeira ação, e a unidade cuja abertura não foi gravada não é avaliada no vídeo"
        indicadores:
          - "todas as missões e minijogos foram listados, cada um com o trecho de código ou o recurso que exibe a abertura (mínimo 1 unidade, pois o jogo sem divisão em missões conta como uma única missão)"
          - "em cada unidade listada existe abertura em texto ou fala, exibida antes de o jogador poder executar a primeira ação do objetivo"
          - "em cada unidade listada a abertura declara o estado inicial e o objetivo, e não se limita a título, instrução de controles ou cena sem texto nem fala"
          - "se ao menos uma unidade atende aos itens anteriores e ao menos outra não, anotar (indica o estado parcial)"
      documentacao:
        procedimento: "Verificar no GDD, roteiro ou documento equivalente, para cada missão e minijogo, o texto ou a fala de abertura e o que ele declara. Regra de desempate: se as fontes divergirem sobre uma unidade, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre a abertura da unidade (inclui fala em arquivo de áudio sem transcrição) conta como sem código para essa unidade, e GDD que não descreve a abertura da unidade conta como sem GDD para essa unidade; o vídeo não depende de escolha do jogador gravado, porque a abertura é exibida antes da primeira ação, e a unidade cuja abertura não foi gravada não é avaliada no vídeo"
        indicadores:
          - "o GDD lista as missões e minijogos e, em cada uma, descreve o texto ou a fala de abertura (mínimo 1 unidade)"
          - "o GDD descreve que a abertura declara o estado inicial e o objetivo da unidade antes da primeira ação do objetivo"
          - "se o GDD descreve abertura que declara estado inicial e objetivo em ao menos uma unidade e em ao menos outra não, anotar (indica o estado parcial)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD: a ausência de abertura no vídeo não prova que o jogo não a tem, e a unidade cuja abertura não foi gravada não é avaliada. Registrar o início de cada missão e minijogo gravado desde o começo, o texto ou a fala exibido antes da primeira ação do objetivo (transcrito) e o instante da primeira ação. Regra de desempate: se as fontes divergirem sobre uma unidade, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre a abertura da unidade (inclui fala em arquivo de áudio sem transcrição) conta como sem código para essa unidade, e GDD que não descreve a abertura da unidade conta como sem GDD para essa unidade; o vídeo não depende de escolha do jogador gravado, porque a abertura é exibida antes da primeira ação, e a unidade cuja abertura não foi gravada não é avaliada no vídeo"
        indicadores:
          - "todas as missões e minijogos com abertura gravada inteira foram registrados, cada um com o texto ou a fala de abertura transcrito (mínimo 0 unidades)"
          - "em cada unidade registrada, o texto ou a fala exibido antes da primeira ação do objetivo declara o estado inicial e o objetivo"
          - "as unidades registradas cuja abertura não declara estado inicial e objetivo foram anotadas (indica o estado parcial quando ao menos uma unidade atende)"
    escala:
      atendido: "Existe ao menos uma unidade avaliada e todas as unidades avaliadas apresentam a situação-problema na abertura, em texto ou fala, nos termos do enunciado e das definições"
      parcial: "Ao menos uma unidade avaliada apresenta a situação-problema na abertura, em texto ou fala, nos termos do enunciado e das definições, e ao menos outra unidade avaliada não apresenta"
      nao_atendido: "Nenhuma unidade avaliada apresenta a situação-problema na abertura, em texto ou fala, nos termos do enunciado e das definições, ou não existe unidade avaliada"
    depende_de: []
    definicoes:
      glossario: [missao, minijogo, situacao_problema, documentacao_equivalente]
      locais:
        "unidade": "cada missão ou minijogo"
        "abertura da unidade": "o trecho de texto, fala ou legenda exibido antes de o jogador poder executar a primeira ação do objetivo da unidade; a abertura apresenta a situação-problema da unidade quando declara, em texto ou fala, o estado inicial (o que há ou ocorre no ponto de partida da unidade) e o objetivo (o que o jogador deve alcançar ou resolver); não contam como declaração o título ou o nome da unidade sozinho, a instrução de controles ou de interface sozinha (teclas, botões), a ilustração, o ícone ou a cena sem texto nem fala, e o objetivo declarado só depois de o jogador executar uma ação do objetivo"
        "fala": "áudio cujo conteúdo é determinável por transcrição, legenda, roteiro, GDD ou audição no vídeo, e o áudio de conteúdo não determinável conta como sem declaração"
        "unidade avaliada": "a unidade sobre a qual há evidência: no código e no GDD, toda missão e todo minijogo existente ou descrito; no vídeo, só a unidade cuja abertura foi gravada inteira, e a abertura que o jogador gravado pulou antes de ela ser exibida inteira não é avaliada no vídeo"
        "escopo": "este critério avalia só se o estado inicial e o objetivo são declarados antes da ação: o número de ações possíveis e a decisão do jogador, que a abertura não declara, e portanto se a unidade é de fato uma situação-problema, são tratados em D01, e a abertura com dispositivo de curiosidade é tratada em D28"
