id: D04
categoria: interacao
diretriz: "O jogador deve interagir com os objetos dos cenários"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D04.1
    nivel: A
    enunciado: "Ao menos um objeto de cada cenário responde à interação do jogador com mudança de estado ou informação que se relaciona a um objetivo de aprendizagem listado no GDD (ou documento equivalente)"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: alta
      texto: "Para Vigotski o conhecimento é construído na atividade sobre objetos e instrumentos, e interagir com o ambiente é a forma pela qual o jogador exerce essa atividade. Um cenário apenas contemplativo reduz o jogador a espectador, e um objeto que responde sem relação com o conteúdo mantém a interação fora da atividade de aprender. Programar resposta a clique, toque ou colisão é recurso básico de qualquer motor de jogo."
    evidencia:
      codigo:
        procedimento: "Listar os objetos de cada cenário que têm manipulador de evento (handler) de interação (clique, toque, colisão, uso de item) e o efeito de cada manipulador, e comparar o efeito com os objetivos de aprendizagem do GDD. Considerar que o efeito se relaciona a um objetivo quando a informação exibida ou o novo estado enuncia, exemplifica ou testa um conceito listado, ou é dado necessário para resolver um desafio ligado a ele"
        indicadores:
          - "cada cenário tem ao menos um objeto com manipulador de evento de interação"
          - "o efeito do manipulador é mudança de estado ou exibição de informação que se relaciona a um objetivo de aprendizagem do GDD"
      documentacao: null
      video:
        procedimento: "Percorrer cada cenário observado registrando os objetos com os quais o jogador interage e a resposta obtida, e comparar a resposta com os objetivos de aprendizagem do GDD. Considerar que a resposta se relaciona a um objetivo quando a informação exibida ou o novo estado enuncia, exemplifica ou testa um conceito listado, ou é dado necessário para resolver um desafio ligado a ele"
        indicadores:
          - "ao menos um objeto interagido por cenário"
          - "o objeto muda de estado ou exibe informação que se relaciona a um objetivo de aprendizagem do GDD"
    escala:
      atendido: "Todos os cenários têm ao menos um objeto que responde à interação com mudança de estado ou informação que se relaciona a um objetivo de aprendizagem do GDD"
      parcial: "Ao menos um cenário tem objeto que responde nesse sentido e ao menos outro cenário não tem"
      nao_atendido: "Nenhum cenário tem objeto que responda à interação do jogador com mudança de estado ou informação que se relaciona a um objetivo de aprendizagem do GDD"
    recomendacao:
      documentacao: null
      design: "Definir, para cada cenário, ao menos um objeto que responda à interação do jogador com mudança de estado ou informação que enuncie, exemplifique ou teste um objetivo de aprendizagem do GDD, ou que seja dado necessário para resolver um desafio ligado a ele"
      codigo: "Acrescentar, em cada cenário, ao menos um objeto com manipulador de evento (handler) de interação (clique, toque, colisão ou uso de item). Fazer o manipulador mudar o estado do objeto ou exibir informação que se relacione a um objetivo de aprendizagem do GDD"
    depende_de: []
    definicoes:
      glossario: [missao, minijogo, desafio, cenario_jogavel, caminho_obrigatorio, documentacao_equivalente, objetivo_de_aprendizagem]
