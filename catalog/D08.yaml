id: D08
categoria: interacao
diretriz: "O jogador deve trocar informações com os mecanismos do jogo"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D08.1
    nivel: A
    enunciado: "Em ao menos uma situação do jogo, um personagem não jogável ou mecanismo entrega informação ao jogador e em seguida recebe dele uma resposta, escolha ou item que altera o que o jogo exibe a seguir"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: alta
      texto: "Em Vigotski, a interação com o meio é mediada por signos e instrumentos, e uma troca de mão dupla com o jogo faz do sistema um interlocutor, e não um painel de exibição. Se o jogo só emite informação, o jogador permanece receptor. Uma situação com troca de mão dupla já estabelece essa relação, e diálogos com escolhas e entrega de itens são mecânicas comuns e de baixo custo."
    evidencia:
      codigo:
        procedimento: "Localizar diálogos, quadros de pergunta e mecanismos de entrega ou recebimento de itens e verificar se a resposta do jogador é registrada e muda o estado ou o conteúdo seguinte; confirmar no código que duas entradas diferentes levam a saídas diferentes"
        indicadores:
          - "o mecanismo emite informação ao jogador"
          - "a entrada do jogador (escolha, resposta, item) é lida pelo mecanismo"
          - "a entrada do jogador altera a próxima saída do mecanismo ou o estado do jogo, com ao menos duas entradas possíveis levando a saídas diferentes"
      documentacao: null
      video:
        procedimento: "Registrar uma troca entre o jogador e personagem ou mecanismo em duas tentativas (ou duas gravações) com entradas diferentes, anotando a informação recebida, a entrada do jogador e o que o jogo exibe depois em cada tentativa"
        indicadores:
          - "uma troca completa observada (informação recebida, entrada do jogador, resposta do jogo)"
          - "a mesma troca repetida com outra entrada do jogador"
          - "o que o jogo exibe depois difere entre as duas tentativas"
    escala:
      atendido: "Em ao menos uma situação, o mecanismo entrega informação, recebe a entrada do jogador e altera o que o jogo exibe a seguir conforme essa entrada"
      parcial: "Em ao menos uma situação, o mecanismo recebe a entrada do jogador, mas o que o jogo exibe a seguir é o mesmo para qualquer entrada"
      nao_atendido: "Os mecanismos apenas emitem informação ao jogador, sem receber entrada dele"
    depende_de: []
