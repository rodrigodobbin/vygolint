id: D02
categoria: interacao
diretriz: "Avaliar os conteúdos ensinados no jogo de forma a transcender o contexto que eles foram abordados, possibilitando a transposição dos conceitos para resolução de outras situações-problema"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D02.1
    nivel: A
    enunciado: "Cada conceito listado como objetivo de aprendizagem no GDD (ou documento equivalente) é cobrado ao menos uma vez em uma missão ou cenário com estrutura de problema diferente daquela em que foi introduzido"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: media
      texto: "Em Vigotski, conceitos científicos se consolidam quando o sujeito os generaliza e os usa de modo consciente em situações novas, e não quando os repete no contexto de origem. Avaliar apenas na situação de introdução mede memorização do contexto, não domínio do conceito. Exige planejar variações de situação para cada conteúdo, o que aumenta o esforço de conteúdo e de design; viabilidade média."
    evidencia:
      codigo: null
      documentacao:
        procedimento: "Extrair do GDD (ou documento equivalente) a lista de objetivos de aprendizagem e mapear, para cada conceito, a missão ou cenário de introdução e as missões ou cenários em que ele é cobrado. Se o documento não lista objetivos de aprendizagem, registrar a ausência e classificar o critério como nao_atendido. Considerar estrutura de problema diferente quando mudam o objetivo da missão ou o conjunto de objetos ou dados que o jogador manipula; mudar apenas o mapa ou a aparência do cenário não conta"
        indicadores:
          - "tabela ou lista associando cada conceito do GDD, a missão ou cenário de introdução e a missão ou cenário de avaliação"
          - "para cada conceito, a missão de avaliação tem objetivo ou conjunto de objetos ou dados manipulados diferente do da missão de introdução"
      video:
        procedimento: "Para cada conceito listado no GDD, registrar a missão e o momento em que ele é introduzido e a missão em que o mesmo conceito é cobrado depois, comparando o objetivo e os objetos manipulados nas duas"
        indicadores:
          - "o conceito aparece em duas missões ou cenários diferentes"
          - "o desafio da segunda missão só se resolve aplicando o conceito apresentado na primeira e tem objetivo ou objetos manipulados diferentes"
    escala:
      atendido: "Todos os conceitos listados como objetivo de aprendizagem são cobrados ao menos uma vez em missão ou cenário com estrutura de problema diferente da de introdução"
      parcial: "Ao menos um conceito listado é cobrado em missão ou cenário com estrutura de problema diferente da de introdução, e ao menos outro conceito listado é cobrado só na situação em que foi apresentado"
      nao_atendido: "Nenhum conceito listado é cobrado fora da situação em que foi introduzido, ou o GDD não lista objetivos de aprendizagem"
    depende_de: []
