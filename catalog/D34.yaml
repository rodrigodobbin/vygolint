id: D34
categoria: personalizacao
diretriz: Os desafios devem ser personalizados de acordo com as ações do jogador
fonte: Carvalho (2020), Quadro 3
modalidade: deve
aplicabilidade: null
criterios:
- id: D34.1
  nivel: AAA
  enunciado: 'Em ao menos um desafio, ao menos um parâmetro do desafio posterior é definido por regra que lê uma ação anterior do jogador e produz valores diferentes conforme a ação; Definições: desafio é cada missão ou minijogo; missão é uma atividade com objetivo e condição de conclusão próprios, e o jogo sem divisão em missões conta como uma única missão; ação anterior do jogador é uma escolha ou ação deliberada do jogador, feita antes do desafio posterior, que o jogo guarda (em variável, marcador de estado, inventário ou histórico) e cujo valor identifica qual opção, item, caminho ou modo de agir o jogador usou (escolha de diálogo, objeto ou personagem escolhido, caminho seguido, forma de resolver uma situação); não contam valor que mede o resultado do jogador (pontuação, acertos, erros, tempo, tentativas), tratado em D33, e a seleção direta, por menu, do próprio desafio ou do seu nível de dificuldade; parâmetro do desafio é um valor que define o que o jogador enfrenta no desafio: a dificuldade (nível, velocidade, tolerância a erro), a quantidade (de itens, de perguntas, de tentativas permitidas), o tempo disponível, a meta de conclusão ou o conteúdo (qual pergunta, objetivo ou situação é apresentado); não contam texto de feedback, dica ou orientação (tratados em D17 e D18), aparência (cor, avatar, tema visual) e pontuação ou recompensa concedida; desafio posterior é o desafio, a rodada ou a nova tentativa que começa depois da ação anterior do jogador, no mesmo desafio ou em outro; o desafio é personalizado pelas ações do jogador quando o valor de um parâmetro do desafio posterior é definido por regra que lê o valor da ação anterior do jogador e produz ao menos dois valores diferentes do parâmetro para ao menos dois valores diferentes da ação; mudança só do enredo, da aparência ou do texto de feedback não é personalização do desafio; se a regra lê acerto, erro, tempo, pontuação ou número de tentativas, a personalização é de desempenho (D33); se lê qual opção, item, caminho ou modo de agir foi usado, é de ação (D34); regra que lê os dois conta nas duas diretrizes; a mudança só do texto de feedback é tratada em D18'
  nivel_justificativa:
    essencialidade: baixa
    viabilidade: baixa
    texto: Em Vigotski o sujeito aprende agindo sobre o meio por meio de instrumentos e signos; quando o desafio seguinte reflete o que o jogador escolheu fazer, e não só o resultado que obteve, a escolha passa a ter consequência na atividade. O critério exige que a regra leia a ação (qual opção, item, caminho ou modo de agir), e distingue-se de D33 (a regra lê o resultado), de D18 (só a mensagem muda) e de D03 (escolha direta da atividade); basta um desafio pelo mesmo motivo de D33, a existência da regra. A essencialidade é baixa porque as ações do jogador já condicionam o progresso (D10) e as escolhas de ordem (D03), e a viabilidade é baixa porque exige guardar o estado das escolhas e produzir variantes de desafio para cada uma; AAA.
  evidencia:
    codigo:
      procedimento: 'Localizar as variáveis, marcadores de estado e históricos que guardam escolhas e ações do jogador (escolha de diálogo, objeto ou personagem escolhido, caminho seguido) e as funções que definem parâmetros de desafio, e verificar se algum parâmetro é atribuído por regra que lê o valor guardado, com ao menos dois ramos ou valores. Definições: desafio é cada missão ou minijogo; missão é uma atividade com objetivo e condição de conclusão próprios, e o jogo sem divisão em missões conta como uma única missão; ação anterior do jogador é uma escolha ou ação deliberada do jogador, feita antes do desafio posterior, que o jogo guarda (em variável, marcador de estado, inventário ou histórico) e cujo valor identifica qual opção, item, caminho ou modo de agir o jogador usou (escolha de diálogo, objeto ou personagem escolhido, caminho seguido, forma de resolver uma situação); não contam valor que mede o resultado do jogador (pontuação, acertos, erros, tempo, tentativas), tratado em D33, e a seleção direta, por menu, do próprio desafio ou do seu nível de dificuldade; parâmetro do desafio é um valor que define o que o jogador enfrenta no desafio: a dificuldade (nível, velocidade, tolerância a erro), a quantidade (de itens, de perguntas, de tentativas permitidas), o tempo disponível, a meta de conclusão ou o conteúdo (qual pergunta, objetivo ou situação é apresentado); não contam texto de feedback, dica ou orientação (tratados em D17 e D18), aparência (cor, avatar, tema visual) e pontuação ou recompensa concedida; desafio posterior é o desafio, a rodada ou a nova tentativa que começa depois da ação anterior do jogador, no mesmo desafio ou em outro; o desafio é personalizado pelas ações do jogador quando o valor de um parâmetro do desafio posterior é definido por regra que lê o valor da ação anterior do jogador e produz ao menos dois valores diferentes do parâmetro para ao menos dois valores diferentes da ação; mudança só do enredo, da aparência ou do texto de feedback não é personalização do desafio; se a regra lê acerto, erro, tempo, pontuação ou número de tentativas, a personalização é de desempenho (D33); se lê qual opção, item, caminho ou modo de agir foi usado, é de ação (D34); regra que lê os dois conta nas duas diretrizes; a mudança só do texto de feedback é tratada em D18. Regra de desempate: se as fontes divergirem sobre um desafio, vale o código; sem código, o GDD; sem ambos, o vídeo, que só confirma o estado atendido por par de ocorrências comparáveis, e sem código, GDD nem confirmação no vídeo o grau é não atendido; código que existe mas não traz dado sobre um desafio conta como sem código para esse desafio, e GDD que não descreve um desafio conta como sem GDD para esse desafio'
      indicadores:
      - todas as ações anteriores guardadas foram listadas, cada uma com o trecho de código que a guarda (mínimo 0 ações)
      - existe, em ao menos um desafio, um parâmetro do desafio posterior atribuído por regra que lê uma ação anterior listada
      - a regra produz ao menos dois valores diferentes do parâmetro para ao menos dois valores diferentes da ação
      - se existe ação anterior guardada e nenhuma regra de parâmetro a lê (uso só para enredo, aparência ou texto de feedback), anotar (indica o estado parcial)
    documentacao:
      procedimento: 'Verificar no GDD ou documento equivalente as escolhas e ações do jogador que o jogo guarda e as regras que ligam cada uma a um parâmetro de desafio posterior, isto é, qual parâmetro muda, para qual valor da ação e para qual valor do parâmetro. Definições: desafio é cada missão ou minijogo; missão é uma atividade com objetivo e condição de conclusão próprios, e o jogo sem divisão em missões conta como uma única missão; ação anterior do jogador é uma escolha ou ação deliberada do jogador, feita antes do desafio posterior, que o jogo guarda (em variável, marcador de estado, inventário ou histórico) e cujo valor identifica qual opção, item, caminho ou modo de agir o jogador usou (escolha de diálogo, objeto ou personagem escolhido, caminho seguido, forma de resolver uma situação); não contam valor que mede o resultado do jogador (pontuação, acertos, erros, tempo, tentativas), tratado em D33, e a seleção direta, por menu, do próprio desafio ou do seu nível de dificuldade; parâmetro do desafio é um valor que define o que o jogador enfrenta no desafio: a dificuldade (nível, velocidade, tolerância a erro), a quantidade (de itens, de perguntas, de tentativas permitidas), o tempo disponível, a meta de conclusão ou o conteúdo (qual pergunta, objetivo ou situação é apresentado); não contam texto de feedback, dica ou orientação (tratados em D17 e D18), aparência (cor, avatar, tema visual) e pontuação ou recompensa concedida; desafio posterior é o desafio, a rodada ou a nova tentativa que começa depois da ação anterior do jogador, no mesmo desafio ou em outro; o desafio é personalizado pelas ações do jogador quando o valor de um parâmetro do desafio posterior é definido por regra que lê o valor da ação anterior do jogador e produz ao menos dois valores diferentes do parâmetro para ao menos dois valores diferentes da ação; mudança só do enredo, da aparência ou do texto de feedback não é personalização do desafio; se a regra lê acerto, erro, tempo, pontuação ou número de tentativas, a personalização é de desempenho (D33); se lê qual opção, item, caminho ou modo de agir foi usado, é de ação (D34); regra que lê os dois conta nas duas diretrizes; a mudança só do texto de feedback é tratada em D18. Regra de desempate: se as fontes divergirem sobre um desafio, vale o código; sem código, o GDD; sem ambos, o vídeo, que só confirma o estado atendido por par de ocorrências comparáveis, e sem código, GDD nem confirmação no vídeo o grau é não atendido; código que existe mas não traz dado sobre um desafio conta como sem código para esse desafio, e GDD que não descreve um desafio conta como sem GDD para esse desafio'
      indicadores:
      - o GDD lista as escolhas e ações do jogador que o jogo guarda (mínimo 0 ações)
      - o GDD descreve, em ao menos um desafio, um parâmetro do desafio posterior e a regra que o define a partir de uma ação anterior, com ao menos dois valores do parâmetro para dois valores da ação
      - se o GDD descreve ação guardada e nenhuma regra de parâmetro que a use, anotar (indica o estado parcial)
    video:
      procedimento: 'O vídeo só confirma o estado atendido, por par de ocorrências comparáveis, e os estados parcial e não atendido são decididos por código e GDD: ele mostra o que o jogador gravado fez, e uma única gravação não mostra que outra ação levaria a outro valor do parâmetro. Registrar, no mesmo ponto de decisão, duas ocorrências com ações anteriores diferentes (na mesma gravação ou em gravações distintas) e o valor observável do parâmetro no desafio posterior de cada uma. Definições: desafio é cada missão ou minijogo; missão é uma atividade com objetivo e condição de conclusão próprios, e o jogo sem divisão em missões conta como uma única missão; ação anterior do jogador é uma escolha ou ação deliberada do jogador, feita antes do desafio posterior, que o jogo guarda (em variável, marcador de estado, inventário ou histórico) e cujo valor identifica qual opção, item, caminho ou modo de agir o jogador usou (escolha de diálogo, objeto ou personagem escolhido, caminho seguido, forma de resolver uma situação); não contam valor que mede o resultado do jogador (pontuação, acertos, erros, tempo, tentativas), tratado em D33, e a seleção direta, por menu, do próprio desafio ou do seu nível de dificuldade; parâmetro do desafio é um valor que define o que o jogador enfrenta no desafio: a dificuldade (nível, velocidade, tolerância a erro), a quantidade (de itens, de perguntas, de tentativas permitidas), o tempo disponível, a meta de conclusão ou o conteúdo (qual pergunta, objetivo ou situação é apresentado); não contam texto de feedback, dica ou orientação (tratados em D17 e D18), aparência (cor, avatar, tema visual) e pontuação ou recompensa concedida; desafio posterior é o desafio, a rodada ou a nova tentativa que começa depois da ação anterior do jogador, no mesmo desafio ou em outro; o desafio é personalizado pelas ações do jogador quando o valor de um parâmetro do desafio posterior é definido por regra que lê o valor da ação anterior do jogador e produz ao menos dois valores diferentes do parâmetro para ao menos dois valores diferentes da ação; mudança só do enredo, da aparência ou do texto de feedback não é personalização do desafio; se a regra lê acerto, erro, tempo, pontuação ou número de tentativas, a personalização é de desempenho (D33); se lê qual opção, item, caminho ou modo de agir foi usado, é de ação (D34); regra que lê os dois conta nas duas diretrizes; a mudança só do texto de feedback é tratada em D18. Regra de desempate: se as fontes divergirem sobre um desafio, vale o código; sem código, o GDD; sem ambos, o vídeo, que só confirma o estado atendido por par de ocorrências comparáveis, e sem código, GDD nem confirmação no vídeo o grau é não atendido; código que existe mas não traz dado sobre um desafio conta como sem código para esse desafio, e GDD que não descreve um desafio conta como sem GDD para esse desafio'
      indicadores:
      - cada par de ocorrências do mesmo ponto de decisão com ações anteriores diferentes foi registrado, com timestamp, ação anterior e valor observável do parâmetro do desafio posterior (mínimo 0 pares)
      - em ao menos um par registrado, o valor do parâmetro do desafio posterior difere entre as duas ocorrências; a diferença confirma o estado atendido, e a ausência de diferença ou de par não prova que o jogo não personaliza
  escala:
    atendido: Em ao menos um desafio, ao menos um parâmetro do desafio posterior é definido por regra que lê uma ação anterior do jogador e produz valores diferentes conforme a ação, nos termos do enunciado
    parcial: 'O jogo guarda ao menos uma ação anterior do jogador, nos termos do enunciado, mas nenhum parâmetro de desafio posterior é definido por regra que a leia (inclui ação que só altera o enredo, a aparência ou o texto de feedback). Definições: ação anterior do jogador é uma escolha ou ação deliberada do jogador, feita antes do desafio posterior, que o jogo guarda (em variável, marcador de estado, inventário ou histórico) e cujo valor identifica qual opção, item, caminho ou modo de agir o jogador usou (escolha de diálogo, objeto ou personagem escolhido, caminho seguido, forma de resolver uma situação); não contam valor que mede o resultado do jogador (pontuação, acertos, erros, tempo, tentativas), tratado em D33, e a seleção direta, por menu, do próprio desafio ou do seu nível de dificuldade; parâmetro do desafio é um valor que define o que o jogador enfrenta no desafio: a dificuldade (nível, velocidade, tolerância a erro), a quantidade (de itens, de perguntas, de tentativas permitidas), o tempo disponível, a meta de conclusão ou o conteúdo (qual pergunta, objetivo ou situação é apresentado); não contam texto de feedback, dica ou orientação (tratados em D17 e D18), aparência (cor, avatar, tema visual) e pontuação ou recompensa concedida; desafio posterior é o desafio, a rodada ou a nova tentativa que começa depois da ação anterior do jogador, no mesmo desafio ou em outro'
    nao_atendido: 'O jogo não guarda ação anterior do jogador, nos termos do enunciado (inclui jogo que não guarda escolhas nem ações do jogador, e jogo que guarda só métrica de desempenho ou só a seleção direta do desafio ou do nível). Definições: ação anterior do jogador é uma escolha ou ação deliberada do jogador, feita antes do desafio posterior, que o jogo guarda (em variável, marcador de estado, inventário ou histórico) e cujo valor identifica qual opção, item, caminho ou modo de agir o jogador usou (escolha de diálogo, objeto ou personagem escolhido, caminho seguido, forma de resolver uma situação); não contam valor que mede o resultado do jogador (pontuação, acertos, erros, tempo, tentativas), tratado em D33, e a seleção direta, por menu, do próprio desafio ou do seu nível de dificuldade; o desafio é personalizado pelas ações do jogador quando o valor de um parâmetro do desafio posterior é definido por regra que lê o valor da ação anterior do jogador e produz ao menos dois valores diferentes do parâmetro para ao menos dois valores diferentes da ação; mudança só do enredo, da aparência ou do texto de feedback não é personalização do desafio'
