id: D32
categoria: realismo
diretriz: "O jogo deve ter objetos do cotidiano com os quais o jogador pode se familiarizar"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D32.1
    nivel: AA
    enunciado: "Ao menos um objeto interativo do jogo é item do cotidiano do público-alvo descrito no GDD ou documento equivalente"
    nivel_justificativa:
      essencialidade: media
      viabilidade: alta
      texto: "Para Vigotski os conceitos cotidianos se formam na experiência do sujeito em seu contexto sócio-histórico e são a base sobre a qual os conceitos científicos se desenvolvem; objetos que o jogador já conhece do cotidiano e com os quais age no jogo ligam a atividade a essa experiência. A familiarização vem da ação sobre o objeto, por isso o objeto só visto no cenário não atende; um objeto interativo é o mínimo que permite essa ação, e a diretriz não fixa quantidade maior, de modo que um limite numérico seria arbitrário. A essencialidade é média porque a ligação com o cotidiano também se dá pela premissa (D30) e pelo conteúdo em situação (D31). Escolher objetos comuns para a interação é decisão de projeto de baixo custo; viabilidade alta."
    evidencia:
      codigo:
        procedimento: "Localizar os objetos do jogo sobre os quais há manipulador de evento (handler) de ação do jogador (pegar, usar, abrir, mover, combinar, selecionar) e a resposta do jogo, listar o nome e a função de cada um e compará-los com a lista de itens do cotidiano que o GDD atribui ao público-alvo; listar também os objetos de cenário sem manipulador de evento de ação do jogador (nome e função de cada um), para que o estado parcial possa ser avaliado. Regra de desempate: a classificação de um objeto como item do cotidiano do público-alvo vem só do GDD ou documento equivalente; para decidir se o objeto existe no jogo e é interativo, se as fontes divergirem vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um objeto conta como sem código para esse objeto, e GDD que não descreve um objeto conta como sem GDD para esse objeto"
        indicadores:
          - "todos os objetos interativos foram listados, cada um com o manipulador de evento da ação do jogador e a resposta do jogo (mínimo 0 objetos)"
          - "todos os objetos de cenário sem manipulador de evento de ação do jogador foram listados, cada um com nome e função (mínimo 0 objetos)"
          - "ao menos um objeto interativo listado é representado com o nome e a função que tem fora do jogo e consta no GDD como item do cotidiano do público-alvo"
          - "se ao menos um objeto de cenário listado sem manipulador de evento é item do cotidiano do público-alvo, nos termos do enunciado e das definições, e nenhum objeto interativo é item do cotidiano, anotar (indica o estado parcial)"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente a descrição do público-alvo, a lista de itens do cotidiano dele e os objetos do jogo com a ação que o jogador executa sobre cada um. Regra de desempate: a classificação de um objeto como item do cotidiano do público-alvo vem só do GDD ou documento equivalente; para decidir se o objeto existe no jogo e é interativo, se as fontes divergirem vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um objeto conta como sem código para esse objeto, e GDD que não descreve um objeto conta como sem GDD para esse objeto"
        indicadores:
          - "o GDD descreve o público-alvo (faixa etária, série ou perfil) e cita os itens do cotidiano dele, ou os objetos de um local da rotina atribuído a ele"
          - "ao menos um objeto do jogo descrito no GDD é item do cotidiano do público-alvo e o GDD descreve a ação que o jogador executa sobre ele e a resposta do jogo"
          - "se o GDD descreve item do cotidiano do público-alvo só como elemento visual do cenário e nenhum como objeto interativo, anotar (indica o estado parcial)"
      video:
        procedimento: "O vídeo só confirma o código ou o GDD: mostra o que aparece na gravação, e a ausência do objeto no vídeo não prova que o jogo não o tem. Registrar, com timestamp, os objetos sobre os quais o jogador executa ação e os objetos vistos no cenário sem ação, com o nome exibido pelo jogo e a resposta do jogo à ação. Regra de desempate: a classificação de um objeto como item do cotidiano do público-alvo vem só do GDD ou documento equivalente; para decidir se o objeto existe no jogo e é interativo, se as fontes divergirem vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um objeto conta como sem código para esse objeto, e GDD que não descreve um objeto conta como sem GDD para esse objeto"
        indicadores:
          - "cada objeto sobre o qual o jogador executa ação foi registrado com timestamp, nome exibido, ação executada e resposta do jogo (mínimo 0 objetos)"
          - "ao menos um objeto registrado é interativo, é representado com o nome e a função que tem fora do jogo e consta no GDD como item do cotidiano do público-alvo; o vídeo sem GDD não classifica o objeto como item do cotidiano do público-alvo"
          - "os itens do cotidiano do público-alvo vistos só como elemento visual do cenário, sem ação do jogador, foram anotados (indica o estado parcial quando nenhum objeto interativo é item do cotidiano)"
    escala:
      atendido: "Ao menos um objeto interativo do jogo é item do cotidiano do público-alvo descrito no GDD ou documento equivalente, nos termos do enunciado e das definições"
      parcial: "O jogo representa ao menos um item do cotidiano do público-alvo, nos termos do enunciado e das definições, mas nenhum desses itens é objeto interativo (aparecem só como elemento visual do cenário)"
      nao_atendido: "O jogo não representa item do cotidiano do público-alvo, nos termos do enunciado e das definições (inclui objetos só fantásticos ou de interface, objetos de ambiente especializado não atribuído à rotina do público-alvo e GDD ou documento equivalente sem descrição do público-alvo)"
    depende_de: []
    definicoes:
      glossario: [documentacao_equivalente]
      locais:
        "público-alvo": "o grupo de jogadores que o GDD ou documento equivalente descreve (faixa etária, série ou perfil), e sem essa descrição nenhum objeto pode ser classificado como item do cotidiano do público-alvo"
        "item do cotidiano do público-alvo": "um objeto físico que o GDD ou documento equivalente cita pelo nome entre os objetos da rotina do público-alvo, ou entre os objetos de um local da rotina que o GDD atribui ao público-alvo (casa, escola, bairro, transporte), e que o jogo representa com o nome e a função que o objeto tem fora do jogo; não contam objeto fantástico ou inventado, objeto representado com função diferente da que tem fora do jogo, ícone ou elemento de interface (botão, menu, barra) e objeto de ambiente especializado que o GDD não atribui à rotina do público-alvo"
        "objeto interativo": "um objeto do jogo sobre o qual o jogador executa ao menos uma ação (pegar, usar, abrir, mover, combinar ou selecionar) e ao qual o jogo responde com mudança de estado ou com mensagem; objeto que o jogador apenas vê, sem ação possível, é elemento visual do cenário e não é objeto interativo"
        "cenário": "neste critério, o ambiente visual em que os objetos aparecem (a ambientação), e não o cenário jogável de D29"
        "escopo": "esta diretriz avalia só os objetos: a premissa com referente real é tratada em D30 e o conteúdo em situações do jogo é tratado em D31"
      termos_comuns:
        "cenário": "cenário tem neste critério o sentido do local «cenário» (ambientação), e não o de cenário jogável (D29)"
