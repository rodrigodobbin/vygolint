id: D36
categoria: organizacao
diretriz: "O jogador deve organizar informações"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D36.1
    nivel: A
    enunciado: "O jogador executa ao menos uma operação de organização sobre informações, e o estado organizado persiste e é consultado depois"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: media
      texto: "Em Vigotski, a memória mediada e a atenção voluntária, funções psicológicas superiores, se apoiam em signos e instrumentos externos, e organizar informações em categorias, grupos ou ordem é operar com esses signos; os conceitos científicos, por sua vez, formam-se como parte de um sistema de relações, e não como itens soltos. Quando o jogo preenche sozinho o inventário ou o diário, o sistema é do jogo e o jogador apenas o consulta; este critério exige que a estrutura seja escolhida pelo jogador e persista para ser consultada depois, e se distingue de D11, que trata só de coletar. Viabilidade média: exige interface de escolha, estrutura de dados que persista e uma consulta posterior, o que é mais trabalho que um inventário automático."
    evidencia:
      codigo:
        procedimento: "Localizar as mecânicas de inventário, diário, caderno, mapa, quadro, classificação ou agrupamento e, em cada uma, o trecho de código que grava a categoria, o grupo, a posição, a ordem ou o rótulo. Verificar se esse dado é escolhido pelo jogador entre ao menos duas possibilidades ou definido pelo jogo, se é guardado em estrutura que sobrevive à saída da tela (estado global ou dado de salvamento) ou descartado ao fechá-la, e se há tela, painel ou leitura em missão ou desafio que o exibe ou lê depois, verificando também se a informação organizada é relativa a objetivo de aprendizagem. Regra de desempate: se as fontes divergirem, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre a operação de organização conta como sem código para ela, e GDD que não a descreve conta como sem GDD para ela. Sem código nem GDD, o vídeo decide só pelo que mostra: o grau é atendido quando o vídeo mostra a operação e mostra o estado organizado de novo depois de o jogador sair da tela ou do momento em que operou (o que mostra persistência e consulta posterior), e nao_atendido nos demais casos, anotando que o grau decorre da falta de evidência; o vídeo isolado não estabelece o estado parcial, porque não mostra persistência sem consulta posterior"
        indicadores:
          - "uma ação do jogador grava categoria, grupo, posição, ordem ou rótulo escolhido entre ao menos duas possibilidades para ao menos uma informação relativa a objetivo de aprendizagem do GDD ou documento equivalente, ou marcada no código com esse objetivo (mínimo 0 operações)"
          - "o dado gravado fica em estrutura que sobrevive à saída da tela ou do momento da operação e não é descartado ao fechá-la"
          - "existe tela, painel ou leitura em missão ou desafio que exibe ou lê o estado organizado em momento posterior à operação"
          - "se existe operação e persistência e nenhuma exibição ou leitura posterior, anotar (indica o estado parcial)"
          - "se o jogo decide a posição, o grupo e a ordem sem escolha do jogador, ou descarta o estado ao fechar a tela, anotar (indica o estado nao_atendido)"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente a mecânica de organização: o que o jogador organiza, como (classificar, agrupar, ordenar, posicionar, rotular), quem escolhe a categoria, o grupo, a posição, a ordem ou o rótulo, se o estado organizado fica guardado e onde é consultado depois. Regra de desempate: se as fontes divergirem, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre a operação de organização conta como sem código para ela, e GDD que não a descreve conta como sem GDD para ela. Sem código nem GDD, o vídeo decide só pelo que mostra: o grau é atendido quando o vídeo mostra a operação e mostra o estado organizado de novo depois de o jogador sair da tela ou do momento em que operou (o que mostra persistência e consulta posterior), e nao_atendido nos demais casos, anotando que o grau decorre da falta de evidência; o vídeo isolado não estabelece o estado parcial, porque não mostra persistência sem consulta posterior"
        indicadores:
          - "o GDD descreve ao menos uma operação em que o jogador escolhe categoria, grupo, posição, ordem ou rótulo, entre ao menos duas possibilidades, para informação relativa a objetivo de aprendizagem listado (mínimo 0 operações)"
          - "o GDD descreve que o estado organizado fica guardado depois de o jogador sair da tela ou do momento da operação"
          - "o GDD descreve a tela, o painel ou a missão ou desafio que exibe ou lê o estado organizado depois"
          - "se o GDD descreve operação e persistência sem consulta posterior, anotar (indica o estado parcial)"
          - "se o GDD descreve inventário, diário ou lista preenchidos automaticamente, sem escolha do jogador, anotar (indica o estado nao_atendido)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD: a ausência de operação ou de consulta no vídeo não prova que o jogo não as tem, e o vídeo não decide se a informação é relativa a objetivo de aprendizagem, o que vem do código ou da documentação. Registrar com timestamp cada operação do jogador (o que ele escolhe, entre quais possibilidades) e cada momento posterior em que o estado organizado aparece de novo. Regra de desempate: se as fontes divergirem, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre a operação de organização conta como sem código para ela, e GDD que não a descreve conta como sem GDD para ela. Sem código nem GDD, o vídeo decide só pelo que mostra: o grau é atendido quando o vídeo mostra a operação e mostra o estado organizado de novo depois de o jogador sair da tela ou do momento em que operou (o que mostra persistência e consulta posterior), e nao_atendido nos demais casos, anotando que o grau decorre da falta de evidência; o vídeo isolado não estabelece o estado parcial, porque não mostra persistência sem consulta posterior"
        indicadores:
          - "ao menos um momento em que o jogador escolhe categoria, grupo, posição, ordem ou rótulo para uma informação, entre ao menos duas possibilidades oferecidas pelo jogo (mínimo 0 operações)"
          - "ao menos um momento posterior em que o estado organizado aparece de novo, depois de o jogador sair da tela ou do momento em que operou"
          - "a relação da informação com objetivo de aprendizagem foi verificada no código ou na documentação e não no vídeo"
    escala:
      atendido: "O jogador executa ao menos uma operação de organização, o estado organizado persiste e é consultado depois, nos termos do enunciado"
      parcial: "O jogador executa ao menos uma operação de organização e o estado organizado persiste, mas nenhuma consulta posterior existe, nos termos do enunciado"
      nao_atendido: "O jogador não executa nenhuma operação de organização, ou o estado organizado não persiste, nos termos do enunciado (inclui inventário, diário ou lista preenchidos automaticamente pelo jogo e anotação em texto livre sem estrutura escolhida)"
    depende_de: []
    definicoes:
      glossario: [missao, minijogo, desafio, documentacao_equivalente, objetivo_de_aprendizagem, sessao_de_jogo]
      locais:
        "informação": "um item, dado, texto, imagem ou medida relativo a ao menos um objetivo de aprendizagem listado no GDD ou documento equivalente, coletado pelo jogador ou fornecido pelo jogo; é relativo a um objetivo quando o GDD ou documento equivalente, ou a marcação do item no código (campo, identificador ou etiqueta de objetivo), o associa a esse objetivo"
        "operação de organização": "uma ação do jogador que define, para ao menos uma informação, a categoria, o grupo, a posição, a ordem ou o rótulo com que o jogo a guarda, escolhido pelo jogador entre ao menos duas possibilidades oferecidas pelo jogo (classificar em categorias, agrupar, ordenar, posicionar em mapa, quadro, diário ou inventário, rotular); não contam como operação de organização o preenchimento automático de inventário, diário ou lista em que o jogo decide a posição, o grupo e a ordem (a coleta é tratada em D11), a ordenação aplicada por critério fixo do jogo, mesmo quando acionada por botão do jogador, e o texto livre digitado em campo de anotação sem categoria, grupo, posição ou ordem escolhidos pelo jogador (a produção de texto é tratada em D09)"
        "estado organizado": "o conjunto de categorias, grupos, posições, ordens ou rótulos resultante das operações de organização do jogador; o estado organizado persiste quando o jogo o mantém guardado depois de o jogador sair da tela ou do momento em que operou, até o fim da sessão de jogo ou até o jogador desfazê-lo"
        "consulta posterior": "o jogador abrir ou ver o estado organizado, ou uma missão ou desafio ler esse estado, depois de ter saído da tela ou do momento em que operou"
        "escopo": "este critério avalia a operação do jogador e a persistência e consulta do resultado, e não a coleta da informação, tratada em D11"
