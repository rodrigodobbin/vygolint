id: D28
categoria: ludico
diretriz: "A proposta de narrativa deve despertar a curiosidade"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D28.1
    nivel: AA
    enunciado: "A abertura de cada missão apresenta ao menos um dispositivo cuja resolução só é exibida depois de o jogador executar ao menos uma ação do objetivo da missão; Definições: narrativa é a sequência de eventos, cenas, personagens e diálogos que o jogo apresenta ao jogador; missão é uma unidade do jogo com objetivo e condição de conclusão próprios (fase, capítulo ou nível, quando têm objetivo e condição de conclusão próprios), e o jogo sem divisão em missões conta como uma única missão; abertura da missão é o trecho da narrativa (texto, fala, cena ou legenda) exibido antes de o jogador poder executar a primeira ação do objetivo da missão; dispositivo é um destes elementos presentes na abertura: pergunta explícita (frase interrogativa, dirigida ao jogador ou dita por personagem, sobre eventos, personagens ou mundo da narrativa e que a abertura não responde; enunciado de questão que o jogador deve responder como parte do desafio não conta), evento sem desfecho (evento narrado, como um desaparecimento, uma ameaça ou um problema, cujo desfecho a abertura não mostra) ou informação retida (afirmação, na abertura, de que algo é desconhecido ou está oculto, como um segredo ou uma identidade ainda não revelada); resolução do dispositivo é a resposta, o desfecho ou a revelação, exibida em trecho da narrativa que o jogo libera depois de o jogador executar ao menos uma ação do objetivo da missão, e nunca na abertura"
    nivel_justificativa:
      essencialidade: media
      viabilidade: alta
      texto: "Em Vigotski a situação imaginária define o jogo e cria uma zona de desenvolvimento, e a motivação é função da atividade; a narrativa sustenta esse papel quando deixa em aberto algo que a própria atividade resolve. A diretriz fala em despertar curiosidade, que é reação do jogador e varia entre jogadores, por isso o critério não mede curiosidade: verifica a presença de um dispositivo de projeto (pergunta explícita, evento sem desfecho ou informação retida) que só se resolve ao jogar. A essencialidade é média porque a motivação também vem dos desafios (D29) e das escolhas do jogador (D24, D25); escrever a abertura de cada missão não exige recurso técnico, viabilidade alta."
    evidencia:
      codigo: null
      documentacao:
        procedimento: "Verificar no roteiro da narrativa, no GDD ou em documento equivalente, para cada missão, o texto ou a descrição da abertura e o texto ou a descrição da resolução, anotando em que ponto da missão a resolução é exibida. Definições: narrativa é a sequência de eventos, cenas, personagens e diálogos que o jogo apresenta ao jogador; missão é uma unidade do jogo com objetivo e condição de conclusão próprios (fase, capítulo ou nível, quando têm objetivo e condição de conclusão próprios), e o jogo sem divisão em missões conta como uma única missão; abertura da missão é o trecho da narrativa (texto, fala, cena ou legenda) exibido antes de o jogador poder executar a primeira ação do objetivo da missão; dispositivo é um destes elementos presentes na abertura: pergunta explícita (frase interrogativa, dirigida ao jogador ou dita por personagem, sobre eventos, personagens ou mundo da narrativa e que a abertura não responde; enunciado de questão que o jogador deve responder como parte do desafio não conta), evento sem desfecho (evento narrado, como um desaparecimento, uma ameaça ou um problema, cujo desfecho a abertura não mostra) ou informação retida (afirmação, na abertura, de que algo é desconhecido ou está oculto, como um segredo ou uma identidade ainda não revelada); resolução do dispositivo é a resposta, o desfecho ou a revelação, exibida em trecho da narrativa que o jogo libera depois de o jogador executar ao menos uma ação do objetivo da missão, e nunca na abertura. Regra de desempate: se as fontes divergirem sobre uma missão, vale o GDD; sem GDD, o vídeo; GDD que não descreve a missão conta como sem GDD para essa missão, e o vídeo que mostra a abertura mas não mostra a resolução não confirma o dispositivo"
        indicadores:
          - "o roteiro, GDD ou documento equivalente traz o texto ou a descrição da abertura de cada missão (mínimo 0 missões)"
          - "em cada missão listada, a abertura contém ao menos um dispositivo (pergunta explícita, evento sem desfecho ou informação retida)"
          - "para cada dispositivo, o documento descreve a resolução em trecho que o jogo libera depois de o jogador executar ao menos uma ação do objetivo da missão, e não na abertura; dispositivo resolvido na própria abertura não conta"
          - "se ao menos uma missão tem dispositivo, nos termos da definição, e ao menos outra não tem, anotar (indica o estado parcial)"
      video:
        procedimento: "O vídeo só confirma a evidência do documento: mostra a abertura e a resolução das missões gravadas, mas a ausência de dispositivo no vídeo não prova que o jogo não o tem, e o vídeo que termina antes da resolução não a mostra. Registrar, em cada missão gravada, a abertura (timestamp e texto ou fala), os dispositivos nela presentes e o trecho posterior em que aparece a resolução. Definições: narrativa é a sequência de eventos, cenas, personagens e diálogos que o jogo apresenta ao jogador; missão é uma unidade do jogo com objetivo e condição de conclusão próprios (fase, capítulo ou nível, quando têm objetivo e condição de conclusão próprios), e o jogo sem divisão em missões conta como uma única missão; abertura da missão é o trecho da narrativa (texto, fala, cena ou legenda) exibido antes de o jogador poder executar a primeira ação do objetivo da missão; dispositivo é um destes elementos presentes na abertura: pergunta explícita (frase interrogativa, dirigida ao jogador ou dita por personagem, sobre eventos, personagens ou mundo da narrativa e que a abertura não responde; enunciado de questão que o jogador deve responder como parte do desafio não conta), evento sem desfecho (evento narrado, como um desaparecimento, uma ameaça ou um problema, cujo desfecho a abertura não mostra) ou informação retida (afirmação, na abertura, de que algo é desconhecido ou está oculto, como um segredo ou uma identidade ainda não revelada); resolução do dispositivo é a resposta, o desfecho ou a revelação, exibida em trecho da narrativa que o jogo libera depois de o jogador executar ao menos uma ação do objetivo da missão, e nunca na abertura. Regra de desempate: se as fontes divergirem sobre uma missão, vale o GDD; sem GDD, o vídeo; GDD que não descreve a missão conta como sem GDD para essa missão, e o vídeo que mostra a abertura mas não mostra a resolução não confirma o dispositivo"
        indicadores:
          - "a abertura de cada missão presente no vídeo foi registrada com timestamp e texto ou fala (mínimo 1 missão)"
          - "cada abertura registrada contém ao menos um dispositivo (pergunta explícita, evento sem desfecho ou informação retida)"
          - "a resolução de cada dispositivo não aparece na abertura e aparece em trecho posterior, exibido depois de o jogador executar ao menos uma ação do objetivo da missão; se o vídeo termina antes da resolução, anotar resolução não observada"
    escala:
      atendido: "A abertura de cada missão apresenta ao menos um dispositivo cuja resolução só é exibida depois de o jogador executar ao menos uma ação do objetivo da missão, nos termos do enunciado"
      parcial: "Ao menos uma missão tem abertura com dispositivo cuja resolução só é exibida depois de o jogador executar ao menos uma ação do objetivo, nos termos do enunciado, e ao menos outra missão não tem. Definição: dispositivo é um destes elementos presentes na abertura: pergunta explícita, evento sem desfecho ou informação retida, conforme definidos no enunciado"
      nao_atendido: "Nenhuma missão tem abertura com dispositivo cuja resolução só seja exibida depois de o jogador executar ao menos uma ação do objetivo, nos termos do enunciado (inclui abertura sem pergunta, evento sem desfecho ou informação retida, e dispositivo resolvido na própria abertura). Definição: abertura da missão é o trecho da narrativa (texto, fala, cena ou legenda) exibido antes de o jogador poder executar a primeira ação do objetivo da missão"
    depende_de: []
