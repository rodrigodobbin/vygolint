id: D27
categoria: socializacao
diretriz: "O jogo deve aproximar os jogadores pela colaboração"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D27.1
    nivel: AAA
    enunciado: "Existe ao menos uma missão com objetivo compartilhado cujas ações dos jogadores participantes são interdependentes"
    nivel_justificativa:
      essencialidade: media
      viabilidade: baixa
      texto: "Em Vigotski a zona de desenvolvimento proximal pode ser constituída entre pares: um jogador medeia a ação do outro ao fornecer-lhe informação, recurso ou passagem, o que só ocorre quando a ação de um habilita, libera, fornece ou muda o que o outro pode fazer. D13.1 garante que a conclusão exige a ação de mais de um jogador; D27 acrescenta o objetivo compartilhado e a interdependência das ações, sem os quais a colaboração se reduz à soma de contribuições individuais. O critério restringe a interdependência à possibilidade ou ao tipo de ação do par, e não à quantidade restante de um total comum, porque reduzir esse total não medeia a ação do outro; e exige êxito único porque o sucesso de um depender do outro é o que torna o objetivo compartilhado, sem que pontuações individuais o desfaçam. A essencialidade é média porque a mediação entre pares também ocorre por comunicação (D06, D07) e por ajuda (D16). Exige multijogador com estado compartilhado e papéis ou recursos distintos entre jogadores; viabilidade baixa."
    evidencia:
      codigo:
        procedimento: "Localizar a condição de conclusão das missões com mais de um jogador e verificar se o êxito é um só para o grupo (variável ou registro único) ou separado por identificador de jogador, e se a ação de um jogador escreve recurso, informação, acesso ou papel que as condições ou ações de outro jogador leem para habilitar, liberar ou mudar o que ele pode fazer (e não apenas reduz um contador compartilhado). Regra de desempate: se as fontes divergirem sobre uma missão, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre uma missão conta como sem código para essa missão, e GDD que não descreve uma missão conta como sem GDD para essa missão"
        indicadores:
          - "existe missão cuja conclusão só é registrada depois da ação prevista de cada um de dois ou mais identificadores de jogador diferentes"
          - "nessa missão, o êxito é um só registro comum aos jogadores participantes, e não um registro por jogador; pontuações ou recompensas individuais não alteram essa verificação"
          - "nessa missão, ao menos uma ação de um jogador escreve recurso, informação, acesso ou papel que as condições ou as ações de outro jogador participante leem para habilitar, liberar ou mudar o que ele pode fazer, e não apenas reduz um contador compartilhado (indica o estado atendido)"
          - "se o objetivo é compartilhado mas nenhuma ação de um jogador habilita, libera, fornece ou muda o que outro pode ou precisa fazer, anotar (indica o estado parcial; inclui contribuições somadas a um total comum)"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente as missões em grupo: o objetivo, o êxito e o que a ação de cada jogador habilita, libera, fornece ou muda para os demais. Regra de desempate: se as fontes divergirem sobre uma missão, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre uma missão conta como sem código para essa missão, e GDD que não descreve uma missão conta como sem GDD para essa missão"
        indicadores:
          - "o GDD descreve missão que só se conclui depois da ação prevista de cada um de dois ou mais jogadores diferentes"
          - "o GDD descreve um único êxito comum aos jogadores participantes (pontuações ou recompensas individuais não alteram essa verificação)"
          - "o GDD descreve ao menos uma ação de um jogador que habilita, libera, fornece ou muda um acesso, recurso, informação ou as ações que outro jogador participante pode ou precisa executar (indica o estado atendido)"
          - "se o GDD descreve objetivo compartilhado mas nenhuma ação que habilite, libere, forneça ou mude o que outro jogador pode ou precisa fazer, anotar (indica o estado parcial; inclui contribuições somadas a um total comum)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD: não mostra que a conclusão exige mais de um jogador, e a ausência de colaboração no vídeo não prova que o jogo não a oferece. Registrar missão em que dois ou mais jogadores diferentes atuam, na mesma gravação ou em gravações distintas, as ações de cada um, o efeito de cada ação sobre o que os demais podem ou precisam fazer e o êxito exibido na conclusão. Regra de desempate: se as fontes divergirem sobre uma missão, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre uma missão conta como sem código para essa missão, e GDD que não descreve uma missão conta como sem GDD para essa missão"
        indicadores:
          - "dois ou mais jogadores diferentes atuam na mesma missão, na mesma gravação ou em gravações distintas (mínimo 0 missões)"
          - "o jogo exibe, na conclusão, um único êxito comum aos jogadores participantes"
          - "ao menos uma ação de um jogador habilita, libera, fornece ou muda um acesso, recurso, informação ou as ações que outro jogador participante pode ou precisa executar, com timestamp da ação e do efeito"
    escala:
      atendido: "Existe ao menos uma missão com objetivo compartilhado cujas ações dos jogadores participantes são interdependentes, nos termos do enunciado e das definições"
      parcial: "Existe missão com objetivo compartilhado, nos termos do enunciado e das definições, mas as ações dos jogadores participantes não são interdependentes (cada jogador contribui sem que sua ação habilite, libere, forneça ou mude o que o outro pode ou precisa fazer, o que inclui contribuições somadas a um total comum)"
      nao_atendido: "Nenhuma missão tem objetivo compartilhado, nos termos do enunciado e das definições (inclui jogo de um só jogador e jogo em que cada jogador tem um êxito separado)"
    recomendacao:
      documentacao: "Registrar no GDD ou documento equivalente uma missão com ações previstas para dois ou mais jogadores, com o objetivo e as ações previstas para cada um deles. Registrar que essa missão só se conclui depois da ação prevista de cada um desses jogadores e que o êxito é um só, comum aos jogadores participantes. Registrar, para ao menos uma ação de um jogador, o acesso, recurso, informação ou ação que essa ação habilita, libera, fornece ou muda para outro jogador participante"
      design: "Definir ao menos uma missão com ações previstas para dois ou mais jogadores diferentes, cuja conclusão só ocorre depois da ação prevista de cada um deles. Definir para essa missão um único êxito comum aos jogadores participantes, e não um êxito separado por jogador. Definir, nessa missão, ao menos uma ação de um jogador que habilite, libere, forneça ou mude, para outro jogador participante, um acesso, um recurso, uma informação ou as ações que esse outro jogador pode ou precisa executar (por exemplo, entregar um item, abrir uma passagem ou papéis com ações complementares), e não apenas reduza a quantidade restante de um total comum"
      codigo: "Criar um registro compartilhado (sessão, sala ou estado comum) que aceite dois ou mais identificadores de jogador na mesma missão. Fazer a condição de conclusão dessa missão verificar a ação prevista de cada identificador de jogador participante. Gravar o êxito dessa missão em um único registro comum aos jogadores participantes, e não em um registro por jogador. Acrescentar, nessa missão, ao menos uma ação de um jogador que escreva recurso, informação, acesso ou papel que as condições ou as ações de outro jogador participante leiam para habilitar, liberar ou mudar o que esse outro jogador pode fazer, e não apenas reduza um contador compartilhado"
    depende_de:
      - [D13.1]
    definicoes:
      glossario: [missao, documentacao_equivalente]
      locais:
        "jogador": "uma pessoa que joga, e personagem não jogável não conta"
        "objetivo compartilhado": "o objetivo de uma missão cuja conclusão só é registrada depois da ação prevista de cada um de ao menos dois jogadores diferentes, na mesma sessão ou em sessões diferentes, e cujo êxito (cumprimento da condição de conclusão) é um só, comum a todos os jogadores participantes, e não um êxito separado por jogador, de modo que pontuações ou recompensas individuais não desfazem o objetivo compartilhado quando o êxito é um só"
        "ações interdependentes": "aquelas em que a ação de ao menos um jogador participante habilita, libera, fornece ou muda, para outro jogador participante, um acesso, um recurso, uma informação ou as ações que ele pode ou precisa executar para alcançar o objetivo (por exemplo, entregar um item, abrir uma passagem, fornecer uma informação, papéis com ações complementares, em que a ação de um é condição da ação do outro); reduzir a quantidade restante de um total comum, de modo que cada jogador contribui sem que sua ação habilite, libere, forneça ou mude o que o outro pode ou precisa fazer, não é interdependência"
