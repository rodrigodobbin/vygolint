id: D27
categoria: socializacao
diretriz: "O jogo deve aproximar os jogadores pela colaboração"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D27.1
    nivel: AAA
    enunciado: "Existe ao menos uma missão ou tarefa com objetivo compartilhado cujas ações dos jogadores participantes são interdependentes; Definições: jogador é uma pessoa que joga, e personagem não jogável não conta; missão ou tarefa é uma unidade do jogo com objetivo e condição de conclusão próprios; objetivo compartilhado é o objetivo de uma missão ou tarefa cuja conclusão só é registrada depois da ação prevista de cada um de ao menos dois jogadores diferentes, na mesma sessão ou em sessões diferentes, e cujo resultado (êxito, pontuação ou recompensa) é um só, comum a todos os jogadores participantes, e não um resultado separado por jogador; ações interdependentes são aquelas em que a ação de um jogador participante altera o estado do jogo, os recursos ou as informações de que outro jogador participante dispõe para alcançar o objetivo, ou o que ele precisa fazer (por exemplo, entregar um item, abrir uma passagem, fornecer uma informação, papéis com ações complementares); somar contribuições, de modo que cada jogador contribui sem que sua ação altere o que o outro dispõe ou precisa fazer, não é interdependência"
    nivel_justificativa:
      essencialidade: media
      viabilidade: baixa
      texto: "Em Vigotski a zona de desenvolvimento proximal pode ser constituída entre pares: um jogador medeia a ação do outro ao fornecer-lhe informação, recurso ou passagem, o que só ocorre quando a ação de um altera o que o outro pode fazer. D13.1 garante que a conclusão exige a ação de mais de um jogador; D27 acrescenta o objetivo compartilhado e a interdependência das ações, sem os quais a colaboração se reduz à soma de contribuições individuais. A essencialidade é média porque a mediação entre pares também ocorre por comunicação (D06, D07) e por ajuda (D16). Exige multijogador com estado compartilhado e papéis ou recursos distintos entre jogadores; viabilidade baixa."
    evidencia:
      codigo:
        procedimento: "Localizar a condição de conclusão das missões e tarefas com mais de um jogador e verificar se o resultado é um só para o grupo (variável ou registro único) ou separado por identificador de jogador, e se a ação de um jogador escreve estado, recurso ou informação que as condições ou ações de outro jogador leem. Definições: jogador é uma pessoa que joga, e personagem não jogável não conta; missão ou tarefa é uma unidade do jogo com objetivo e condição de conclusão próprios; objetivo compartilhado é o objetivo de uma missão ou tarefa cuja conclusão só é registrada depois da ação prevista de cada um de ao menos dois jogadores diferentes, na mesma sessão ou em sessões diferentes, e cujo resultado (êxito, pontuação ou recompensa) é um só, comum a todos os jogadores participantes, e não um resultado separado por jogador; ações interdependentes são aquelas em que a ação de um jogador participante altera o estado do jogo, os recursos ou as informações de que outro jogador participante dispõe para alcançar o objetivo, ou o que ele precisa fazer (por exemplo, entregar um item, abrir uma passagem, fornecer uma informação, papéis com ações complementares); somar contribuições, de modo que cada jogador contribui sem que sua ação altere o que o outro dispõe ou precisa fazer, não é interdependência. Regra de desempate: se as fontes divergirem sobre uma missão ou tarefa, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre uma missão ou tarefa conta como sem código para essa missão ou tarefa, e GDD que não descreve uma missão ou tarefa conta como sem GDD para essa missão ou tarefa"
        indicadores:
          - "existe missão ou tarefa cuja conclusão só é registrada depois da ação prevista de cada um de dois ou mais identificadores de jogador diferentes"
          - "nessa missão ou tarefa, o resultado (êxito, pontuação ou recompensa) é um só registro comum aos jogadores participantes, e não um registro por jogador"
          - "nessa missão ou tarefa, ao menos uma ação de um jogador escreve estado, recurso ou informação que as condições ou as ações de outro jogador participante leem (indica o estado atendido)"
          - "se o objetivo é compartilhado mas nenhuma ação de um jogador altera o que outro dispõe ou precisa fazer, anotar (indica o estado parcial)"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente as missões e tarefas em grupo: o objetivo, o resultado e o que a ação de cada jogador altera para os demais. Definições: jogador é uma pessoa que joga, e personagem não jogável não conta; missão ou tarefa é uma unidade do jogo com objetivo e condição de conclusão próprios; objetivo compartilhado é o objetivo de uma missão ou tarefa cuja conclusão só é registrada depois da ação prevista de cada um de ao menos dois jogadores diferentes, na mesma sessão ou em sessões diferentes, e cujo resultado (êxito, pontuação ou recompensa) é um só, comum a todos os jogadores participantes, e não um resultado separado por jogador; ações interdependentes são aquelas em que a ação de um jogador participante altera o estado do jogo, os recursos ou as informações de que outro jogador participante dispõe para alcançar o objetivo, ou o que ele precisa fazer (por exemplo, entregar um item, abrir uma passagem, fornecer uma informação, papéis com ações complementares); somar contribuições, de modo que cada jogador contribui sem que sua ação altere o que o outro dispõe ou precisa fazer, não é interdependência. Regra de desempate: se as fontes divergirem sobre uma missão ou tarefa, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre uma missão ou tarefa conta como sem código para essa missão ou tarefa, e GDD que não descreve uma missão ou tarefa conta como sem GDD para essa missão ou tarefa"
        indicadores:
          - "o GDD descreve missão ou tarefa que só se conclui depois da ação prevista de cada um de dois ou mais jogadores diferentes"
          - "o GDD descreve um único resultado (êxito, pontuação ou recompensa) comum aos jogadores participantes"
          - "o GDD descreve ao menos uma ação de um jogador que altera o estado do jogo, os recursos ou as informações de que outro jogador participante dispõe, ou o que ele precisa fazer (indica o estado atendido)"
          - "se o GDD descreve objetivo compartilhado mas nenhuma ação que altere o que outro jogador dispõe ou precisa fazer, anotar (indica o estado parcial)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD: não mostra que a conclusão exige mais de um jogador, e a ausência de colaboração no vídeo não prova que o jogo não a oferece. Registrar missão ou tarefa em que dois ou mais jogadores diferentes atuam, na mesma gravação ou em gravações distintas, as ações de cada um, o efeito de cada ação sobre o que os demais dispõem ou fazem e o resultado exibido na conclusão. Definições: jogador é uma pessoa que joga, e personagem não jogável não conta; missão ou tarefa é uma unidade do jogo com objetivo e condição de conclusão próprios; objetivo compartilhado é o objetivo de uma missão ou tarefa cuja conclusão só é registrada depois da ação prevista de cada um de ao menos dois jogadores diferentes, na mesma sessão ou em sessões diferentes, e cujo resultado (êxito, pontuação ou recompensa) é um só, comum a todos os jogadores participantes, e não um resultado separado por jogador; ações interdependentes são aquelas em que a ação de um jogador participante altera o estado do jogo, os recursos ou as informações de que outro jogador participante dispõe para alcançar o objetivo, ou o que ele precisa fazer (por exemplo, entregar um item, abrir uma passagem, fornecer uma informação, papéis com ações complementares); somar contribuições, de modo que cada jogador contribui sem que sua ação altere o que o outro dispõe ou precisa fazer, não é interdependência. Regra de desempate: se as fontes divergirem sobre uma missão ou tarefa, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre uma missão ou tarefa conta como sem código para essa missão ou tarefa, e GDD que não descreve uma missão ou tarefa conta como sem GDD para essa missão ou tarefa"
        indicadores:
          - "dois ou mais jogadores diferentes atuam na mesma missão ou tarefa, na mesma gravação ou em gravações distintas (mínimo 0 missões ou tarefas)"
          - "o jogo exibe, na conclusão, um único resultado comum aos jogadores participantes"
          - "ao menos uma ação de um jogador altera o estado do jogo, os recursos ou as informações de que outro jogador participante dispõe, ou o que ele precisa fazer, com timestamp da ação e do efeito"
    escala:
      atendido: "Existe ao menos uma missão ou tarefa com objetivo compartilhado cujas ações dos jogadores participantes são interdependentes, nos termos do enunciado"
      parcial: "Existe missão ou tarefa com objetivo compartilhado, nos termos do enunciado, mas as ações dos jogadores participantes não são interdependentes (cada jogador contribui sem que sua ação altere o que o outro dispõe ou precisa fazer). Definição: ações interdependentes são aquelas em que a ação de um jogador participante altera o estado do jogo, os recursos ou as informações de que outro jogador participante dispõe para alcançar o objetivo, ou o que ele precisa fazer"
      nao_atendido: "Nenhuma missão ou tarefa tem objetivo compartilhado, nos termos do enunciado (inclui jogo de um só jogador e jogo em que cada jogador tem um resultado separado). Definição: objetivo compartilhado é o objetivo de uma missão ou tarefa cuja conclusão só é registrada depois da ação prevista de cada um de ao menos dois jogadores diferentes, na mesma sessão ou em sessões diferentes, e cujo resultado (êxito, pontuação ou recompensa) é um só, comum a todos os jogadores participantes, e não um resultado separado por jogador"
    depende_de:
      - [D13.1]
