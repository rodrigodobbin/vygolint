id: D09
categoria: interacao
diretriz: "O jogador deve se comunicar por linguagem escrita"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D09.1
    nivel: AA
    enunciado: "Em ao menos um ponto do jogo, o jogador produz texto livre, como em chat, resposta aberta, anotação ou nome de item"
    nivel_justificativa:
      essencialidade: media
      viabilidade: alta
      texto: "Em Vigotski, a linguagem é instrumento de mediação que organiza o pensamento, e a escrita exige que o sujeito formule por conta própria o que quer dizer. Quando o jogador apenas lê, seleciona frases prontas ou escolhe alternativas, o jogo dispensa essa formulação. A essencialidade é média porque a comunicação também ocorre por fala (D06) ou por ação no jogo. Um campo de entrada de texto é recurso padrão das ferramentas de desenvolvimento; viabilidade alta."
    evidencia:
      codigo:
        procedimento: "Localizar campos de entrada de texto (input fields, teclados exibidos na tela) e verificar se aceitam qualquer sequência de caracteres digitada pelo jogador ou se o conteúdo é escolhido de uma lista fechada de opções. Verificar também se o jogo lê o conteúdo digitado. Nas listas fechadas, classificar cada uma: primeiro verificar se o jogo avalia a opção escolhida como certa ou errada: se avalia, é alternativa de múltipla escolha, mesmo que o texto também seja exibido ou enviado como mensagem do jogador; se não avalia e o jogo exibe ou envia a opção como mensagem do jogador, é composição por seleção"
        indicadores:
          - "existe campo de entrada de texto ou teclado na tela que aceita qualquer sequência de caracteres digitada pelo jogador, sem lista fechada de opções"
          - "um manipulador de evento (handler) ou função do jogo lê o texto digitado e o usa (exibe, guarda, envia ou avalia)"
          - "se não há campo desse tipo, existe lista fechada de palavras ou frases que o jogo exibe ou envia como mensagem do jogador e não avalia como certas ou erradas (composição por seleção; indica o estado parcial)"
          - "se não há campo desse tipo nem composição por seleção, as únicas listas fechadas são alternativas de múltipla escolha (incluindo opções avaliadas como certas ou erradas, mesmo exibidas como mensagem do jogador) ou opções não textuais (indica o estado nao_atendido)"
      documentacao: null
      video:
        procedimento: "O vídeo só confirma a evidência de código: a ausência de digitação no vídeo não prova que o jogo não oferece texto livre. Registrar os momentos em que o jogador digita ou escolhe texto e anotar se ele digita caracteres de sua escolha, compõe mensagem por seleção ou escolhe alternativa de múltipla escolha"
        indicadores:
          - "ao menos um momento em que o jogador digita caracteres de sua escolha em campo de entrada e o texto aparece no jogo"
          - "nos momentos de escolha de texto registrados (mínimo 0), o jogador compõe mensagem por seleção, sem avaliação do jogo como certa ou errada, em vez de digitar (indica o estado parcial)"
          - "nos momentos de escolha registrados (mínimo 0), o jogador escolhe apenas alternativas de múltipla escolha, incluindo opções avaliadas como certas ou erradas mesmo quando exibidas como mensagem do jogador (não contam como produção de texto)"
    escala:
      atendido: "Em ao menos um ponto do jogo, o jogador digita texto livre, nos termos do enunciado, e o jogo recebe esse texto"
      parcial: "O jogador compõe mensagens por seleção, nos termos do enunciado, sem digitar texto livre em nenhum ponto do jogo"
      nao_atendido: "O jogador não digita texto livre nem compõe mensagem por seleção em nenhum ponto do jogo; só lê, escolhe alternativas de múltipla escolha (incluindo opções avaliadas como certas ou erradas, mesmo exibidas como mensagem do jogador), escolhe opções não textuais ou age sobre objetos"
    depende_de: []
    definicoes:
      locais:
        "texto livre": "uma sequência de caracteres digitada pelo jogador em campo de entrada (ou em teclado exibido na tela que permita qualquer sequência), sem ser escolhida de lista de opções prontas, e recebida pelo jogo"
        "composição por seleção": "escolher, em lista fechada oferecida pelo jogo, palavras ou frases prontas que o jogo exibe ou envia como mensagem do jogador sem avaliá-las como certas ou erradas (opção de diálogo, chat rápido, montagem de frase por palavras), e não conta como texto livre"
        "alternativa de múltipla escolha": "uma opção que o jogo avalia como certa ou errada para uma pergunta ou tarefa; escolher uma alternativa de múltipla escolha, com texto escrito ou não, não é composição por seleção nem produção de texto"
        "precedência": "se o jogo avalia a opção escolhida como certa ou errada, ela é múltipla escolha, mesmo quando o texto também é exibido ou enviado como mensagem do jogador (por exemplo, montagem de frase por palavras com correção e opção de diálogo avaliada como certa ou errada)"
