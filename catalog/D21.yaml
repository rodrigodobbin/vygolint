id: D21
categoria: mediacao
diretriz: "O jogo pode fornecer simulações de formas para resolver o problema"
fonte: "Carvalho (2020), Quadro 3"
modalidade: pode
aplicabilidade: null
criterios:
  - id: D21.1
    nivel: AA
    enunciado: "Em ao menos um desafio existe uma simulação de uma forma de resolver o desafio que não substitui a ação do jogador, isto é, depois dela o desafio continua a ser resolvido pelas ações do jogador"
    nivel_justificativa:
      essencialidade: media
      viabilidade: media
      texto: "Para Vigotski, na zona de desenvolvimento proximal o aprendiz realiza por imitação, ou em colaboração, o que ainda não realiza sozinho, e ver uma forma de resolução executada é o apoio que a imitação pressupõe. Se a simulação conclui o desafio pelo jogador, a imitação não ocorre e a atividade é substituída. A diretriz é opcional na redação de Carvalho (pode), por isso o nível nunca é A, e a essencialidade é média porque outras formas de mediação (D16 a D20 e D22) também apoiam a resolução. Viabilidade média: exige criar, por desafio, uma execução automática ou animada de ações, mais custosa que um texto de dica."
    evidencia:
      codigo:
        procedimento: "Localizar modos de demonstração, repetições gravadas, tutoriais animados, personagens ou rotinas que executam as ações de um desafio (por exemplo, chamadas automáticas das mesmas funções que as ações do jogador executam). Verificar se o estado do desafio muda durante a execução, se ao fim é chamada a rotina que registra conclusão, pontuação ou progresso do desafio e se o jogador pode jogar o desafio depois. Regra de desempate: se as fontes divergirem sobre uma simulação, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre a simulação conta como sem código para essa simulação, e GDD que não a descreve conta como sem GDD para essa simulação; a ausência de simulação no vídeo não prova que o jogo não a oferece"
        indicadores:
          - "todas as simulações foram listadas, cada uma com o desafio em que ocorre e a forma de acionamento (mínimo 0 simulações)"
          - "cada simulação listada executa ao menos uma ação sobre o estado do desafio, e não apenas texto, imagem estática ou demonstração dos controles"
          - "ao menos uma simulação listada não chama, ao fim, a rotina que registra a conclusão, a pontuação ou o progresso do desafio, e o jogador pode jogar o desafio depois dela (indica o estado atendido); se todas as simulações listadas a chamam ou impedem jogar o desafio depois, indica o estado parcial"
      documentacao:
        procedimento: "Verificar no documento de design (GDD) ou documento equivalente a descrição de modo de demonstração, repetição gravada ou tutorial animado de um desafio: quando é acionado, qual forma de resolver é mostrada e o que acontece com o desafio depois. Regra de desempate: se as fontes divergirem sobre uma simulação, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre a simulação conta como sem código para essa simulação, e GDD que não a descreve conta como sem GDD para essa simulação; a ausência de simulação no vídeo não prova que o jogo não a oferece"
        indicadores:
          - "o GDD descreve, por desafio, a simulação, a forma de acionamento e a ação executada sobre o estado do desafio (mínimo 0 simulações)"
          - "o GDD declara, para cada simulação descrita, se o jogo registra o desafio como concluído ao fim dela e se o jogador pode jogar o desafio depois"
          - "ao menos uma simulação descrita não registra a conclusão e permite jogar o desafio depois (indica o estado atendido); se todas registram a conclusão ou impedem jogar o desafio depois, indica o estado parcial"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD: a ausência de simulação no vídeo não prova que o jogo não a oferece. Registrar os momentos em que uma simulação é exibida e anotar se o estado do desafio muda durante ela, se pontuação, conclusão ou progresso do desafio mudam ao fim dela e se o jogador passa a controlar o desafio depois. Regra de desempate: se as fontes divergirem sobre uma simulação, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre a simulação conta como sem código para essa simulação, e GDD que não a descreve conta como sem GDD para essa simulação; a ausência de simulação no vídeo não prova que o jogo não a oferece"
        indicadores:
          - "cada simulação observada foi registrada com timestamp, forma de acionamento e ação executada sobre o estado do desafio (mínimo 0 simulações)"
          - "ao fim de cada simulação registrada, foi anotado se conclusão, pontuação ou progresso do desafio mudam sem que o jogador tenha agido"
          - "depois de cada simulação registrada, foi anotado se o jogador passa a controlar o desafio"
    escala:
      atendido: "Em ao menos um desafio existe uma simulação que não substitui a ação do jogador, nos termos do enunciado e das definições"
      parcial: "Existe ao menos uma simulação, mas todas as simulações existentes substituem a ação do jogador, nos termos do enunciado e das definições"
      nao_atendido: "Não existe simulação, nos termos do enunciado e das definições, em nenhum desafio"
    recomendacao:
      documentacao: "Registrar no GDD ou documento equivalente, para cada desafio com simulação, a simulação, a forma de acionamento e a ação executada sobre o estado do desafio. Registrar, para cada simulação, se o jogo registra o desafio como concluído ao fim da simulação e se o jogador pode jogar o desafio depois"
      design: "Definir, em ao menos um desafio, uma simulação em que o próprio jogo (personagem, animação ou repetição gravada) executa ao menos uma ação de uma forma de resolver o desafio, com a mudança no estado do desafio visível ao jogador. Definir que, ao fim dessa simulação, o jogo não registre conclusão, pontuação ou progresso do desafio e que o jogador possa jogar o desafio em seguida"
      codigo: "Acrescentar, em ao menos um desafio, uma rotina de demonstração que chame as mesmas funções que as ações do jogador executam e mude o estado do desafio de forma visível ao jogador. Fazer essa rotina terminar sem chamar a rotina que registra conclusão, pontuação ou progresso do desafio. Devolver ao jogador o controle do desafio ao fim da rotina de demonstração"
    depende_de: []
    definicoes:
      glossario: [missao, minijogo, desafio, documentacao_equivalente]
      locais:
        "forma de resolver o desafio": "uma sequência de ações que leva do estado inicial ao objetivo do desafio"
        "simulação": "a execução, pelo próprio jogo (personagem, animação ou repetição gravada), de ao menos uma ação de uma forma de resolver o desafio sobre o estado do desafio, com a mudança de estado visível ao jogador, acionada pelo jogador ou exibida pelo jogo antes ou durante o desafio; descrição por texto ou imagem estática, sem execução de ações, é pista (D20) e não é simulação, e a demonstração de como operar os controles, sem avançar o estado do desafio rumo ao objetivo, também não é simulação"
        "simulação substitui a ação do jogador": "quando, ao fim dela, o jogo registra o desafio como concluído (concede conclusão, pontuação ou progresso do desafio) sem que o jogador tenha agido, ou o jogador não pode mais jogar o desafio depois dela"
