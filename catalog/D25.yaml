id: D25
categoria: autonomia
diretriz: "O jogador decide, com base em seus interesses e motivações, qual conteúdo explorar"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D25.1
    nivel: AA
    enunciado: "Existem ao menos dois conteúdos opcionais disponíveis ao mesmo tempo que tratam de objetivos de aprendizagem diferentes, de modo que o jogador escolhe qual explorar; Definições: conteúdo e objetivo de aprendizagem são os listados no documento de design (GDD) ou documento equivalente; caminho da missão é a sequência de objetivos exigidos para completá-la; conteúdo opcional é uma parte do jogo (missão secundária, minijogo, texto, glossário, objeto ou área) que trata de um objetivo de aprendizagem, isto é, cita ou descreve conceito, fato ou procedimento listado entre os objetivos de aprendizagem, e cujo acesso nenhum objetivo do caminho da missão em curso exige, de modo que o jogador conclui a missão sem acessá-lo; conteúdos opcionais disponíveis ao mesmo tempo são conteúdos opcionais que o jogador pode acessar em um mesmo estado do jogo, por ação própria (menu, interação ou deslocamento) e não por disparo automático; escolher a ordem de atividades obrigatórias é tratado em D03 e escolher entre recursos para o mesmo desafio é tratado em D24, e nenhum dos dois é escolha de conteúdo opcional"
    nivel_justificativa:
      essencialidade: media
      viabilidade: media
      texto: "Em Vigotski a motivação é função da atividade: o sentido que o jogador atribui ao que faz orienta sua ação, e escolher o que explorar permite que o interesse dirija a atividade em vez de ser dirigido apenas pelo jogo. Exigem-se dois conteúdos opcionais sobre objetivos diferentes porque, com um só, o jogador decide apenas explorar ou não, e não qual conteúdo explorar; o critério verifica a existência da escolha, e não os interesses do jogador, que variam. D25 trata de conteúdo dispensável para a missão e não se confunde com D03.1 (ordem entre atividades obrigatórias) nem com D24 (meios para o mesmo desafio), por isso a essencialidade é média. Produzir conteúdo além do exigido pela missão tem custo de roteiro e de arte; viabilidade média."
    evidencia:
      codigo:
        procedimento: "Localizar as partes do jogo acessíveis fora do caminho da missão (missões secundárias, minijogos, textos, glossários, objetos e áreas) e, para cada uma, o objetivo de aprendizagem que trata, o que a libera e se alguma condição de conclusão da missão em curso lê o acesso a ela. Definições: conteúdo e objetivo de aprendizagem são os listados no documento de design (GDD) ou documento equivalente; caminho da missão é a sequência de objetivos exigidos para completá-la; conteúdo opcional é uma parte do jogo (missão secundária, minijogo, texto, glossário, objeto ou área) que trata de um objetivo de aprendizagem, isto é, cita ou descreve conceito, fato ou procedimento listado entre os objetivos de aprendizagem, e cujo acesso nenhum objetivo do caminho da missão em curso exige, de modo que o jogador conclui a missão sem acessá-lo; conteúdos opcionais disponíveis ao mesmo tempo são conteúdos opcionais que o jogador pode acessar em um mesmo estado do jogo, por ação própria (menu, interação ou deslocamento) e não por disparo automático; escolher a ordem de atividades obrigatórias é tratado em D03 e escolher entre recursos para o mesmo desafio é tratado em D24, e nenhum dos dois é escolha de conteúdo opcional. Regra de desempate: se as fontes divergirem sobre um conteúdo, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um conteúdo conta como sem código para esse conteúdo, e GDD que não descreve um conteúdo conta como sem GDD para esse conteúdo"
        indicadores:
          - "todas as partes do jogo acessíveis fora do caminho da missão foram listadas, cada uma com o objetivo de aprendizagem que trata (mínimo 0 partes)"
          - "nenhuma condição de conclusão da missão em curso lê o acesso a essas partes, de modo que são conteúdos opcionais, nos termos da definição"
          - "ao menos dois conteúdos opcionais que tratam de objetivos de aprendizagem diferentes podem ser acessados em um mesmo estado do jogo, por ação do jogador (indica o estado atendido)"
          - "se existe um só conteúdo opcional, ou se todos os conteúdos opcionais disponíveis ao mesmo tempo tratam de um único objetivo de aprendizagem, anotar (indica o estado parcial)"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente os objetivos de aprendizagem e as partes do jogo descritas como não exigidas pelo caminho da missão, o objetivo que cada uma trata e a forma de acesso. Definições: conteúdo e objetivo de aprendizagem são os listados no documento de design (GDD) ou documento equivalente; caminho da missão é a sequência de objetivos exigidos para completá-la; conteúdo opcional é uma parte do jogo (missão secundária, minijogo, texto, glossário, objeto ou área) que trata de um objetivo de aprendizagem, isto é, cita ou descreve conceito, fato ou procedimento listado entre os objetivos de aprendizagem, e cujo acesso nenhum objetivo do caminho da missão em curso exige, de modo que o jogador conclui a missão sem acessá-lo; conteúdos opcionais disponíveis ao mesmo tempo são conteúdos opcionais que o jogador pode acessar em um mesmo estado do jogo, por ação própria (menu, interação ou deslocamento) e não por disparo automático; escolher a ordem de atividades obrigatórias é tratado em D03 e escolher entre recursos para o mesmo desafio é tratado em D24, e nenhum dos dois é escolha de conteúdo opcional. Regra de desempate: se as fontes divergirem sobre um conteúdo, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um conteúdo conta como sem código para esse conteúdo, e GDD que não descreve um conteúdo conta como sem GDD para esse conteúdo"
        indicadores:
          - "o GDD lista os objetivos de aprendizagem e as partes do jogo que o caminho da missão não exige, cada uma com o objetivo de aprendizagem que trata (mínimo 0 partes)"
          - "o GDD descreve ao menos dois conteúdos opcionais que tratam de objetivos de aprendizagem diferentes, acessíveis ao mesmo tempo por ação do jogador (indica o estado atendido)"
          - "o GDD descreve que a missão se conclui sem acessar esses conteúdos"
          - "se o GDD descreve um só conteúdo opcional, ou conteúdos opcionais disponíveis ao mesmo tempo que tratam de um único objetivo de aprendizagem, anotar (indica o estado parcial)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD: mostra o que a interface oferece, mas não mostra se a missão exigia o conteúdo, e a ausência de conteúdo opcional no vídeo não prova que o jogo não o oferece. Registrar os conteúdos que a interface oferece fora do caminho da missão, o objetivo de aprendizagem que cada um trata e a forma de acesso. Definições: conteúdo e objetivo de aprendizagem são os listados no documento de design (GDD) ou documento equivalente; caminho da missão é a sequência de objetivos exigidos para completá-la; conteúdo opcional é uma parte do jogo (missão secundária, minijogo, texto, glossário, objeto ou área) que trata de um objetivo de aprendizagem, isto é, cita ou descreve conceito, fato ou procedimento listado entre os objetivos de aprendizagem, e cujo acesso nenhum objetivo do caminho da missão em curso exige, de modo que o jogador conclui a missão sem acessá-lo; conteúdos opcionais disponíveis ao mesmo tempo são conteúdos opcionais que o jogador pode acessar em um mesmo estado do jogo, por ação própria (menu, interação ou deslocamento) e não por disparo automático; escolher a ordem de atividades obrigatórias é tratado em D03 e escolher entre recursos para o mesmo desafio é tratado em D24, e nenhum dos dois é escolha de conteúdo opcional. Regra de desempate: se as fontes divergirem sobre um conteúdo, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre um conteúdo conta como sem código para esse conteúdo, e GDD que não descreve um conteúdo conta como sem GDD para esse conteúdo"
        indicadores:
          - "cada conteúdo oferecido fora do caminho da missão foi registrado com timestamp, objetivo de aprendizagem que trata e forma de acesso (mínimo 0 conteúdos)"
          - "em ao menos um ponto gravado, a interface oferece ao mesmo tempo o acesso a dois ou mais conteúdos que tratam de objetivos de aprendizagem diferentes"
          - "o vídeo confirma que um conteúdo é opcional quando mostra a missão em curso concluída sem que o jogador o tenha acessado, estando ele oferecido pela interface; a ausência dessa conclusão no vídeo não prova que o conteúdo seja exigido"
    escala:
      atendido: "Existem ao menos dois conteúdos opcionais disponíveis ao mesmo tempo que tratam de objetivos de aprendizagem diferentes, nos termos do enunciado"
      parcial: "Existe ao menos um conteúdo opcional, mas não existem dois conteúdos opcionais disponíveis ao mesmo tempo que tratem de objetivos de aprendizagem diferentes, nos termos do enunciado (há um só conteúdo opcional, ou os conteúdos opcionais disponíveis ao mesmo tempo tratam de um único objetivo de aprendizagem). Definição: conteúdos opcionais disponíveis ao mesmo tempo são conteúdos opcionais que o jogador pode acessar em um mesmo estado do jogo, por ação própria (menu, interação ou deslocamento) e não por disparo automático"
      nao_atendido: "Não existe nenhum conteúdo opcional, nos termos do enunciado (todo conteúdo do jogo é exigido pelo caminho da missão). Definição: caminho da missão é a sequência de objetivos exigidos para completá-la"
    depende_de: []
