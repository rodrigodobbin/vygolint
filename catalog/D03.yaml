id: D03
categoria: interacao
diretriz: "O desenvolvimento das atividades/missões/minijogos deve ser autorregulado pelo jogador"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D03.1
    nivel: A
    enunciado: "Em ao menos um ponto do jogo, o jogador pode escolher entre duas ou mais atividades, missões ou minijogos disponíveis ao mesmo tempo e iniciar a escolhida"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: media
      texto: "Em Vigotski, a autorregulação é o movimento em que o controle da própria ação passa do outro para o aprendiz, e decidir o que fazer a seguir é parte desse controle. Num jogo estritamente linear a ordem é decidida pelo sistema, e o jogador apenas executa a sequência. Oferecer atividades em paralelo exige estrutura de progressão não linear e conteúdo que não dependa de uma ordem fixa; viabilidade média."
    evidencia:
      codigo:
        procedimento: "Localizar a lógica de desbloqueio de missões e minijogos e verificar se há algum estado do jogo em que duas ou mais atividades estão desbloqueadas ao mesmo tempo e selecionáveis. Verificar também, dentro de cada atividade, se o código aceita mais de uma ordem para executar as ações (objetos, perguntas ou etapas)"
        indicadores:
          - "existe estado do jogo em que duas ou mais atividades estão desbloqueadas simultaneamente"
          - "a atividade iniciada é determinada por entrada do jogador (menu, mapa, interação), não por ordem fixa no código"
          - "dentro de ao menos uma atividade, o código aceita mais de uma ordem para executar as ações (objetos, perguntas ou etapas), sem impor sequência fixa"
      documentacao: null
      video:
        procedimento: "Registrar os pontos em que o jogo oferece atividades e anotar quantas estão disponíveis e qual o jogador inicia. Registrar também, dentro de cada atividade, se a interface apresenta duas ou mais ações (objetos, perguntas ou etapas) disponíveis ao mesmo tempo e em que ordem o jogador as executa"
        indicadores:
          - "ao menos um ponto em que duas ou mais atividades aparecem disponíveis ao mesmo tempo (menu, mapa ou cenário)"
          - "o jogador inicia uma delas; a outra pode permanecer disponível, ser iniciada depois ou ficar indisponível após a escolha (escolha excludente)"
          - "dentro de ao menos uma atividade, a interface apresenta duas ou mais ações (objetos, perguntas ou etapas) disponíveis ao mesmo tempo e o jogador escolhe a ordem de execução"
    escala:
      atendido: "Em ao menos um ponto, o jogador escolhe entre duas ou mais atividades, missões ou minijogos disponíveis ao mesmo tempo"
      parcial: "O jogador não escolhe entre atividades, missões ou minijogos, mas escolhe a ordem das ações dentro de uma atividade (como objetos, perguntas ou etapas)"
      nao_atendido: "As atividades, missões e minijogos se sucedem numa única ordem definida pelo jogo, e dentro de cada uma a ordem das ações também é fixa"
    recomendacao:
      documentacao: null
      design: "Definir ao menos um ponto do jogo em que duas ou mais atividades, missões ou minijogos fiquem disponíveis ao mesmo tempo e o jogador escolha qual iniciar"
      codigo: "Alterar a lógica de desbloqueio para que exista um estado do jogo com duas ou mais atividades desbloqueadas ao mesmo tempo. Determinar a atividade iniciada pela entrada do jogador (menu, mapa ou interação), e não por ordem fixa no código"
    depende_de: []
    definicoes:
      glossario: [missao, minijogo]
      termos_comuns:
        "cenário": "ambiente do jogo em que as atividades aparecem disponíveis («menu, mapa ou cenário»), o que inclui hub sem missão em curso, e não o cenário jogável"
  - id: D03.2
    nivel: A
    enunciado: "O jogador inicia cada atividade, missão ou minijogo por uma ação própria e o jogo não avança de uma para a próxima sem essa ação"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: alta
      texto: "Atividade, em Vigotski, é conduzida pelo sujeito; a autorregulação inclui decidir o momento de passar de uma etapa à seguinte. Se o jogo encadeia as etapas sozinho, o controle da transição permanece no sistema. Basta condicionar a transição a uma ação do jogador, o que não exige recurso técnico especial."
    evidencia:
      codigo:
        procedimento: "Localizar as transições entre missões e minijogos e verificar o que as dispara"
        indicadores:
          - "a transição é disparada por entrada do jogador (botão, escolha, interação)"
          - "não há transição disparada apenas por temporizador ou por término automático da etapa anterior"
      documentacao: null
      video:
        procedimento: "Registrar cada transição entre atividades e anotar se houve ação do jogador antes da mudança"
        indicadores:
          - "todas as transições presentes no vídeo foram registradas (mínimo 1)"
          - "cada transição é precedida por ação do jogador"
    escala:
      atendido: "Todas as transições observadas ou identificadas no código dependem de ação do jogador"
      parcial: "Ao menos uma transição depende de ação do jogador e ao menos outra ocorre automaticamente"
      nao_atendido: "As atividades se sucedem automaticamente, sem ação do jogador"
    recomendacao:
      documentacao: null
      design: "Prever, ao fim de cada atividade, missão ou minijogo, uma ação do jogador que dispare a passagem para a seguinte"
      codigo: "Substituir cada transição disparada por temporizador ou por término automático da etapa anterior por uma transição disparada por entrada do jogador (botão, escolha ou interação)"
    depende_de: []
    definicoes:
      glossario: [missao, minijogo]
  - id: D03.3
    nivel: A
    enunciado: "Nenhuma atividade tem limite de tempo obrigatório para ser concluída, ou o limite pode ser desativado ou ampliado pelo jogador"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: alta
      texto: "Em Vigotski, a mediação precisa responder ao ritmo com que o aprendiz elabora a tarefa, e esse ritmo não é conhecido de antemão pelo jogo. Um temporizador obrigatório impõe a todos o mesmo ritmo e leva o jogador a responder antes de elaborar. Remover o limite ou torná-lo opcional é de baixo custo."
    evidencia:
      codigo:
        procedimento: "Procurar temporizadores associados a missões e minijogos e verificar o que ocorre quando o tempo se esgota e se há opção de desativá-los"
        indicadores:
          - "existência de temporizador com consequência de falha ao esgotar"
          - "existência de configuração que desativa ou amplia o temporizador"
      documentacao:
        procedimento: "Verificar no GDD as regras de tempo de cada atividade"
        indicadores:
          - "indicação de quais atividades têm limite de tempo"
          - "indicação de opção do jogador para alterar o limite"
      video:
        procedimento: "Observar cada atividade registrando se há contador de tempo visível, o que ocorre quando ele chega a zero e se o jogador pode permanecer na atividade sem limite"
        indicadores:
          - "todas as atividades presentes no vídeo foram observadas (mínimo 1)"
          - "o jogador permanece na atividade sem ser interrompido por esgotamento de tempo"
          - "não há contador de tempo visível cujo esgotamento encerre ou reprove a atividade; se há contador visível e o vídeo mostra seu esgotamento, a atividade não termina nem falha"
    escala:
      atendido: "Nenhuma atividade tem limite de tempo obrigatório, ou o jogador pode desativar ou ampliar o limite"
      parcial: "Ao menos uma atividade tem limite de tempo obrigatório e ao menos outra não tem"
      nao_atendido: "Todas as atividades têm limite de tempo obrigatório que o jogador não pode alterar"
    recomendacao:
      documentacao: "Registrar no GDD ou documento equivalente as regras de tempo de cada atividade, indicando quais têm limite de tempo. Registrar, para cada atividade com limite, a opção do jogador que o desativa ou amplia"
      design: "Retirar o limite de tempo obrigatório de cada atividade que o tem, ou prever uma opção do jogador que o desative ou amplie"
      codigo: "Remover o encerramento ou a reprovação disparados por cada temporizador de atividade, ou acrescentar uma configuração do jogador que o desative ou amplie"
    depende_de: []
    definicoes:
      glossario: [missao, minijogo, documentacao_equivalente]
      locais:
        "limite obrigatório": "um temporizador cujo esgotamento encerra ou reprova a atividade"
