id: D18
categoria: mediacao
diretriz: "O jogo deve exibir feedback individualizado para as ações do jogador"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D18.1
    nivel: A
    enunciado: "Existe ao menos um ponto de feedback avaliado e todo ponto de feedback avaliado exibe feedback individualizado, isto é, a mensagem varia conforme a ação específica do jogador ou conforme o histórico dele, e não é a mesma para qualquer ação com o mesmo resultado"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: media
      texto: "Na mediação vigotskiana, o outro mais experiente ajusta o apoio ao que o aprendiz fez e já fez, e é esse ajuste que orienta a atuação na zona de desenvolvimento proximal. Uma mensagem igual para ações diferentes não mostra ao jogador que o jogo identificou o que ele fez, o que a aproxima do reforço genérico que as diretrizes querem afastar. Este critério trata só da variação da mensagem (a orientação é D17), por isso não depende de D17.1: uma mensagem pode variar sem orientar. Viabilidade média: exige escrever mais de uma mensagem por ponto e, para variar pelo histórico, registrar tentativas e erros do jogador."
    evidencia:
      codigo:
        procedimento: "Localizar os manipuladores de evento (handlers) e funções que exibem mensagens de feedback em texto ou fala em resposta a ações do jogador e listar cada ponto de feedback. Em cada um, verificar se o texto é escolhido ou montado a partir da ação específica (valor escolhido, objeto, resposta) ou do histórico (contadores de tentativas ou de erros, registro de ações anteriores) e se há ao menos dois ramos, ou um texto que insere o dado da ação, que produzem mensagens diferentes para o mesmo resultado. Regra de desempate: se as fontes divergirem sobre um ponto de feedback, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre o ponto conta como sem código para esse ponto, e GDD que não descreve o ponto conta como sem GDD para esse ponto; a ausência de variação no vídeo não prova que o jogo não varia, porque depende de o jogador gravado ter feito ações diferentes, e por isso o ponto sem ocorrências comparáveis no vídeo não é ponto avaliado"
        indicadores:
          - "todos os pontos de feedback foram listados, cada um com o trecho de código que escolhe ou monta a mensagem (mínimo 0 pontos)"
          - "em cada ponto listado, a mensagem é escolhida ou montada a partir da ação específica ou do histórico, e não por sorteio nem apenas pelo resultado"
          - "em cada ponto listado, existem ao menos duas ações específicas diferentes, ou dois históricos diferentes, com o mesmo resultado, que produzem mensagens diferentes em informação que cita ou descreve o que o jogador fez"
          - "os pontos listados que não atendem aos dois itens anteriores foram anotados (indica o estado parcial quando ao menos um ponto atende)"
      documentacao:
        procedimento: "Verificar no documento de design (GDD) ou documento equivalente a especificação das mensagens de feedback por ponto de feedback e o que seleciona cada mensagem. Regra de desempate: se as fontes divergirem sobre um ponto de feedback, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre o ponto conta como sem código para esse ponto, e GDD que não descreve o ponto conta como sem GDD para esse ponto; a ausência de variação no vídeo não prova que o jogo não varia, porque depende de o jogador gravado ter feito ações diferentes, e por isso o ponto sem ocorrências comparáveis no vídeo não é ponto avaliado"
        indicadores:
          - "o GDD lista, por ponto de feedback, as mensagens previstas e a ação específica ou o histórico que seleciona cada uma (mínimo 0 pontos)"
          - "em cada ponto listado, ao menos duas ações específicas diferentes, ou dois históricos diferentes, com o mesmo resultado, têm mensagens previstas que diferem em informação que cita ou descreve o que o jogador fez"
          - "os pontos listados que não atendem ao item anterior foram anotados (indica o estado parcial quando ao menos um ponto atende)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD. Registrar o timestamp de cada mensagem de feedback, a ação específica que a gerou, o resultado e o número da tentativa, agrupando as ocorrências por ponto de feedback e identificando as ocorrências comparáveis. Regra de desempate: se as fontes divergirem sobre um ponto de feedback, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre o ponto conta como sem código para esse ponto, e GDD que não descreve o ponto conta como sem GDD para esse ponto; a ausência de variação no vídeo não prova que o jogo não varia, porque depende de o jogador gravado ter feito ações diferentes, e por isso o ponto sem ocorrências comparáveis no vídeo não é ponto avaliado"
        indicadores:
          - "todo ponto de feedback com duas ocorrências comparáveis no vídeo foi registrado, cada ocorrência com timestamp, ação específica, resultado e texto ou fala da mensagem (mínimo 0 pontos)"
          - "nos pontos registrados, as mensagens de ocorrências comparáveis diferem em informação que cita ou descreve o que o jogador fez"
          - "os pontos registrados em que ocorrências comparáveis recebem a mesma mensagem, ou mensagens que diferem só pelo resultado, pelo nome do jogador, pela pontuação ou por sinônimos, foram anotados (indica o estado parcial quando ao menos um ponto atende ao item anterior)"
    escala:
      atendido: "Existe ao menos um ponto de feedback avaliado e todos os pontos de feedback avaliados exibem feedback individualizado, nos termos do enunciado"
      parcial: "Ao menos um ponto de feedback avaliado exibe feedback individualizado, nos termos do enunciado, e ao menos outro ponto de feedback avaliado não o exibe, nos termos do enunciado"
      nao_atendido: "Nenhum ponto de feedback avaliado exibe feedback individualizado, nos termos do enunciado, ou não existe ponto de feedback avaliado"
    depende_de: []
    definicoes:
      glossario: [missao, minijogo, desafio, documentacao_equivalente]
      locais:
        "ponto de feedback": "cada missão, minijogo ou tipo de interação em que o jogo exibe, em texto ou fala, mensagem em resposta a uma ação do jogador"
        "ação específica": "o que o jogador de fato fez no ponto de feedback (a alternativa escolhida, o objeto usado, a resposta digitada ou o local acionado)"
        "histórico": "o conjunto de ações anteriores do mesmo jogador, na sessão ou em sessões salvas (número de tentativas, erros anteriores, acertos anteriores)"
        "feedback individualizado": "o de um ponto de feedback em que existem ao menos duas ações específicas diferentes, ou dois históricos diferentes, que levam ao mesmo resultado (acerto ou erro) e produzem mensagens que diferem em ao menos uma informação que cita ou descreve o que o jogador fez (a resposta dada, o objeto usado, o tipo de erro, o número da tentativa); não contam como diferença o resultado (acerto ou erro) sozinho, o nome do jogador, a pontuação, sinônimos de elogio ou de erro que não citam a ação e a escolha de mensagem por sorteio sem uso da ação ou do histórico"
        "ponto avaliado": "o ponto de feedback sobre o qual há evidência determinada: no código e no GDD, todo ponto de feedback descrito; no vídeo, só o ponto com duas ocorrências comparáveis, isto é, duas ocorrências com o mesmo resultado e ações específicas diferentes ou números de tentativa diferentes"
        "escopo": "este critério avalia só se a mensagem varia: a orientação da próxima ação é tratada em D17, e a mudança do desafio conforme o desempenho é tratada em D33 e D34"
