id: D38
categoria: linguagem
diretriz: "O jogo deve fornecer informações escritas ao jogador"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D38.1
    nivel: A
    enunciado: "Cada missão tem instrução em forma escrita, e todo diálogo com NPC e toda descrição de objeto interativo que o jogo fornece têm forma escrita, isto é, texto na tela e não apenas áudio"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: alta
      texto: "Em Vigotski, a linguagem escrita é um sistema de signos que medeia o pensamento e, ao contrário da fala, permanece disponível para releitura, o que apoia a memória mediada e a atenção voluntária do aprendiz ao longo da atividade. Instrução, diálogo ou descrição fornecidos só em áudio obrigam o jogador a reter o que ouviu, sem poder consultá-lo de novo. O conjunto mínimo (instruções de missão, diálogos com NPC e descrições de objetos interativos) é o conteúdo pelo qual o jogo media a ação do jogador, e produzir texto é papel do jogador, tratado em D09. Exibir texto em caixa de diálogo é recurso básico dos motores de jogo; viabilidade alta."
    evidencia:
      codigo:
        procedimento: "Listar as instruções de missão, os diálogos com NPC e as descrições de objetos interativos, e em cada item verificar se existe texto exibido na tela (campo de texto, caixa de diálogo, legenda, imagem com texto) e se há áudio sem texto correspondente. Verificar se a legenda é ativável nas opções e se o texto contém as ações, nomes e números do áudio. Regra de desempate: se as fontes divergirem sobre um item, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre o item conta como sem código para esse item, e GDD que não descreve o item conta como sem GDD para esse item; legenda que o código ou o GDD mostram ser ativável pelo jogador prevalece sobre vídeo gravado com a legenda desativada; o vídeo avalia só os itens que mostra, a ausência de diálogo ou descrição no vídeo não prova que o jogo não os tem, e sem item observado, o grau pelo vídeo é nao_atendido por falta de evidência, anotado como tal"
        indicadores:
          - "todas as missões foram listadas, cada uma com o recurso que fornece sua instrução (texto, áudio ou nenhum) (mínimo 1 missão)"
          - "todos os diálogos com NPC e todas as descrições de objetos interativos existentes foram listados, cada um com o recurso de texto e o de áudio, se houver (mínimo 0 itens)"
          - "cada item listado tem forma escrita, isto é, texto na tela que contém as ações, nomes e números do áudio do mesmo item, quando há áudio"
          - "os itens listados sem forma escrita (só áudio, ou instrução de missão não fornecida) foram anotados (indica o estado parcial quando ao menos um item tem forma escrita)"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente as instruções de cada missão, os diálogos com NPC e as descrições de objetos interativos e se cada um é descrito com texto na tela, só com áudio ou com ambos. Regra de desempate: se as fontes divergirem sobre um item, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre o item conta como sem código para esse item, e GDD que não descreve o item conta como sem GDD para esse item; legenda que o código ou o GDD mostram ser ativável pelo jogador prevalece sobre vídeo gravado com a legenda desativada; o vídeo avalia só os itens que mostra, a ausência de diálogo ou descrição no vídeo não prova que o jogo não os tem, e sem item observado, o grau pelo vídeo é nao_atendido por falta de evidência, anotado como tal"
        indicadores:
          - "o GDD descreve a instrução de cada missão e o meio em que ela é fornecida (mínimo 1 missão)"
          - "o GDD descreve os diálogos com NPC e as descrições de objetos interativos e o meio de cada um (mínimo 0 itens)"
          - "o GDD descreve cada item listado com forma escrita; os itens descritos só com áudio, ou a missão sem instrução descrita, foram anotados (indica o estado parcial quando ao menos um item tem forma escrita)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD: a ausência de item no vídeo não prova que o jogo não o tem. Registrar, em cada missão gravada desde a abertura, a instrução (texto, áudio ou nenhum) e, nos diálogos e descrições exibidos, se há texto na tela, só áudio ou ambos, anotando quais ações, nomes e números cada meio informa. Regra de desempate: se as fontes divergirem sobre um item, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre o item conta como sem código para esse item, e GDD que não descreve o item conta como sem GDD para esse item; legenda que o código ou o GDD mostram ser ativável pelo jogador prevalece sobre vídeo gravado com a legenda desativada; o vídeo avalia só os itens que mostra, a ausência de diálogo ou descrição no vídeo não prova que o jogo não os tem, e sem item observado, o grau pelo vídeo é nao_atendido por falta de evidência, anotado como tal"
        indicadores:
          - "todas as instruções de missão, diálogos com NPC e descrições de objetos interativos exibidos no vídeo foram registrados, cada um com o meio (texto, áudio) e o instante (mínimo 0 itens)"
          - "cada item registrado tem texto na tela que contém as ações, nomes e números do áudio do mesmo item"
          - "os itens registrados sem texto na tela foram anotados, conferindo antes no código ou no GDD se há legenda ativável (indica o estado parcial quando ao menos um item tem forma escrita)"
    escala:
      atendido: "Existe ao menos um item avaliado e todos os itens avaliados têm forma escrita, nos termos do enunciado e das definições"
      parcial: "Ao menos um item avaliado tem forma escrita, nos termos do enunciado e das definições, e ao menos outro item avaliado não tem (item sem forma escrita, nos termos do enunciado e das definições)"
      nao_atendido: "Nenhum item avaliado tem forma escrita, nos termos do enunciado e das definições, ou não existe item avaliado"
    recomendacao:
      documentacao: "Registrar no GDD ou documento equivalente a instrução de cada missão, os diálogos com NPC e as descrições de objetos interativos. Registrar que cada um desses itens é fornecido com texto na tela que contém as ações, nomes e números do áudio do mesmo item, quando há áudio"
      design: "Incluir, em cada missão sem instrução de missão, uma instrução em forma escrita, nos termos das definições. Incluir forma escrita em cada instrução de missão, diálogo com NPC e descrição de objeto interativo fornecidos só em áudio. Incluir no texto na tela de cada item as ações, nomes e números que o áudio do mesmo item informa e o texto omite"
      codigo: "Acrescentar, em cada missão sem instrução, um campo de texto, caixa de diálogo ou painel que exiba a instrução da missão. Acrescentar texto na tela (caixa de diálogo, legenda ou painel) a cada instrução de missão, diálogo com NPC e descrição de objeto interativo que só toca áudio. Trocar o texto de cada item que omite ações, nomes ou números do áudio do mesmo item por um texto que os contenha"
    depende_de: []
    definicoes:
      glossario: [missao, documentacao_equivalente]
      locais:
        "item do conjunto mínimo": "cada instrução de missão, cada diálogo com personagem não jogável (NPC) e cada descrição de objeto interativo"
        "instrução de missão": "o conteúdo que o jogo fornece ao jogador, em texto ou em áudio, dizendo o que fazer na missão, uma por missão"
        "diálogo com NPC": "a sequência de falas de um ou mais NPCs dirigidas ao jogador, iniciada por interação do jogador ou por evento da missão"
        "objeto interativo": "um elemento do cenário sobre o qual o jogador pode agir (examinar, pegar, usar, acionar)"
        "descrição de objeto interativo": "o conteúdo que o jogo fornece, em texto ou em áudio, quando o jogador interage com o objeto, dizendo o que o objeto é ou faz, e o texto que é apenas o nome do objeto ou da missão não é descrição nem instrução"
        "forma escrita": "texto exibido na tela e legível sem áudio (balão, caixa de diálogo, painel, legenda, inclusive a legenda que o jogador pode ativar nas opções, e texto embutido em imagem) que contém todas as ações, nomes e números que o áudio do mesmo item informa; não contam como forma escrita o ícone, o pictograma, a ilustração e a animação sem texto"
        "item sem forma escrita": "o item fornecido só em áudio (fala, narração ou som) e a instrução de missão que o jogo não fornece em forma alguma, e o diálogo ou a descrição que o jogo não fornece em forma alguma não é item, pois nada é fornecido"
        "item avaliado": "o item sobre o qual há evidência: no código e no GDD, todo item existente ou descrito, incluindo a instrução de cada missão; no vídeo, só o item cuja apresentação foi gravada inteira (a instrução da missão cuja abertura foi gravada, e os diálogos e descrições exibidos no vídeo)"
        "escopo": "este critério avalia só se o conteúdo fornecido existe por escrito: a produção de texto pelo jogador é tratada em D09"
      termos_comuns:
        "cenário": "em «elemento do cenário» (local objeto interativo), cenário está no sentido corrente de ambiente visual do jogo, e não no de cenário jogável (D29)"
