id: D40
categoria: aprendizado
diretriz: "O jogo deve viabilizar o aprendizado também pelos erros do jogador com mensagens textuais, sons e animações"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D40.1
    nivel: A
    enunciado: "Existe ao menos uma resposta avaliada a erro do jogador e todas as respostas avaliadas usam ao menos duas modalidades (texto, som, animação) e carregam informação sobre o erro"
    nivel_justificativa:
      essencialidade: alta
      viabilidade: alta
      texto: "Na mediação vigotskiana, o outro mais experiente ajusta o apoio ao que o aprendiz ainda não faz sozinho, e o erro é o ponto em que esse apoio é necessário. Som de falha ou X sinalizam que houve erro sem dizer o que rever, e uma resposta em um único canal fica sem alternativa quando o jogador não a percebe; por isso o critério exige ao menos duas das três modalidades, o menor número que dá redundância de canal, e que a resposta carregue informação sobre o erro. D40.1 depende de D17.1 porque, no jogo que cumpre D17.1, a informação transmitida pelas modalidades é a mensagem de orientação que ela exige; sem ela, texto, som e animação tendem a repetir só o sinal de falha. Associar texto, som e animação ao evento de erro é recurso comum nos motores de jogo; viabilidade alta."
    evidencia:
      codigo:
        procedimento: "Localizar os ramos de erro e falha de missão, minijogo e interação (condições avaliadas como incorretas e seus manipuladores de evento, ou handlers) e, em cada um, listar o que é exibido (texto), tocado (som, fala) e animado em resposta. Verificar se ao menos uma modalidade comunica o que estava errado ou o que fazer, e se o conteúdo do som é determinável. Regra de desempate: se as fontes divergirem sobre um tipo de erro, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre o tipo de erro conta como sem código para esse tipo, e GDD que não descreve esse tipo conta como sem GDD para esse tipo; o vídeo só traz respostas a erros que o jogador gravado cometeu, e a ausência de erro no vídeo não prova que o jogo não responde; sem resposta observada no vídeo, o grau pelo vídeo é nao_atendido por falta de evidência, anotado como tal"
        indicadores:
          - "todos os tipos de erro tratados no código foram listados, cada um com as respostas por modalidade (texto, som, animação) (mínimo 0 tipos)"
          - "em cada tipo de erro listado, a resposta usa ao menos duas modalidades"
          - "em cada tipo de erro listado, ao menos uma modalidade usada comunica o que estava errado ou o que fazer em seguida, e não só sinal de falha"
          - "os tipos de erro cuja resposta tem uma só modalidade, ou só sinal de falha, foram anotados (indica o estado parcial quando ao menos um tipo atende aos dois itens anteriores)"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente a especificação da resposta a cada tipo de erro: o texto, o som e a animação previstos e o que cada um informa. Regra de desempate: se as fontes divergirem sobre um tipo de erro, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre o tipo de erro conta como sem código para esse tipo, e GDD que não descreve esse tipo conta como sem GDD para esse tipo; o vídeo só traz respostas a erros que o jogador gravado cometeu, e a ausência de erro no vídeo não prova que o jogo não responde; sem resposta observada no vídeo, o grau pelo vídeo é nao_atendido por falta de evidência, anotado como tal"
        indicadores:
          - "o GDD lista os tipos de erro e, em cada um, as respostas por modalidade (texto, som, animação) (mínimo 0 tipos)"
          - "em cada tipo de erro listado, o GDD descreve resposta em ao menos duas modalidades"
          - "em cada tipo de erro listado, o GDD descreve que ao menos uma modalidade comunica o que estava errado ou o que fazer em seguida"
          - "os tipos de erro descritos com uma só modalidade, ou só com sinal de falha, foram anotados (indica o estado parcial quando ao menos um tipo atende aos dois itens anteriores)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD. Registrar o instante de cada erro cometido pelo jogador gravado e, na resposta do jogo, as modalidades usadas (texto exibido, som ou fala audíveis, animação), transcrevendo o texto e a fala e descrevendo a animação. Regra de desempate: se as fontes divergirem sobre um tipo de erro, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre o tipo de erro conta como sem código para esse tipo, e GDD que não descreve esse tipo conta como sem GDD para esse tipo; o vídeo só traz respostas a erros que o jogador gravado cometeu, e a ausência de erro no vídeo não prova que o jogo não responde; sem resposta observada no vídeo, o grau pelo vídeo é nao_atendido por falta de evidência, anotado como tal"
        indicadores:
          - "todas as respostas a erro observadas no vídeo foram registradas, cada uma com instante, modalidades, texto ou fala transcritos e animação descrita (mínimo 0 respostas)"
          - "cada resposta registrada usa ao menos duas modalidades"
          - "cada resposta registrada tem ao menos uma modalidade que comunica o que estava errado ou o que fazer em seguida, e não só sinal de falha"
          - "as respostas registradas com uma só modalidade, ou só com sinal de falha, foram anotadas (indica o estado parcial quando ao menos uma resposta atende aos dois itens anteriores)"
    escala:
      atendido: "Existe ao menos uma resposta avaliada a erro do jogador e todas as respostas avaliadas usam ao menos duas modalidades e carregam informação sobre o erro, nos termos do enunciado"
      parcial: "Ao menos uma resposta avaliada usa ao menos duas modalidades e carrega informação sobre o erro, nos termos do enunciado, e ao menos outra resposta avaliada não atende a esses dois requisitos"
      nao_atendido: "Nenhuma resposta avaliada usa ao menos duas modalidades e carrega informação sobre o erro, nos termos do enunciado, ou não existe resposta avaliada (inclui resposta só com sinal de falha)"
    depende_de:
      - [D17.1]
    definicoes:
      glossario: [missao, minijogo, desafio, documentacao_equivalente]
      locais:
        "erro": "uma ação do jogador que o jogo avalia como incorreta em relação ao objetivo da missão ou do desafio (resposta errada, objeto ou ordem errados, violação de regra) e à qual responde, e não são erro a inação do jogador nem o esgotamento do tempo sem ação incorreta"
        "resposta ao erro": "tudo o que o jogo exibe ou toca em consequência do erro, do momento em que o avalia até o jogador poder agir de novo"
        "modalidade": "cada um destes canais: texto (palavras escritas exibidas na tela), som (efeito sonoro, música ou fala audíveis, disparados pelo erro) e animação (mudança visual em movimento, de posição, forma, cor ou tamanho, de elemento do cenário ou da interface, disparada pelo erro e que se desenrola no tempo; a imagem estática, como um ícone fixo, não conta); a resposta usa uma modalidade quando ao menos um elemento dela pertence a essa modalidade, e a fala que lê em voz alta um texto conta como som, além de o texto contar como texto"
        "informação sobre o erro": "o que estava errado (cita ou mostra qual resposta, objeto ou ação estava incorreto, ou por quê) ou o que fazer em seguida (ação, conteúdo a rever ou dica específica ao erro), comunicado por ao menos uma das modalidades usadas (texto ou fala que o diz, animação que mostra o elemento incorreto ou o efeito do erro)"
        "sinal de falha": "o que só indica que houve erro (mensagem como \"Errou\" ou \"Tente novamente\", X ou cor vermelha fixos, buzina ou outro efeito sonoro sem fala, piscar da tela, perda de pontos) e não é informação sobre o erro, e o som cujo conteúdo não pode ser determinado (áudio sem transcrição, no código, no GDD ou no vídeo) conta como sinal de falha"
        "tipo de erro": "cada ramo ou condição que o jogo avalia como incorreta, em cada missão, minijogo ou tipo de interação"
        "resposta avaliada": "a resposta a um erro sobre o qual há evidência: no código e no GDD, a resposta a cada tipo de erro tratado ou descrito; no vídeo, toda resposta a erro observada"
        "escopo": "este critério avalia a multimodalidade da resposta e a presença de informação sobre o erro: a orientação da próxima ação, que D17.1 exige, e a variação da mensagem conforme a ação ou o histórico do jogador, tratada em D18, não são avaliadas aqui"
      termos_comuns:
        "cenário": "em «elemento do cenário ou da interface» (local modalidade), cenário está no sentido corrente de ambiente visual do jogo, e não no de cenário jogável (D29)"
