id: D26
categoria: socializacao
diretriz: "O jogo deve aproximar os jogadores pela competição"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D26.1
    nivel: AAA
    enunciado: "Existe ao menos uma competição com comparação visível aos jogadores, isto é, uma regra do jogo que compara os resultados de dois ou mais jogadores diferentes e uma tela que exibe essa comparação ao jogador; Definições: jogador é uma pessoa que joga, e personagem não jogável não conta; resultado é uma medida que o jogo atribui a cada jogador (pontuação, tempo, posição, quantidade de itens ou de desafios concluídos); competição é uma regra do jogo que compara os resultados de dois ou mais jogadores diferentes, na mesma sessão ou em sessões diferentes, para determinar qual tem o melhor resultado (ranking, placar ou disputa); a comparação entre o resultado do jogador e o resultado anterior dele mesmo, ou o de personagem não jogável, não é competição; comparação visível é aquela em que alguma tela do jogo mostra ao jogador o resultado de ao menos um outro jogador identificado (nome, apelido ou número) junto do dele, ou a ordenação dos jogadores por resultado"
    nivel_justificativa:
      essencialidade: media
      viabilidade: baixa
      texto: "Para Vigotski a interação social é a origem das funções psicológicas superiores, e na competição o resultado de outro jogador serve de referência para o próprio, o que aproxima os jogadores sem que um precise ajudar o outro. A essencialidade é média porque a competição produz comparação e não necessariamente mediação por pares, que ocorre de modo mais direto na colaboração (D27) e na comunicação entre jogadores (D06, D07). Exige identificar jogadores e guardar ou compartilhar resultados entre eles (servidor, banco de dados ou mesma tela); viabilidade baixa."
    evidencia:
      codigo:
        procedimento: "Localizar as regras que guardam um resultado por identificador de jogador e as comparam (ordenação, ranking, comparação de pontuações, definição de vencedor) e as telas que leem esses resultados para exibi-los. Definições: jogador é uma pessoa que joga, e personagem não jogável não conta; resultado é uma medida que o jogo atribui a cada jogador (pontuação, tempo, posição, quantidade de itens ou de desafios concluídos); competição é uma regra do jogo que compara os resultados de dois ou mais jogadores diferentes, na mesma sessão ou em sessões diferentes, para determinar qual tem o melhor resultado (ranking, placar ou disputa); a comparação entre o resultado do jogador e o resultado anterior dele mesmo, ou o de personagem não jogável, não é competição; comparação visível é aquela em que alguma tela do jogo mostra ao jogador o resultado de ao menos um outro jogador identificado (nome, apelido ou número) junto do dele, ou a ordenação dos jogadores por resultado. Regra de desempate: se as fontes divergirem sobre uma competição, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre uma competição conta como sem código para essa competição, e GDD que não descreve uma competição conta como sem GDD para essa competição"
        indicadores:
          - "existe regra que guarda um resultado por identificador de jogador e compara os resultados de dois ou mais jogadores diferentes (ordenação, placar ou definição de vencedor)"
          - "a comparação é entre jogadores, e não entre o jogador e o resultado anterior dele mesmo ou o de personagem não jogável"
          - "alguma tela lê esses resultados e exibe ao jogador o resultado de ao menos um outro jogador identificado junto do dele, ou a ordenação dos jogadores por resultado (indica o estado atendido)"
          - "se a regra de comparação existe mas nenhuma tela exibe a comparação ao jogador, anotar (indica o estado parcial)"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente as regras de competição entre jogadores e as telas descritas para exibi-las. Definições: jogador é uma pessoa que joga, e personagem não jogável não conta; resultado é uma medida que o jogo atribui a cada jogador (pontuação, tempo, posição, quantidade de itens ou de desafios concluídos); competição é uma regra do jogo que compara os resultados de dois ou mais jogadores diferentes, na mesma sessão ou em sessões diferentes, para determinar qual tem o melhor resultado (ranking, placar ou disputa); a comparação entre o resultado do jogador e o resultado anterior dele mesmo, ou o de personagem não jogável, não é competição; comparação visível é aquela em que alguma tela do jogo mostra ao jogador o resultado de ao menos um outro jogador identificado (nome, apelido ou número) junto do dele, ou a ordenação dos jogadores por resultado. Regra de desempate: se as fontes divergirem sobre uma competição, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre uma competição conta como sem código para essa competição, e GDD que não descreve uma competição conta como sem GDD para essa competição"
        indicadores:
          - "o GDD descreve regra que compara os resultados de dois ou mais jogadores diferentes (ranking, placar ou disputa) para determinar qual tem o melhor resultado"
          - "o GDD descreve tela que exibe ao jogador o resultado de ao menos um outro jogador identificado junto do dele, ou a ordenação dos jogadores por resultado (indica o estado atendido)"
          - "se o GDD descreve a regra de comparação mas nenhuma tela que a exiba ao jogador, anotar (indica o estado parcial)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD: mostra a tela de comparação, mas não mostra a regra que a produz, e a ausência de comparação no vídeo não prova que o jogo não a oferece. Registrar as telas em que aparecem resultados de mais de um jogador. Definições: jogador é uma pessoa que joga, e personagem não jogável não conta; resultado é uma medida que o jogo atribui a cada jogador (pontuação, tempo, posição, quantidade de itens ou de desafios concluídos); competição é uma regra do jogo que compara os resultados de dois ou mais jogadores diferentes, na mesma sessão ou em sessões diferentes, para determinar qual tem o melhor resultado (ranking, placar ou disputa); a comparação entre o resultado do jogador e o resultado anterior dele mesmo, ou o de personagem não jogável, não é competição; comparação visível é aquela em que alguma tela do jogo mostra ao jogador o resultado de ao menos um outro jogador identificado (nome, apelido ou número) junto do dele, ou a ordenação dos jogadores por resultado. Regra de desempate: se as fontes divergirem sobre uma competição, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre uma competição conta como sem código para essa competição, e GDD que não descreve uma competição conta como sem GDD para essa competição"
        indicadores:
          - "cada tela gravada que exibe resultados de jogadores foi registrada com timestamp (mínimo 0 telas)"
          - "em ao menos uma tela registrada, o resultado de ao menos um outro jogador identificado aparece junto do resultado do jogador gravado, ou os jogadores aparecem ordenados por resultado"
    escala:
      atendido: "Existe ao menos uma competição com comparação visível aos jogadores, nos termos do enunciado"
      parcial: "Existe competição, nos termos do enunciado, mas nenhuma tela do jogo exibe a comparação ao jogador (o jogo compara os resultados de dois ou mais jogadores diferentes sem exibir a comparação). Definição: comparação visível é aquela em que alguma tela do jogo mostra ao jogador o resultado de ao menos um outro jogador identificado (nome, apelido ou número) junto do dele, ou a ordenação dos jogadores por resultado"
      nao_atendido: "O jogo não compara os resultados de dois ou mais jogadores diferentes, nos termos do enunciado (inclui jogo de um só jogador e jogo em que o resultado é comparado apenas com o anterior do próprio jogador ou com personagem não jogável). Definição: competição é uma regra do jogo que compara os resultados de dois ou mais jogadores diferentes, na mesma sessão ou em sessões diferentes, para determinar qual tem o melhor resultado"
    depende_de: []
