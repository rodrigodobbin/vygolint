id: D26
categoria: socializacao
diretriz: "O jogo deve aproximar os jogadores pela competição"
fonte: "Carvalho (2020), Quadro 3"
modalidade: deve
aplicabilidade: null
criterios:
  - id: D26.1
    nivel: AAA
    enunciado: "Existe ao menos uma competição com comparação visível aos jogadores, isto é, uma regra do jogo que compara os resultados de dois ou mais jogadores diferentes e uma tela que exibe essa comparação ao jogador"
    nivel_justificativa:
      essencialidade: media
      viabilidade: baixa
      texto: "Para Vigotski a interação social é a origem das funções psicológicas superiores, e na competição o resultado de outro jogador serve de referência para o próprio, o que aproxima os jogadores sem que um precise ajudar o outro. A essencialidade é média porque a competição produz comparação e não necessariamente mediação por pares, que ocorre de modo mais direto na colaboração (D27) e na comunicação entre jogadores (D06, D07). Exige identificar jogadores e guardar ou compartilhar resultados entre eles (servidor, banco de dados ou mesma tela); viabilidade baixa."
    evidencia:
      codigo:
        procedimento: "Localizar as regras que guardam um resultado por identificador de jogador ou de equipe e as comparam (ordenação, ranking, comparação de pontuações, definição de vencedor) e as telas que leem esses resultados para exibi-los. Regra de desempate: se as fontes divergirem sobre uma competição, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre uma competição conta como sem código para essa competição, e GDD que não descreve uma competição conta como sem GDD para essa competição"
        indicadores:
          - "existe regra que guarda um resultado por identificador de jogador ou de equipe e compara os resultados de dois ou mais jogadores diferentes, diretamente ou por suas equipes (ordenação, placar ou definição de vencedor)"
          - "a comparação é entre jogadores, ou entre equipes de jogadores, e não entre o jogador e o resultado anterior dele mesmo ou o de personagem não jogável"
          - "alguma tela lê esses resultados e exibe ao jogador o resultado de ao menos um outro jogador identificado junto do dele, ou a ordenação dos jogadores por resultado; quando o resultado é de equipe, exibe o resultado de ao menos uma outra equipe identificada junto do da equipe do jogador, ou a ordenação das equipes por resultado (indica o estado atendido)"
          - "se a regra de comparação existe mas nenhuma tela exibe a comparação ao jogador, anotar (indica o estado parcial)"
      documentacao:
        procedimento: "Verificar no GDD ou documento equivalente as regras de competição entre jogadores e as telas descritas para exibi-las. Regra de desempate: se as fontes divergirem sobre uma competição, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre uma competição conta como sem código para essa competição, e GDD que não descreve uma competição conta como sem GDD para essa competição"
        indicadores:
          - "o GDD descreve regra que compara os resultados de dois ou mais jogadores diferentes (ranking, placar ou disputa) para determinar qual tem o melhor resultado"
          - "o GDD descreve tela que exibe ao jogador o resultado de ao menos um outro jogador identificado junto do dele, ou a ordenação dos jogadores por resultado; quando o resultado é de equipe, descreve tela que exibe o resultado de ao menos uma outra equipe identificada junto do da equipe do jogador, ou a ordenação das equipes por resultado (indica o estado atendido)"
          - "se o GDD descreve a regra de comparação mas nenhuma tela que a exiba ao jogador, anotar (indica o estado parcial)"
      video:
        procedimento: "O vídeo só confirma a evidência de código ou do GDD: mostra a tela de comparação, mas não mostra a regra que a produz, e a ausência de comparação no vídeo não prova que o jogo não a oferece. Registrar as telas em que aparecem resultados de mais de um jogador. Regra de desempate: se as fontes divergirem sobre uma competição, vale o código; sem código, o GDD; sem ambos, o vídeo; código que existe mas não traz dado sobre uma competição conta como sem código para essa competição, e GDD que não descreve uma competição conta como sem GDD para essa competição"
        indicadores:
          - "cada tela gravada que exibe resultados de jogadores foi registrada com timestamp (mínimo 0 telas)"
          - "em ao menos uma tela registrada, o resultado de ao menos um outro jogador identificado aparece junto do resultado do jogador gravado, ou os jogadores aparecem ordenados por resultado; quando o resultado é de equipe, o resultado de outra equipe identificada aparece junto do da equipe do jogador gravado, ou as equipes aparecem ordenadas por resultado"
          - "os nomes, apelidos ou números exibidos nessa tela correspondem a jogadores, e não a personagens não jogáveis; se o vídeo não permite verificar essa correspondência, a verificação fica a cargo do código ou do GDD e, sem eles, a tela não confirma o estado atendido"
    escala:
      atendido: "Existe ao menos uma competição com comparação visível aos jogadores, nos termos do enunciado e das definições"
      parcial: "Existe competição, nos termos do enunciado e das definições, mas nenhuma tela do jogo exibe a comparação ao jogador (o jogo compara os resultados de dois ou mais jogadores diferentes sem exibir a comparação)"
      nao_atendido: "O jogo não compara os resultados de dois ou mais jogadores diferentes, nos termos do enunciado e das definições (inclui jogo de um só jogador e jogo em que o resultado é comparado apenas com o anterior do próprio jogador ou com personagem não jogável)"
    recomendacao:
      documentacao: "Registrar no GDD ou documento equivalente a regra que compara os resultados de dois ou mais jogadores diferentes, ou de suas equipes, para determinar qual tem o melhor resultado. Registrar a tela que exibe ao jogador o resultado de ao menos um outro jogador identificado junto do resultado desse jogador, ou a ordenação dos jogadores por resultado, ou, quando o resultado é de equipe, o resultado de ao menos uma outra equipe identificada junto do da equipe do jogador, ou a ordenação das equipes por resultado"
      design: "Definir ao menos uma regra que compare os resultados de dois ou mais jogadores diferentes, ou de suas equipes, para determinar qual tem o melhor resultado, e não apenas com o resultado anterior do próprio jogador ou com o de personagem não jogável. Definir uma tela que exiba ao jogador o resultado de ao menos um outro jogador identificado (nome, apelido ou número) junto do resultado desse jogador, ou a ordenação dos jogadores por resultado, ou, quando o resultado é de equipe, o resultado de ao menos uma outra equipe identificada junto do da equipe do jogador, ou a ordenação das equipes por resultado"
      codigo: "Acrescentar uma regra que guarde o resultado por identificador de jogador ou de equipe e compare os resultados de dois ou mais jogadores diferentes, ou de suas equipes (ordenação, placar ou definição de vencedor). Acrescentar uma tela que leia esses resultados e exiba ao jogador o resultado de ao menos um outro jogador identificado (nome, apelido ou número) junto do resultado desse jogador, ou a ordenação dos jogadores por resultado, ou, quando o resultado é de equipe, o resultado de ao menos uma outra equipe identificada junto do da equipe do jogador, ou a ordenação das equipes por resultado"
    depende_de: []
    definicoes:
      glossario: [missao, minijogo, desafio, documentacao_equivalente]
      locais:
        "jogador": "uma pessoa que joga, e personagem não jogável não conta"
        "resultado": "uma medida que o jogo atribui a cada jogador (pontuação, tempo, posição, quantidade de itens ou de desafios concluídos) e, quando o jogo atribui a medida a uma equipe identificada (nome, cor ou número) de dois ou mais jogadores, o resultado da equipe a que o jogador pertence conta como resultado desse jogador"
        "competição": "uma regra do jogo que compara os resultados de dois ou mais jogadores diferentes, na mesma sessão ou em sessões diferentes, para determinar qual tem o melhor resultado (ranking, placar ou disputa); a comparação entre o resultado do jogador e o resultado anterior dele mesmo, ou o de personagem não jogável, não é competição"
        "comparação visível": "aquela em que alguma tela do jogo mostra ao jogador o resultado de ao menos um outro jogador identificado (nome, apelido ou número) junto do dele, ou a ordenação dos jogadores por resultado; quando o resultado é de equipe, é aquela em que alguma tela mostra o resultado de ao menos uma outra equipe identificada junto do da equipe do jogador, ou a ordenação das equipes por resultado"
