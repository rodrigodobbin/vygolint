  clausula: disponibilização a outro jogador = o jogo disponibiliza o desafio criado a outro jogador quando o guarda em armazenamento compartilhado entre jogadores (servidor, arquivo ou código de compartilhamento) e oferece ao outro jogador uma ação do jogo para abri-lo (lista, convite, importação ou código) e jogá-lo
- criterio: D36.1
  clausula: escopo = este critério avalia a operação do jogador e a persistência e consulta do resultado, e não a coleta da informação, tratada em D11
- criterio: D37.1
  clausula: 'escopo = este critério avalia só se o estado inicial e o objetivo são declarados antes da ação: o número de ações possíveis e a decisão do jogador, que a abertura não declara, e portanto se a unidade é de fato uma situação-problema, são tratados em D01, e a abertura com dispositivo de curiosidade é tratada em D28'
- criterio: D38.1
  clausula: 'escopo = este critério avalia só se o conteúdo fornecido existe por escrito: a produção de texto pelo jogador é tratada em D09'
- criterio: D40.1
  clausula: 'escopo = este critério avalia a multimodalidade da resposta e a presença de informação sobre o erro: a orientação da próxima ação, que D17.1 exige, e a variação da mensagem conforme a ação ou o histórico do jogador, tratada em D18, não são avaliadas aqui'
- criterio: D30.1
