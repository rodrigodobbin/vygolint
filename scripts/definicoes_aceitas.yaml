- criterio: D28.1
  de: 'dispositivo = um destes elementos presentes na abertura: pergunta explícita, evento sem desfecho ou informação retida, conforme definidos no enunciado'
  para: 'dispositivo = um destes elementos presentes na abertura: pergunta explícita (frase interrogativa, dirigida ao jogador ou dita por personagem, sobre eventos, personagens ou mundo da narrativa e que a abertura não responde; enunciado de questão que o jogador deve responder como parte do desafio não conta, e pergunta retórica sobre o conteúdo de aprendizagem, e não sobre eventos, personagens ou mundo da narrativa, conta somente se a própria narrativa a responde em trecho liberado depois de o jogador executar ao menos uma ação do objetivo da missão), evento sem desfecho (evento narrado, como um desaparecimento, uma ameaça ou um problema, cujo desfecho a abertura não mostra; o enunciado do objetivo da própria missão, isto é, o que o jogador deve fazer, não conta como evento sem desfecho) ou informação retida (afirmação, na abertura, de que algo é desconhecido ou está oculto, como um segredo ou uma identidade ainda não revelada)'
  tipo: equivalente
  decisao: null
- criterio: D29.1
  de: caminho obrigatório = o mesmo que caminho da missão em D05, a sequência de objetivos exigidos para completar a missão em curso no cenário, e fora do caminho obrigatório é tudo o que nenhum desses objetivos exige
  para: caminho obrigatório = a sequência de objetivos exigidos para completar a missão em curso, e fora do caminho obrigatório é tudo o que nenhum desses objetivos exige
  tipo: equivalente
  decisao: null
- criterio: D29.1
  de: cenário jogável = cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o jogo sem divisão em missões conta como uma única missão
  para: cenário jogável = cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso
  tipo: equivalente
  decisao: null
- criterio: D30.1
  de: premissa do jogo = a situação em que o jogador é colocado no início da primeira missão (papel do jogador, local, tarefa e problema a resolver), e missão é uma atividade com objetivo e condição de conclusão próprios, de modo que o jogo sem divisão em missões conta como uma única missão
  para:
  - premissa do jogo = a situação em que o jogador é colocado no início da primeira missão (papel do jogador, local, tarefa e problema a resolver)
  - missão = uma unidade do jogo com objetivo e condição de conclusão próprios (fase, capítulo ou nível, quando têm objetivo e condição de conclusão próprios), e o jogo sem divisão em missões conta como uma única missão
  tipo: equivalente
  decisao: null
- criterio: D34.1
  de: a ramificação apenas entre avançar para o próximo desafio e repetir o mesmo desafio não é personalização do desafio, e a missão X em vez da missão Y conta só se o objetivo, os itens, a quantidade ou o tempo do desafio diferem entre elas, e não se diferem só no enredo
  para:
  - mudança só do enredo, da aparência ou do texto de feedback não é personalização do desafio, e a ramificação apenas entre avançar para o próximo desafio e repetir o mesmo desafio também não é
  - a missão X em vez da missão Y conta só se o objetivo, os itens, a quantidade ou o tempo do desafio diferem entre elas, e não se diferem só no enredo
  tipo: equivalente
  decisao: null
- criterio: D39.1
  de: desafio = uma unidade do jogo com objetivo e condição de conclusão próprios (missão, minijogo ou etapa com condição de conclusão própria), e o jogo sem divisão em missões conta como uma única missão
  para: desafio = cada missão ou minijogo
  tipo: decisao
  decisao: 1
- criterio: D39.1
  de: cenário jogável = cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso, e o cenário em que nenhuma missão está em curso (hub, sandbox) não é cenário jogável
  para:
  - cenário jogável = cada espaço do jogo (mapa, sala ou fase) em que o jogador executa ações e em que há uma missão em curso
  - cenário em que nenhuma missão está em curso (hub, sandbox) não tem caminho obrigatório e não é cenário jogável
  tipo: equivalente
  decisao: null
