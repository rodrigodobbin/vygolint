remocoes:
- criterio: D09.1
  clausula: 'precedência: se o jogo avalia a opção escolhida como certa ou errada, ela é múltipla escolha, mesmo quando o texto também é exibido ou enviado como mensagem do jogador (por exemplo, montagem de frase por palavras com correção e opção de diálogo avaliada como certa ou errada)'
- criterio: D10.1
  clausula: sequência de diálogo em que o jogo não impõe nenhuma espera antes do avanço tem comprimento integral próximo de 0 e passa neste critério por construção, pois a validade dessa sequência é tratada por outras diretrizes (por exemplo, D03 e D04)
- criterio: D15.1
  clausula: duas ferramentas = distintas quando diferem no meio (texto, voz ou sinais predefinidos) ou na temporalidade (entrega em tempo real ou registro lido em sessão posterior)
- criterio: D15.1
  clausula: ferramenta conta para este critério mesmo = quando o critério D06.1 a graduaria como parcial
- criterio: D18.1
  clausula: 'este critério avalia só se a mensagem varia: a orientação da próxima ação é tratada em D17, e a mudança do desafio conforme o desempenho é tratada em D33 e D34'
- criterio: D19.1
  clausula: 'as funções psicológicas superiores avaliadas são cinco, e uma função é exigida por um desafio quando ele não pode ser concluído sem a operação descrita: memória é usar, na ação exigida, informação que o jogo exibiu antes e que deixou de estar visível ou audível no momento da ação'
- criterio: D19.1
  clausula: cada função conta por um elemento do desafio próprio dela, e um mesmo elemento não conta para duas funções
- criterio: D21.1
  clausula: a simulação substitui a ação do jogador quando, ao fim dela, o jogo registra o desafio como concluído (concede conclusão, pontuação ou progresso do desafio) sem que o jogador tenha agido, ou o jogador não pode mais jogar o desafio depois dela
- criterio: D30.1
  clausula: um elemento é o mínimo que liga a premissa ao referente, e a diretriz não fixa quantidade maior
- criterio: D30.1
  clausula: 'esta diretriz avalia só a premissa e o referente: a presença do conteúdo em situações do jogo é tratada em D31 e os objetos do cotidiano são tratados em D32'
- criterio: D31.1
  clausula: vídeo sozinho confirma o estado atendido só = quando todo objetivo listado é observado em situação real do jogo
- criterio: D31.1
  clausula: 'esta diretriz avalia a apresentação situada de cada objetivo em situação real do jogo, com referente real por objetivo: D30 avalia só a premissa do jogo e seu referente, e os objetos do cotidiano são tratados em D32'
- criterio: D32.1
  clausula: 'esta diretriz avalia só os objetos: a premissa com referente real é tratada em D30 e o conteúdo em situações do jogo é tratado em D31'
- criterio: D33.1
  clausula: desafio é personalizado por desempenho = quando o valor de um parâmetro do desafio posterior é definido por regra que lê a métrica de desempenho registrada do jogador e produz ao menos dois valores diferentes do parâmetro para ao menos dois valores diferentes da métrica, sendo esses valores de um parâmetro do desafio apresentado (nos termos da definição de parâmetro do desafio)
- criterio: D33.1
  clausula: se a regra lê acerto, erro, tempo, pontuação ou número de tentativas, a personalização é de desempenho (D33)
- criterio: D33.1
  clausula: a mudança só do texto de feedback é tratada em D18
- criterio: D34.1
  clausula: desafio é personalizado pelas ações do jogador = quando o valor de um parâmetro do desafio posterior é definido por regra que lê o valor da ação anterior do jogador e produz ao menos dois valores diferentes do parâmetro para ao menos dois valores diferentes da ação
